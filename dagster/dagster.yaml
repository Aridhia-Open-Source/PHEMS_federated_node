# Instance config baked into the image at $DAGSTER_HOME/dagster.yaml.
#
# Only the code (gRPC) server and `dagster dev` use this. The daemon, webserver and
# run pods get the Helm-generated instance config, which the dagster subchart mounts
# over this file. So keep this to settings that hold in any environment - anything
# Kubernetes-specific belongs in the chart, derived from values.

python_logs:
  dagster_handler_config:
    handlers:
      stdout:
        class: logging.StreamHandler
        level: INFO
        stream: ext://sys.stdout
      stderr:
        class: logging.StreamHandler
        level: ERROR
        stream: ext://sys.stderr

# Env vars come from the dagster-env-config ConfigMap and the Dagster password secret.
storage:
  postgres:
    postgres_db:
      db_name:
        env: DAGSTER_PG_NAME
      username:
        env: DAGSTER_PG_USER
      password:
        env: DAGSTER_PG_PASSWORD
      hostname:
        env: DAGSTER_PG_HOST
      port: 5432
