[project]
name = "phems"
description = "PHEMS Federated Node - Dagster Code Location"
authors = [{ name = "George Eddie", email = "george.eddie@aridhia.com" }]
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "dagster~=1.13.3",
    "dagster-k8s~=0.29.3",
    "dagster-postgres~=0.29.3",
    "dagster-graphql~=1.13.3",
    "requests~=2.32",
    "pydantic~=2.0",
    "pydantic-settings~=2.0",
    "kubernetes~=35.0",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.3",
    "pytest-mock~=3.14",
    "pylint~=4.0.5",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["app/tests", "../nexus/fednode/tests"]

[tool.dagster]
module_name = "app.definitions"
code_location_name = "code"