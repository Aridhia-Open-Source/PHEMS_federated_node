[project]
name = "phems"
description = "PHEMS Federated Node - Dagster Code Location"
authors = [{ name = "George Eddie", email = "george.eddie@aridhia.com" }]
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "dagster~=1.12",
    "dagster-k8s~=0.28",
    "dagster-postgres~=0.28",
    "dagster-graphql~=1.12",
    "requests~=2.32",
    "pydantic~=2.0",
    "pydantic-settings~=2.0",
    "kubernetes~=35.0",
]

[project.scripts]
fncli = "fncli.cli:cli"

[project.optional-dependencies]
cli = [
    "click~=8.1",
    "python-dotenv~=1.0",
]
dev = [
    "pytest~=8.3",
    "pytest-mock~=3.14",
    "pylint~=4.0.5",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

# fncli is the dev CLI, installed with the `cli` extra. Its tests run in the Dagster test image.
[tool.setuptools.packages.find]
include = ["app*", "fncli*"]

[tool.pytest.ini_options]
testpaths = ["app/tests", "fncli/tests"]

[tool.dagster]
module_name = "app.definitions"
code_location_name = "code"