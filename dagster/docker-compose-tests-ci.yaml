name: dagster_tests
services:
  base:
    image: dagster_fn_base
    build:
      context: .
      dockerfile: Dockerfile
      # The shared nexus-api client, as docker-bake.hcl passes it
      additional_contexts:
        nexus-client: ../nexus/client
  app:
    image: dagster_app_test
    build:
      context: .
      dockerfile: build/test.Dockerfile
    volumes:
      # test_enum_drift.py parses the nexus-api enums, which live outside this build context
      - ../nexus/api/app/models:/opt/dagster/nexus/api/app/models:ro
      # The client's tests (testpaths ../nexus/client/tests); the image installs the client editable here
      - ../nexus/client:/opt/dagster/nexus/client
