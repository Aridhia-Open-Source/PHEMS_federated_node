name: dagster_tests
services:
  base:
    image: dagster_fn_base
    build:
      context: .
      dockerfile: Dockerfile
  app:
    image: dagster_app_test
    build:
      context: .
      dockerfile: build/test.Dockerfile
    volumes:
      # test_enum_drift.py parses the nexus-api enums, which live outside this build context
      - ../nexus/api/app/models:/opt/dagster/nexus/api/app/models:ro
