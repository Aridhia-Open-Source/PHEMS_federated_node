{{/*
Generated on first install, reused on every upgrade. Hooks, so they exist before the init
Job and survive `helm uninstall`: the database files on the host outlive the release, and a
new superuser password would no longer match them.
*/}}
{{- $secrets := list .Values.postgres.secret -}}
{{- range $key, $db := .Values.dbs -}}
{{- $secrets = append $secrets $db.secret -}}
{{- end -}}
{{- range $secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-3"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
data:
  {{ .key }}: {{ include "experiments.password" (dict "namespace" $.Release.Namespace "name" .name "key" .key) | quote }}
---
{{- end }}
