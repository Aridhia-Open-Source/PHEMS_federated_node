{{/*
Generated on first install, reused on every upgrade. Hooks, so they exist before the init
Job and survive `helm uninstall`: the database files on the host outlive the release, and a
new superuser password would no longer match them. Each also carries the role's name as
`username`.
*/}}
{{- $secrets := list (dict "secret" .Values.postgres.secret "user" .Values.postgres.superuser) -}}
{{- range $key, $db := .Values.dbs -}}
{{- $secrets = append $secrets (dict "secret" $db.secret "user" $db.user) -}}
{{- end -}}
{{- range $entry := $secrets }}
{{- $secret := $entry.secret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret.name }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-3"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
data:
  {{ $secret.key }}: {{ include "experiments.password" (dict "namespace" $.Release.Namespace "name" $secret.name "key" $secret.key) | quote }}
  username: {{ $entry.user | b64enc | quote }}
---
{{- end }}
