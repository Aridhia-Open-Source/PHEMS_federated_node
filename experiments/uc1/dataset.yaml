# The dataset of the uc1 experiment and the secret holding its database login, as node resources. `fncli experiment
# setup uc1` applies this file and `teardown uc1` deletes it (`fncli delete --all -f` does). Both values of the
# login are read from the secret that the experiments chart makes for uc1-omop, so no secret value is in the file.
# The names match values.yaml: dbs.uc1.name is the dataset's name and dbs.uc1.secret.name the chart's secret
# (`setup` checks this). Projects are assigned the dataset by name, from their own node file:
# bootstrap/examples/projects/uc1.yaml (`datasets: [uc1-omop]`).
version: 1

secrets:
  uc1-omop-dataset-creds:
    values:
      USERNAME: {k8s_secret: {name: db-datasets-uc1, namespace: experiments, key: username}}
      PASSWORD: {k8s_secret: {name: db-datasets-uc1, namespace: experiments, key: password}}

datasets:                                          # dataset names are unique across the whole node
  - name: uc1-omop
    type: postgres
    host: db-datasets.experiments.svc
    port: 5432
    read_schema: cdm
    write_schema: results
    secret: uc1-omop-dataset-creds
