name: Docs

on:
  pull_request:
    paths:
      - "wiki/**"
      - "mkdocs.yml"
      - "docs-requirements.txt"
  push:
    branches:
      - main
    paths:
      - "wiki/**"
      - "mkdocs.yml"
      - "docs-requirements.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs-requirements.txt
      - run: pip install -r docs-requirements.txt
      - run: mkdocs build --strict
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Shared with the release job in build.yml: both push to gh-pages
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs-requirements.txt
      - run: pip install -r docs-requirements.txt
      - name: Fetch gh-pages
        run: git fetch origin gh-pages --depth=1
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Deploy 1.x to gh-pages docs/manual
        run: |
          mike deploy --deploy-prefix docs/manual --push --update-aliases 1.x
          mike set-default --deploy-prefix docs/manual --push 1.x
