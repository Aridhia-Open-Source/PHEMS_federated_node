name: Docs

# Branch previews: each docs/versions/<version>/ folder on a branch is built into
# gh-pages docs/docs/<branch>/<version>/, served at
# https://<owner>.github.io/<repo>/docs/<branch>/<version>/ (slashes in the branch name
# become dashes; dagster-develop and dagster-main are beta/develop and beta/main). The
# version dropdown (mike) lists only the versions that branch has, and /docs/<branch>/
# opens the newest.
# Pull requests build every version with --strict.
# One publish job does all the publishing: every run rebuilds the previews of the trunk
# branches, every open pull request and the branch that triggered it, and writes the whole
# docs/docs tree to gh-pages in a single commit. Many pushes at once therefore cancel each
# other down to the newest run, which has everything, instead of racing on gh-pages.
# Branches with no open pull request keep their last preview until the branch is deleted;
# a deleted branch's preview goes at the next run.

on:
  pull_request:
    paths:
      - "docs/versions/**"
      - "docs/hooks/**"
      - "docs-requirements.txt"
      - ".github/workflows/docs.yml"
      - "webserver/app/static/openapi.json"
      - "nexus/api/openapi.json"
  push:
    branches:
      - "**"
    paths:
      - "docs/versions/**"
      - "docs/hooks/**"
      - "docs-requirements.txt"
      - ".github/workflows/docs.yml"
      - "webserver/app/static/openapi.json"
      - "nexus/api/openapi.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs-requirements.txt
      - run: pip install -r docs-requirements.txt
      - name: Build every version
        run: |
          for config in docs/versions/*/mkdocs.yml; do
            version=$(basename "$(dirname "$config")")
            mkdocs build --strict -f "$config" -d "$GITHUB_WORKSPACE/site/$version"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/

  publish:
    if: contains(fromJSON('["push","workflow_dispatch"]'), github.event_name) && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
      pull-requests: read
    # The only publisher, one at a time. The newest run wins: it rebuilds every branch, so
    # cancelling an older run loses nothing. The chart release (build.yml) also pushes
    # gh-pages, so the push below retries on a rejection instead of sharing a lock with it.
    concurrency:
      group: docs-publish
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ github.token }}
      NO_MKDOCS_2_WARNING: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs-requirements.txt
      - run: pip install -r docs-requirements.txt

      - name: Build the branch previews into site/docs
        run: |
          # No -e: one branch failing to build must not stop the others.
          set +e
          set -uo pipefail
          repo_url="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/docs"
          work="$RUNNER_TEMP/docs"
          rm -rf "$work" site
          mkdir -p "$work/prev" site/docs
          : > "$work/results.tsv"

          # What a branch's output depends on besides its own commit: the installed tools and
          # the layout below. Bump layout-N when this job changes what a preview contains.
          tools=$({ pip freeze; echo layout-1; } | sha256sum | cut -c1-12)

          # The 2.x line sits under beta/ until beta ships; other branches: / becomes -
          slug_of() {
            case "$1" in
              dagster-develop) echo beta/develop ;;
              dagster-main) echo beta/main ;;
              *) echo "${1//\//-}" ;;
            esac
          }

          # branch, commit, result, deployment state (success|failure|none), preview url or -
          record() { printf '%s\t%s\t%s\t%s\t%s\n' "$@" >> "$work/results.tsv"; }

          # Copy a branch's published preview from gh-pages into site/docs (the cache, and what
          # keeps a preview alive when its branch is not rebuilt). Fails if there is none.
          restore_previous() {
            local slug=$1
            git cat-file -e "origin/gh-pages:docs/docs/$slug/versions.json" 2>/dev/null || return 1
            rm -rf "$work/prev/docs" "site/docs/$slug"
            if git archive origin/gh-pages "docs/docs/$slug" | tar -x -C "$work/prev"; then
              mkdir -p "$(dirname "site/docs/$slug")"
              mv "$work/prev/docs/docs/$slug" "site/docs/$slug" && return 0
            fi
            rm -rf "$work/prev/docs" "site/docs/$slug"
            return 1
          }

          # The mike redirect page: $1 is the folder to open
          redirect_page() {
          cat <<HTML
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Redirecting</title>
            <noscript>
              <meta http-equiv="refresh" content="1; url=$1/" />
            </noscript>
            <script>
              window.location.replace(
                "$1/" + window.location.search + window.location.hash
              );
            </script>
          </head>
          <body>
            Redirecting to <a href="$1/">$1/</a>...
          </body>
          </html>
          HTML
          }

          # Build every version of branch $1 into $work/out/$2, then move it to site/docs/$2.
          # Returns 0 built, 2 no docs on the branch, 1 failed. Sets built_sha.
          build_branch() {
            local b=$1 slug=$2 src="$work/src/$2" out="$work/out/$2" versions v cfg p
            local paths=(docs/versions)
            rm -rf "$src" "$out"
            mkdir -p "$src" "$out"
            git fetch -q --depth=1 origin "+refs/heads/$b:refs/remotes/origin/$b" || return 1
            built_sha=$(git rev-parse "refs/remotes/origin/$b") || return 1
            git cat-file -e "$built_sha:docs/versions" 2>/dev/null || return 2
            # The hooks, and the openapi.json that the swagger-ui pages link to
            for p in docs/hooks nexus/api/openapi.json webserver/app/static/openapi.json; do
              if git cat-file -e "$built_sha:$p" 2>/dev/null; then paths+=("$p"); fi
            done
            git archive "$built_sha" "${paths[@]}" | tar -x -C "$src" || return 1
            versions=$(for cfg in "$src"/docs/versions/*/mkdocs.yml; do
              [ -f "$cfg" ] && basename "$(dirname "$cfg")"
            done | sort -V)
            [ -n "$versions" ] || return 2
            for v in $versions; do
              cfg="$src/docs/versions/$v/mkdocs.yml"
              # Canonical links and the sitemap point at this branch's site, with the version
              sed -i "s|^site_url: .*|site_url: $repo_url/$slug/$v/|" "$cfg"
              mkdocs build -q -f "$cfg" -d "$out/$v" || return 1
            done
            # The mike version dropdown file (newest first) and the redirect to the newest
            printf '%s\n' $versions | sort -rV | jq -R '{version: ., title: ., aliases: []}' | jq -s . > "$out/versions.json" || return 1
            redirect_page "$(tail -1 <<< "$versions")" > "$out/index.html"
            echo "$built_sha $tools" > "$out/.built"
            rm -rf "site/docs/$slug"
            mkdir -p "$(dirname "site/docs/$slug")"
            mv "$out" "site/docs/$slug"
          }

          git fetch -q --depth=1 origin +refs/heads/gh-pages:refs/remotes/origin/gh-pages || { echo "::error::Cannot fetch gh-pages"; exit 1; }

          declare -A tip owner
          while read -r sha ref; do tip["${ref#refs/heads/}"]=$sha; done < <(git ls-remote --heads origin)
          [ "${#tip[@]}" -gt 0 ] || { echo "::error::No branches listed"; exit 1; }

          # Pull requests from forks have no branch here
          gh pr list --state open --limit 200 --json headRefName,isCrossRepository \
            --jq '.[] | select(.isCrossRepository | not) | .headRefName' > "$work/pr-branches.txt" \
            || { echo "::error::Cannot list pull requests"; exit 1; }
          branches=$(printf '%s\n' dagster-develop dagster-main main "$(cat "$work/pr-branches.txt")" "$GITHUB_REF_NAME" | awk 'NF && !seen[$0]++')

          while read -r b <&3; do
            sha=${tip[$b]:-}
            if [ -z "$sha" ]; then
              record "$b" - "skipped (no such branch on origin)" none -
              continue
            fi
            slug=$(slug_of "$b")
            if [ -n "${owner[$slug]:-}" ]; then
              record "$b" "$sha" "skipped (same folder as ${owner[$slug]})" none -
              continue
            fi
            owner[$slug]=$b
            url="$repo_url/$slug/"
            # Unchanged since the last publish: reuse what is on gh-pages
            if [ "$(git show "origin/gh-pages:docs/docs/$slug/.built" 2>/dev/null)" = "$sha $tools" ] && restore_previous "$slug"; then
              record "$b" "$sha" "skipped (unchanged)" success "$url"
              continue
            fi
            echo "::group::Build $b ($slug)"
            built_sha=$sha
            build_branch "$b" "$slug"
            rc=$?
            echo "::endgroup::"
            case $rc in
              0) record "$b" "$built_sha" built success "$url" ;;
              2) record "$b" "$built_sha" "skipped (no docs/versions on the branch)" none - ;;
              *)
                echo "::warning title=Docs preview failed::$b did not build, see its log group"
                if restore_previous "$slug"; then
                  record "$b" "$built_sha" "failed (last good preview kept)" failure "$url"
                else
                  record "$b" "$built_sha" failed failure -
                fi ;;
            esac
          done 3<<< "$branches"

          # Other branches that still exist keep their last preview, as before; only the
          # previews of deleted branches go.
          carried=0
          while read -r b <&3; do
            slug=$(slug_of "$b")
            [ -z "${owner[$slug]:-}" ] || continue
            owner[$slug]=$b
            if restore_previous "$slug"; then carried=$((carried + 1)); fi
          done 3< <(printf '%s\n' "${!tip[@]}")

          # main only: /docs/ opens main's docs
          if [ -d site/docs/main ]; then redirect_page main > site/docs/index.html; fi

          {
            echo "### Docs previews"
            echo
            echo "| Branch | Result | Preview |"
            echo "|---|---|---|"
            while IFS=$'\t' read -r b sha result state url; do
              if [ "$url" = - ]; then link=-; else link="[$url]($url)"; fi
              echo "| \`$b\` | $result | $link |"
            done < "$work/results.tsv"
            echo
            awk -F'\t' -v carried="$carried" '
              $3 == "built" { built++ }
              $3 ~ /^skipped/ { skipped++ }
              $3 ~ /^failed/ { failed++ }
              END { printf "%d built, %d skipped, %d failed. %d other branch previews kept as they were.\n", built, skipped, failed, carried }
            ' "$work/results.tsv"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Publish site/docs to gh-pages docs/docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          count=$(find site/docs -name versions.json | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::Nothing was built, leaving gh-pages as it is"
            exit 1
          fi
          # One commit replaces docs/docs (the chart repository and the rest of gh-pages stay).
          # If the chart release pushed in between, start again from the new gh-pages.
          for attempt in 1 2 3 4 5; do
            git fetch -q --depth=1 origin +refs/heads/gh-pages:refs/remotes/origin/gh-pages
            rm -rf pages
            git worktree prune
            git worktree add -q --no-checkout --detach pages refs/remotes/origin/gh-pages
            git -C pages read-tree HEAD
            git -C pages rm -rq --cached --ignore-unmatch docs/docs
            mkdir -p pages/docs
            cp -a site/docs pages/docs/docs
            git -C pages add -A -f docs/docs
            if git -C pages diff --cached --quiet HEAD; then
              echo "gh-pages already has these previews"
              echo "gh-pages already had these $count previews." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git -C pages commit -q -m "Publish docs previews ($GITHUB_REF_NAME ${GITHUB_SHA::7}, $count branches)"
            if git -C pages push -q origin HEAD:gh-pages; then
              echo "Published $count previews to gh-pages."
              echo "Published $count previews to gh-pages." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "gh-pages moved, retrying ($attempt/5)"
            sleep $((attempt * 5))
          done
          exit 1

      # A failing status must not fail the run: the previews are already live.
      - name: Set the docs-preview deployment status on each open pull request
        continue-on-error: true
        run: |
          set +e
          results="$RUNNER_TEMP/docs/results.tsv"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          while IFS=$'\t' read -r b sha result state url <&3; do
            [ "$state" != none ] || continue
            grep -qxF -- "$b" "$RUNNER_TEMP/docs/pr-branches.txt" || continue
            id=$(gh api "repos/$GITHUB_REPOSITORY/deployments?sha=$sha&environment=docs-preview&per_page=1" --jq '.[0].id // empty')
            if [ -z "$id" ]; then
              id=$(jq -n --arg ref "$sha" '{ref: $ref, environment: "docs-preview", description: "Docs preview", auto_merge: false, required_contexts: [], transient_environment: true, production_environment: false}' \
                | gh api -X POST "repos/$GITHUB_REPOSITORY/deployments" --input - --jq .id)
            fi
            if [ -z "$id" ]; then echo "::warning::No deployment for $b"; continue; fi
            last=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=1" --jq '.[0].state // empty')
            [ "$last" != "$state" ] || continue
            if [ "$state" = success ]; then
              gh api -X POST "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" -f state=success \
                -f description="Docs preview" -f environment_url="$url" -f log_url="$run_url" --silent
            else
              gh api -X POST "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" -f state=failure \
                -f description="Docs build failed" -f log_url="$run_url" --silent
            fi || echo "::warning::Deployment status failed for $b"
          done 3< "$results"
