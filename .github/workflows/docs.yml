name: Docs

# Every branch publishes its own docs: each docs/versions/<version>/ folder on the branch
# goes to gh-pages docs/docs/<branch>/<version>/, served at
# https://<owner>.github.io/<repo>/docs/<branch>/<version>/ (slashes in the branch name
# become dashes). The version dropdown (mike) lists only the versions that branch has, and
# /docs/<branch>/ opens the newest. A deleted branch takes its docs with it.
# Pull requests build every version with --strict.

on:
  pull_request:
    paths:
      - "docs/versions/**"
      - "docs/hooks/**"
      - "docs-requirements.txt"
      - ".github/workflows/docs.yml"
      - "webserver/app/static/openapi.json"
      - "nexus/api/openapi.json"
  push:
    branches:
      - "**"
    paths:
      - "docs/versions/**"
      - "docs/hooks/**"
      - "docs-requirements.txt"
      - ".github/workflows/docs.yml"
      - "webserver/app/static/openapi.json"
      - "nexus/api/openapi.json"
  delete:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs-requirements.txt
      - run: pip install -r docs-requirements.txt
      - name: Build every version
        run: |
          for config in docs/versions/*/mkdocs.yml; do
            version=$(basename "$(dirname "$config")")
            mkdocs build --strict -f "$config" -d "$GITHUB_WORKSPACE/site/$version"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/

  publish:
    if: contains(fromJSON('["push","workflow_dispatch"]'), github.event_name) && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    # One publish per branch at a time; the newest wins. The chart release (build.yml) also
    # pushes gh-pages, so the push retries on a rejection instead of sharing a lock with it.
    concurrency:
      group: docs-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs-requirements.txt
      - run: pip install -r docs-requirements.txt
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Publish to gh-pages docs/docs/<branch>
        run: |
          slug="${GITHUB_REF_NAME//\//-}"
          prefix="docs/docs/$slug"
          site_url="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/docs/$slug/"
          versions=$(for config in docs/versions/*/mkdocs.yml; do basename "$(dirname "$config")"; done | sort -V)
          newest=$(tail -1 <<< "$versions")
          # Canonical links and the sitemap point at this branch's site; mike adds the version
          for v in $versions; do
            sed -i "s|^site_url: .*|site_url: $site_url|" "docs/versions/$v/mkdocs.yml"
          done

          # One-time migration, removable once develop and dagster-develop have both
          # published with this file: the docs used to sit flat in docs/docs (one folder per
          # version listed in docs/docs/versions.json) with the 2.x docs under docs/docs/beta
          # and the branch previews under docs/preview. Remove only those; gh-pages also holds
          # the Helm chart repository and Swagger UI.
          remove_old_layout() {
            git cat-file -e gh-pages:docs/docs/versions.json 2>/dev/null || return 0
            rm -rf pages
            git worktree add -q --detach pages gh-pages
            old=$(jq -r '.[] | (.version, .aliases[]) | select(length > 0) | "docs/docs/" + .' pages/docs/docs/versions.json)
            if grep -q Redirecting pages/docs/docs/index.html 2>/dev/null; then
              git -C pages rm -q docs/docs/index.html
            fi
            git -C pages rm -rq --ignore-unmatch -- $old docs/docs/versions.json docs/docs/beta docs/preview
            git -C pages commit -q -m "Remove the old flat docs layout"
            git branch -f gh-pages "$(git -C pages rev-parse HEAD)"
            git worktree remove --force pages
          }

          # main only: /docs/ opens main's docs
          write_root_redirect() {
            rm -rf pages
            git worktree add -q --detach pages gh-pages
            cat > pages/docs/docs/index.html <<'HTML'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Redirecting</title>
            <meta http-equiv="refresh" content="0; url=main/">
          </head>
          <body>
            Redirecting to <a href="main/">main/</a>...
          </body>
          </html>
          HTML
            git -C pages add docs/docs/index.html
            if ! git -C pages diff --cached --quiet; then
              git -C pages commit -q -m "Docs root redirects to /docs/main/"
              git branch -f gh-pages "$(git -C pages rev-parse HEAD)"
            fi
            git worktree remove --force pages
          }

          # Commit onto the latest gh-pages and push; if another job pushed in between,
          # start again from the new gh-pages, up to 5 times.
          for attempt in 1 2 3 4 5; do
            git fetch origin gh-pages --depth=1
            git branch -f gh-pages FETCH_HEAD
            remove_old_layout
            for v in $versions; do
              mike deploy -F "docs/versions/$v/mkdocs.yml" --deploy-prefix "$prefix" "$v"
            done
            mike set-default -F "docs/versions/$newest/mkdocs.yml" --deploy-prefix "$prefix" "$newest"
            if [ "$GITHUB_REF_NAME" = main ]; then write_root_redirect; fi
            if git push origin gh-pages; then
              echo "Docs: $site_url" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "gh-pages moved, retrying ($attempt/5)"
            sleep $((attempt * 5))
          done
          exit 1

  # A deleted branch takes its docs with it. GitHub runs delete workflows from the default
  # branch's copy of this file, so this starts working once the file is on main.
  cleanup:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    # github.ref is the default branch on a delete, so the group uses the deleted ref. It is
    # the same group as publish, so a publish still running for that branch is cancelled.
    concurrency:
      group: docs-refs/heads/${{ github.event.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Remove docs/docs/<branch>
        env:
          BRANCH: ${{ github.event.ref }}
        run: |
          slug="${BRANCH//\//-}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            [ -d "docs/docs/$slug" ] || exit 0
            git rm -rq "docs/docs/$slug"
            git commit -q -m "Remove the docs of branch $BRANCH"
            if git push origin HEAD:gh-pages; then
              exit 0
            fi
            git fetch origin gh-pages --depth=1
            git reset -q --hard FETCH_HEAD
            sleep $((attempt * 5))
          done
          exit 1
