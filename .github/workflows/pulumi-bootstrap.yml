name: Pulumi deployment bootstrap

on:
  pull_request:
    paths:
      - ".github/workflows/pulumi-bootstrap.yml"
      - "pulumi/bootstrap/**"
      - "pulumi/README.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pulumi-bootstrap.yml"
      - "pulumi/bootstrap/**"
      - "pulumi/README.md"
  workflow_dispatch:
    inputs:
      stack:
        description: Pulumi stack to update
        required: true
        default: production
        type: string
      repository:
        description: GitHub repository to manage
        required: true
        default: phems-deployment
        type: string
      environments:
        description: Comma-separated deployment environments
        required: true
        default: develop
        type: string

permissions:
  contents: read

concurrency:
  group: pulumi-bootstrap-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || inputs.stack || vars.PULUMI_STACK || 'production' }}
  cancel-in-progress: false

jobs:
  preview:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PULUMI_BACKEND_URL: ${{ vars.PULUMI_BACKEND_URL || 'https://api.pulumi.com' }}
      STACK: pr-${{ github.event.pull_request.number }}
      REPOSITORY: phems-pr-${{ github.event.pull_request.number }}-deployment
      ENVIRONMENTS: develop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pulumi dependencies
        working-directory: pulumi/bootstrap
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: Set up Pulumi CLI
        uses: pulumi/actions@v6
        with:
          pulumi-version: "^3"
      - name: Configure preview stack
        working-directory: pulumi/bootstrap
        run: |
          set -euo pipefail
          pulumi stack select "$STACK" || pulumi stack init "$STACK"
          pulumi config set github:owner "$GITHUB_REPOSITORY_OWNER"
          pulumi config set repository "$REPOSITORY"
          pulumi config set environments "$ENVIRONMENTS"
      - uses: pulumi/actions@v6
        with:
          command: preview
          stack-name: ${{ env.STACK }}
          work-dir: pulumi/bootstrap

  apply:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: pulumi-bootstrap
      url: https://app.pulumi.com
    env:
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PULUMI_BACKEND_URL: ${{ vars.PULUMI_BACKEND_URL || 'https://api.pulumi.com' }}
      STACK: ${{ inputs.stack || vars.PULUMI_STACK || 'production' }}
      REPOSITORY: ${{ inputs.repository || vars.PULUMI_REPOSITORY || 'phems-deployment' }}
      ENVIRONMENTS: ${{ inputs.environments || vars.PULUMI_ENVIRONMENTS || 'develop' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pulumi dependencies
        working-directory: pulumi/bootstrap
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: Set up Pulumi CLI
        uses: pulumi/actions@v6
        with:
          pulumi-version: "^3"
      - name: Validate deployment inputs
        run: |
          set -euo pipefail
          [[ "$STACK" =~ ^[a-z0-9][a-z0-9-]{0,62}$ ]]
          [[ "$REPOSITORY" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$ ]]
          IFS=',' read -ra RAW_ENVIRONMENTS <<< "$ENVIRONMENTS"
          [[ "${#RAW_ENVIRONMENTS[@]}" -gt 0 ]]
          declare -A SEEN=()
          for raw_environment in "${RAW_ENVIRONMENTS[@]}"; do
            environment="$(printf '%s' "$raw_environment" | xargs)"
            [[ "$environment" =~ ^[a-z][a-z0-9-]{0,62}$ ]]
            [[ -z "${SEEN[$environment]+x}" ]]
            SEEN["$environment"]=1
          done
      - name: Configure apply stack
        working-directory: pulumi/bootstrap
        run: |
          set -euo pipefail
          pulumi stack select "$STACK" || pulumi stack init "$STACK"
          pulumi config set github:owner "$GITHUB_REPOSITORY_OWNER"
          pulumi config set repository "$REPOSITORY"
          pulumi config set environments "$ENVIRONMENTS"
      - uses: pulumi/actions@v6
        with:
          command: up
          stack-name: ${{ env.STACK }}
          work-dir: pulumi/bootstrap
          args: --yes
