name: Pulumi deployment bootstrap

on:
  pull_request:
    paths:
      - ".github/workflows/pulumi-bootstrap.yml"
      - "pulumi/bootstrap/**"
      - "pulumi/README.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pulumi-bootstrap.yml"
      - "pulumi/bootstrap/**"
      - "pulumi/README.md"
  workflow_dispatch:
    inputs:
      repository:
        description: GitHub repository to manage
        required: true
        default: phems-deployment
        type: string
      environments:
        description: Comma-separated deployment environments
        required: true
        default: develop
        type: string

permissions:
  contents: read

concurrency:
  group: pulumi-bootstrap-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || inputs.repository || vars.PULUMI_REPOSITORY || 'phems-deployment' }}
  cancel-in-progress: false

jobs:
  preview:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: pulumi-bootstrap
    env:
      STACK: pr-${{ github.event.pull_request.number }}
      REPOSITORY: phems-pr-${{ github.event.pull_request.number }}-deployment
      ENVIRONMENTS: develop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Pulumi dependencies
        working-directory: pulumi/bootstrap
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: Set up Pulumi CLI
        uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 # v6.6.1
        with:
          pulumi-version: "^3"
      - name: Create GitHub App token
        id: github-app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.PULUMI_GITHUB_APP_ID }}
          private-key: ${{ secrets.PULUMI_GITHUB_APP_PRIVATE_KEY }}
          # creating the deployment repository needs the installation's org-wide access; repositories: cannot name a repo that does not exist yet
          owner: Aridhia-Open-Source # zizmor: ignore[github-app]
          # preview only reads the deployment repository
          permission-administration: read
          permission-contents: read
      - name: Configure ephemeral Pulumi passphrase
        run: |
          set -euo pipefail
          printf 'PULUMI_CONFIG_PASSPHRASE=%s\n' "$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Configure preview stack
        working-directory: pulumi/bootstrap
        env:
          GITHUB_TOKEN: ${{ steps.github-app-token.outputs.token }}
        run: |
          set -euo pipefail
          pulumi login --local
          pulumi stack select "$STACK" || pulumi stack init "$STACK"
          pulumi config set github:owner Aridhia-Open-Source
          pulumi config set repository "$REPOSITORY"
          pulumi config set environments "$ENVIRONMENTS"
      - uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 # v6.6.1
        env:
          GITHUB_TOKEN: ${{ steps.github-app-token.outputs.token }}
        with:
          command: preview
          stack-name: ${{ env.STACK }}
          work-dir: pulumi/bootstrap

  apply:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: pulumi-bootstrap
    env:
      REPOSITORY: ${{ inputs.repository || vars.PULUMI_REPOSITORY || 'phems-deployment' }}
      STACK: ${{ inputs.repository || vars.PULUMI_REPOSITORY || 'phems-deployment' }}
      ENVIRONMENTS: ${{ inputs.environments || vars.PULUMI_ENVIRONMENTS || 'develop' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Pulumi dependencies
        working-directory: pulumi/bootstrap
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: Set up Pulumi CLI
        uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 # v6.6.1
        with:
          pulumi-version: "^3"
      - name: Create GitHub App token
        id: github-app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.PULUMI_GITHUB_APP_ID }}
          private-key: ${{ secrets.PULUMI_GITHUB_APP_PRIVATE_KEY }}
          # creating the deployment repository needs the installation's org-wide access; repositories: cannot name a repo that does not exist yet
          owner: Aridhia-Open-Source # zizmor: ignore[github-app]
          # apply creates the deployment repository and writes its files
          permission-administration: write
          permission-contents: write
      - name: Configure ephemeral Pulumi passphrase
        run: |
          set -euo pipefail
          printf 'PULUMI_CONFIG_PASSPHRASE=%s\n' "$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Validate deployment inputs
        run: |
          set -euo pipefail
          [[ "$STACK" =~ ^[a-z0-9][a-z0-9-]{0,62}$ ]]
          [[ "$REPOSITORY" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$ ]]
          IFS=',' read -ra RAW_ENVIRONMENTS <<< "$ENVIRONMENTS"
          [[ "${#RAW_ENVIRONMENTS[@]}" -gt 0 ]]
          declare -A SEEN=()
          for raw_environment in "${RAW_ENVIRONMENTS[@]}"; do
            environment="$(printf '%s' "$raw_environment" | xargs)"
            [[ "$environment" =~ ^[a-z][a-z0-9-]{0,62}$ ]]
            [[ -z "${SEEN[$environment]+x}" ]]
            SEEN["$environment"]=1
          done
      - name: Configure apply stack
        working-directory: pulumi/bootstrap
        env:
          GITHUB_TOKEN: ${{ steps.github-app-token.outputs.token }}
        run: |
          set -euo pipefail
          pulumi login --local
          pulumi stack select "$STACK" || pulumi stack init "$STACK"
          pulumi config set github:owner Aridhia-Open-Source
          pulumi config set repository "$REPOSITORY"
          pulumi config set environments "$ENVIRONMENTS"
      - uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 # v6.6.1
        env:
          GITHUB_TOKEN: ${{ steps.github-app-token.outputs.token }}
        with:
          command: up
          stack-name: ${{ env.STACK }}
          work-dir: pulumi/bootstrap
