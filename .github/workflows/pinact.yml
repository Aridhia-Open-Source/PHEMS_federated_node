name: Pinact

# Every Action pinned to a full commit SHA (ADR 0044). Fails on an unpinned one.

on:
  pull_request:
    paths:
      - ".github/**"
      - "mise.toml"
      - "mise.lock"
  push:
    branches: [main, dagster-develop]
    paths:
      - ".github/**"
  workflow_dispatch:

permissions: {}

jobs:
  pinact:
    name: Actions are pinned
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs pinact at the version in mise.toml, checked against mise.lock
      - name: Install pinact
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: pinact
      - name: Check the pins
        run: pinact run --check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
