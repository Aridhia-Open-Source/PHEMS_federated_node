name: Build Docker Image
run-name: Building images
on:
  workflow_dispatch:
  push:
    tags:
      - '**'
    branches:
      - main
      - develop
      - dagster-main
      - dagster-develop
    paths-ignore:
      - '**/*.md'
      - 'README'
      - 'LICENSE'
      - 'DEPLOYMENT'
      - 'images/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'
      - 'Makefile'
      - '.gitignore'
      - 'sub-license/**'
      - 'environment/*.md'
      - 'paper/**'
  pull_request:
    branches:
      - main
      - develop
      - dagster-main
      - dagster-develop
    paths-ignore:
      - '**/*.md'
      - 'README'
      - 'LICENSE'
      - 'DEPLOYMENT'
      - 'images/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'
      - 'Makefile'
      - '.gitignore'
      - 'sub-license/**'
      - 'environment/*.md'
      - 'paper/**'
env:
  TAG: ''
  OWNER_LC: ''
  HELM_CHANNEL: stable
  IS_TAG: ${{ github.ref_type == 'tag' }}

permissions:
  contents: write
  packages: write

jobs:
  init:
    runs-on: ubuntu-latest
    outputs:
      is_tag: ${{ steps.vars.outputs.IS_TAG }}
      chart_version: ${{ steps.vars.outputs.CHART_VERSION }}
      tag: ${{ steps.vars.outputs.TAG }}
      rc_tag: ${{ steps.vars.outputs.RC_TAG }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the version suffix counts merges
      - name: Setting global values
        id: vars
        run: |
          echo "IS_TAG=${{ env.IS_TAG }}" >> ${GITHUB_OUTPUT}

          echo "Setting version according to the Chart.yaml"
          cd k8s/federated-node

          version=$(grep '^version:.*' Chart.yaml | sed 's/^.*: //')
          echo "Chart version: ${version}"
          appVersion=$(grep '^appVersion:.*' Chart.yaml | sed 's/^.*: \"//'| sed 's/\"//')
          echo "Chart appVersion: ${appVersion}"

          # N counts the merges since the chart version last changed, so it restarts at 1 after
          # every version bump and the same commit always gets the same N.
          base=$(git log -1 --first-parent --format=%H -G'^version:' -- Chart.yaml)
          n=$(( $(git rev-list --count --first-parent "${base}..HEAD") + 1 ))
          # "g" (as in git describe) stops an all-digit sha being an invalid semver part.
          sha="${{ github.event.pull_request.head.sha || github.sha }}"
          sha="g${sha::6}"

          if [[ "${{ env.IS_TAG }}" == "true" ]]; then
            # Releases reuse the images main built for the tagged commit (see the promote job)
            suffix=""
            echo "RC_TAG=${appVersion}-rc.${n}" >> ${GITHUB_OUTPUT}
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            suffix="-pr.${{ github.event.pull_request.number }}.${sha}"
          else
            case "${{ github.ref_name }}" in
              main) suffix="-rc.${n}" ;;
              develop) suffix="-beta.${n}" ;;
              # The dagster prefix stays until the dagster line merges into develop and main
              dagster-main) suffix="-dagster-beta.${n}" ;;
              dagster-develop) suffix="-dagster-alpha.${n}" ;;
              *) suffix="-branch.${sha}" ;;
            esac
          fi
          echo "CHART_VERSION=${version}${suffix}" >> ${GITHUB_OUTPUT}
          echo "TAG=${appVersion}${suffix}" >> ${GITHUB_OUTPUT}
      - name: set lower case owner name
        run: |
          echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'
  linters:
    needs: init
    if: needs.init.outputs.is_tag == 'false'
    defaults:
      run:
        shell: bash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Both linters write their reports here.
      - name: Create artifacts directory
        run: mkdir -p artifacts

      - name: Run pylint
        run: |
          make pylint

      # Runs even if the webserver lint fails, so both reports land in one run.
      - name: Run pylint (dagster)
        if: ${{ !cancelled() }}
        run: |
          make pylint_dagster

      - name: Run hadolint
        run: |
          make hadolint

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-reports
          path: |
            artifacts/pylint.txt
            artifacts/pylint-dagster.txt
            artifacts/hadolint.xml
          if-no-files-found: ignore
  tests:
    needs:
      - init
      - linters
    defaults:
      run:
        shell: bash
    runs-on: ubuntu-latest
    if: needs.init.outputs.is_tag == 'false'
    steps:
      - uses: actions/checkout@v4

      # run_tests.sh copies coverage.xml out of the container into here.
      - name: Create artifacts directory
        run: mkdir -p artifacts

      # `helm template` renders client-side, so every lookup returns nil. The chart
      # keeps its cluster-state checks behind fn.clusterReachable so that it still
      # renders for ArgoCD, `helm diff` and CI - this is what holds that.
      - name: Lint and render the chart without a cluster
        run: |
          make helm_lint
          make helm_template

      - name: Run Helm unittests
        run: |
          make helm_tests

      - name: Run Python Tests
        working-directory: webserver
        run: |
          make tests_ci

      - name: Run Dagster Tests
        run: |
          make tests_dagster

      - name: Run Keycloak Integration Tests
        working-directory: webserver
        run: |
          make tests_integration

      - uses: irongut/CodeCoverageSummary@v1.3.0
        name: Code Coverage Summary Report
        with:
          filename: artifacts/coverage.xml
          fail_below_min: true
          thresholds: '60 80'
  build-flask-image:
    needs:
      - init
      - tests
    if: needs.init.outputs.is_tag == 'false'
    uses: Aridhia-Open-Source/pipelines/.github/workflows/build-docker.yml@main
    with:
      TAG: ${{ needs.init.outputs.tag }}
      IMAGE: federated_node_run
      BUILD_PATH: webserver
      HASH_SUFFIX: false
      DOCKER_ACR: ${{ vars.DOCKER_CR }}
    secrets:
      DOCKER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build-keycloak-image:
    needs:
      - init
      - tests
    if: needs.init.outputs.is_tag == 'false'
    uses: Aridhia-Open-Source/pipelines/.github/workflows/build-docker.yml@main
    with:
      TAG: ${{ needs.init.outputs.tag }}
      IMAGE: federated_keycloak
      BUILD_PATH: build/keycloak/
      HASH_SUFFIX: false
      DOCKER_ACR: ${{ vars.DOCKER_CR }}
    secrets:
      DOCKER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build-alpine-image:
    needs:
      - init
      - tests
    if: needs.init.outputs.is_tag == 'false'
    uses: Aridhia-Open-Source/pipelines/.github/workflows/build-docker.yml@main
    with:
      TAG: ${{ needs.init.outputs.tag }}
      IMAGE: alpine
      BUILD_PATH: build/alpine/
      HASH_SUFFIX: false
      DOCKER_ACR: ${{ vars.DOCKER_CR }}
    secrets:
      DOCKER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build-kc-init-image:
    needs:
      - init
      - tests
    if: needs.init.outputs.is_tag == 'false'
    uses: Aridhia-Open-Source/pipelines/.github/workflows/build-docker.yml@main
    with:
      TAG: ${{ needs.init.outputs.tag }}
      IMAGE: keycloak_initializer
      BUILD_PATH: build/kc-init/
      HASH_SUFFIX: false
      DOCKER_ACR: ${{ vars.DOCKER_CR }}
    secrets:
      DOCKER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build-dagster-image:
    needs:
      - init
      - tests
    if: needs.init.outputs.is_tag == 'false'
    uses: Aridhia-Open-Source/pipelines/.github/workflows/build-docker.yml@main
    with:
      TAG: ${{ needs.init.outputs.tag }}
      IMAGE: dagster_fn
      BUILD_PATH: dagster
      HASH_SUFFIX: false
      DOCKER_ACR: ${{ vars.DOCKER_CR }}
    secrets:
      DOCKER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  promote:
    needs: init
    if: needs.init.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.DOCKER_CR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the release candidate images with the release version
        env:
          REGISTRY: ${{ vars.DOCKER_CR }}
          OWNER: ${{ github.repository_owner }}
          RC_TAG: ${{ needs.init.outputs.rc_tag }}
          TAG: ${{ needs.init.outputs.tag }}
        run: |
          for image in federated_node_run federated_keycloak alpine keycloak_initializer dagster_fn; do
            repo="${REGISTRY}/${OWNER,,}/${image}"
            docker buildx imagetools create -t "${repo}:${TAG}" "${repo}:${RC_TAG}"
          done
  release:
    if: always() && !failure() && !cancelled()
    needs:
      - init
      - promote
      - build-flask-image
      - build-keycloak-image
      - build-alpine-image
      - build-kc-init-image
      - build-dagster-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build chart dependencies
        working-directory: k8s/federated-node
        run: |
          helm dependency build || helm dependency update
      - name: Package chart
        working-directory: k8s/federated-node
        run: |
          helm package . -d ${{ github.workspace }}/artifacts --version "${CHART_VERSION}" --app-version "${APP_VERSION}"
        env:
          CHART_VERSION: ${{ needs.init.outputs.chart_version }}
          APP_VERSION: ${{ needs.init.outputs.tag }}
      - name: Push chart to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ vars.DOCKER_CR }} -u ${{ github.actor }} --password-stdin
          helm push artifacts/federated-node-${CHART_VERSION}.tgz oci://${{ vars.DOCKER_CR }}/${OWNER,,}/charts
        env:
          OWNER: ${{ github.repository_owner }}
          CHART_VERSION: ${{ needs.init.outputs.chart_version }}
  release-gh-pages:
    needs:
      - init
      - release
    if: needs.init.outputs.is_tag == 'true'
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    uses: Aridhia-Open-Source/pipelines/.github/workflows/helm-build.yml@main
    with:
      VERSION: ${{ needs.init.outputs.chart_version }}
      APP_VERSION: ${{ needs.init.outputs.tag }}
      PATH_BUILD: k8s/federated-node
      CHART_NAME: federated-node
      IS_TAG: ${{ needs.init.outputs.is_tag }}
      HAS_SUBCHART: true
    secrets:
      CHART_APP_SECRET: ${{ secrets.CHART_APP_SECRET }}
  summary:
    if: always() && !failure() && !cancelled()
    needs:
      - init
      - release
    runs-on: ubuntu-latest
    steps:
      - name: Set summary
        run: |
          echo "# Docker Images Tags:" >> $GITHUB_STEP_SUMMARY
          echo "- ${{ needs.init.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "# Helm Chart:" >> $GITHUB_STEP_SUMMARY
          echo "- oci://ghcr.io/aridhia-open-source/charts/federated-node --version ${{ needs.init.outputs.chart_version }}" >> $GITHUB_STEP_SUMMARY