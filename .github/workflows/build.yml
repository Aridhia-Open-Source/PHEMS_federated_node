name: Build Docker Image
run-name: Building images
on:
  workflow_dispatch:
  push:
    tags:
      - '**'
    branches:
      - main
      - develop
      - dagster-main
      - dagster-develop
      # throwaway target for testing this workflow like a trunk branch; reset by reset-actions-sandbox.yml
      - actions-sandbox
    paths-ignore:
      - '**/*.md'
      - 'README'
      - 'LICENSE'
      - 'DEPLOYMENT'
      - 'images/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'
      - '.gitignore'
      - 'sub-license/**'
      - 'environment/*.md'
      - 'paper/**'
  pull_request:
    # every base: stack-gate below runs CI only for PRs whose base chain ends at a watched branch
    # No paths-ignore: the changes job below decides per area, so every PR gets a ci-ok result
    branches:
      - '**'
  # The merge queue runs the tests once on the PR combined with the target branch; no image builds
  merge_group:
# a new run cancels the older one on the same PR or branch; tags and pushes to the watched branches (release work) are never cancelled
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name != 'merge_group' && github.ref_type == 'branch' && !contains(fromJSON('["refs/heads/main","refs/heads/develop","refs/heads/dagster-main","refs/heads/dagster-develop","refs/heads/actions-sandbox"]'), github.ref)) }}
env:
  TAG: ''
  OWNER_LC: ''
  HELM_CHANNEL: stable
  # mise run only uses the tools a job installs; the rest come from the runner
  MISE_TASK_RUN_AUTO_INSTALL: 'false'
  IS_TAG: ${{ github.ref_type == 'tag' }}

permissions:
  contents: write
  packages: write

jobs:
  stack-gate:
    # A stacked PR's base is another PR's branch. Follow the open PRs down the chain and run CI only
    # if it ends at a watched branch (the branches push builds). Other events always run.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.walk.outputs.run }}
    steps:
      - id: walk
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          branch="$BASE"
          for _ in $(seq 100); do
            case "$branch" in
              main|develop|dagster-main|dagster-develop|actions-sandbox)
                echo "Base chain ends at $branch"; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
            next=$(gh pr list --repo "$REPO" --head "$branch" --state open --json baseRefName -q '.[0].baseRefName')
            if [ -z "$next" ]; then break; fi
            echo "$branch -> $next"; branch="$next"
          done
          echo "Base chain does not end at a watched branch (stopped at $branch); skipping CI"
          echo "run=false" >> "$GITHUB_OUTPUT"

  changes:
    # Which areas this PR touches. Push, tag and manual runs build everything; the queue and PRs filter.
    needs: stack-gate
    if: needs.stack-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outcome == 'skipped' || steps.filter.outputs.api == 'true' || steps.filter.outputs.workflows == 'true' }}
      # no UI job yet; the filter is here for when there is one
      ui: ${{ steps.filter.outcome == 'skipped' || steps.filter.outputs.ui == 'true' || steps.filter.outputs.workflows == 'true' }}
      dagster: ${{ steps.filter.outcome == 'skipped' || steps.filter.outputs.dagster == 'true' || steps.filter.outputs.workflows == 'true' }}
      chart: ${{ steps.filter.outcome == 'skipped' || steps.filter.outputs.chart == 'true' || steps.filter.outputs.workflows == 'true' }}
      build: ${{ steps.filter.outcome == 'skipped' || steps.filter.outputs.build == 'true' || steps.filter.outputs.workflows == 'true' }}
    steps:
      # Use the complete history for both event types. For pull requests, forcing git mode makes
      # paths-filter compare the branch tip with the merge-base instead of only the latest commit.
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        with:
          # An empty token disables the pull_request API mode, which can miss files when a later
          # synchronize commit is empty. Git mode compares the complete PR with its base.
          token: ''
          base: ${{ github.event.merge_group.base_sha }}
          ref: ${{ github.event.merge_group.head_sha }}
          filters: |
            api:
              - 'nexus/api/**'
            ui:
              - 'nexus/ui/**'
            dagster:
              - 'dagster/**'
              # the Dagster tests mount these models from nexus-api
              - 'nexus/api/app/models/**'
            chart:
              - 'k8s/**'
            build:
              - 'build/**'
              - '**/Dockerfile*'
            workflows:
              - '.github/**'
              - 'mise.toml'
              - 'scripts/**'

  init:
    needs: stack-gate
    if: needs.stack-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    outputs:
      # images, the chart and the summary are published only from pushes (trunk branches, tags) and manual runs
      publish: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
      is_tag: ${{ steps.vars.outputs.IS_TAG }}
      chart_version: ${{ steps.vars.outputs.CHART_VERSION }}
      tag: ${{ steps.vars.outputs.TAG }}
      rc_tag: ${{ steps.vars.outputs.RC_TAG }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the version suffix counts merges
      - name: Setting global values
        id: vars
        run: |
          echo "IS_TAG=${{ env.IS_TAG }}" >> ${GITHUB_OUTPUT}

          echo "Setting version according to the Chart.yaml"
          cd k8s/federated-node

          version=$(grep '^version:.*' Chart.yaml | sed 's/^.*: //')
          echo "Chart version: ${version}"
          appVersion=$(grep '^appVersion:.*' Chart.yaml | sed 's/^.*: \"//'| sed 's/\"//')
          echo "Chart appVersion: ${appVersion}"

          # N counts the merges since the chart version last changed, so it restarts at 1 after
          # every version bump and the same commit always gets the same N.
          base=$(git log -1 --first-parent --format=%H -G'^version:' -- Chart.yaml)
          n=$(( $(git rev-list --count --first-parent "${base}..HEAD") + 1 ))
          # "g" (as in git describe) stops an all-digit sha being an invalid semver part.
          sha="${{ github.event.pull_request.head.sha || github.sha }}"
          sha="g${sha::6}"

          if [[ "${{ env.IS_TAG }}" == "true" ]]; then
            # Releases reuse the images main built for the tagged commit (see the promote job)
            suffix=""
            echo "RC_TAG=${appVersion}-rc.${n}" >> ${GITHUB_OUTPUT}
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            suffix="-pr.${{ github.event.pull_request.number }}.${sha}"
          else
            case "${{ github.ref_name }}" in
              main) suffix="-rc.${n}" ;;
              develop) suffix="-beta.${n}" ;;
              # The dagster prefix stays until the dagster line merges into develop and main
              dagster-main) suffix="-dagster-beta.${n}" ;;
              dagster-develop) suffix="-dagster-alpha.${n}" ;;
              actions-sandbox) suffix="-sandbox.${n}" ;;
              *) suffix="-branch.${sha}" ;;
            esac
          fi
          echo "CHART_VERSION=${version}${suffix}" >> ${GITHUB_OUTPUT}
          echo "TAG=${appVersion}${suffix}" >> ${GITHUB_OUTPUT}
      - name: set lower case owner name
        run: |
          echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'
  linters:
    needs:
      - init
      - changes
    if: >-
      needs.init.outputs.is_tag == 'false' &&
      (needs.changes.outputs.api == 'true' || needs.changes.outputs.dagster == 'true' || needs.changes.outputs.build == 'true')
    defaults:
      run:
        shell: bash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The lint tasks run in docker, so no tool needs installing
      - uses: jdx/mise-action@v2
        with:
          install: false

      # Both linters write their reports here.
      - name: Create artifacts directory
        run: mkdir -p artifacts

      - name: Run pylint
        if: needs.changes.outputs.api == 'true'
        run: |
          mise run pylint

      # Runs even if the nexus-api lint fails, so both reports land in one run.
      - name: Run pylint (dagster)
        if: ${{ !cancelled() && needs.changes.outputs.dagster == 'true' }}
        run: |
          mise run pylint dagster

      - name: Run hadolint
        if: needs.changes.outputs.build == 'true'
        run: |
          mise run hadolint

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-reports
          path: |
            artifacts/pylint.txt
            artifacts/pylint-dagster.txt
            artifacts/hadolint.xml
          if-no-files-found: ignore
  # Each test job runs only when its area changed (always on push, tag and manual runs). `linters` is
  # skipped when none of its areas changed, so the `!failure() && !cancelled()` form lets these jobs
  # still run after a skipped linters job.
  chart-tests:
    needs:
      - init
      - changes
      - linters
    if: >-
      !failure() && !cancelled() && needs.init.outputs.is_tag == 'false' && needs.changes.outputs.chart == 'true'
    defaults:
      run:
        shell: bash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Only helm is needed here, the pinned one from mise.toml
      - uses: jdx/mise-action@v2
        with:
          install_args: helm

      # `helm template` renders client-side, so every lookup returns nil. The chart
      # keeps its cluster-state checks behind fn.clusterReachable so that it still
      # renders for ArgoCD, `helm diff` and CI - this is what holds that.
      - name: Lint and render the chart without a cluster
        run: |
          mise run helm lint
          mise run helm template

      - name: Run Helm unittests
        run: |
          mise run helm tests
  api-tests:
    needs:
      - init
      - changes
      - linters
    if: >-
      !failure() && !cancelled() && needs.init.outputs.is_tag == 'false' && needs.changes.outputs.api == 'true'
    defaults:
      run:
        shell: bash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # run_tests.sh copies coverage.xml out of the container into here.
      - name: Create artifacts directory
        run: mkdir -p artifacts

      - name: Run Python Tests
        working-directory: nexus/api
        run: |
          ./run_tests.sh ci

      - name: Run Keycloak Integration Tests
        working-directory: nexus/api
        run: |
          ./run_integration_tests.sh

      - uses: irongut/CodeCoverageSummary@v1.3.0
        name: Code Coverage Summary Report
        with:
          filename: artifacts/coverage.xml
          fail_below_min: true
          thresholds: '60 80'
  dagster-tests:
    needs:
      - init
      - changes
      - linters
    if: >-
      !failure() && !cancelled() && needs.init.outputs.is_tag == 'false' && needs.changes.outputs.dagster == 'true'
    defaults:
      run:
        shell: bash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The mise binary runs the task; the tests themselves run in docker
      - uses: jdx/mise-action@v2
        with:
          install: false

      - name: Run Dagster Tests
        run: |
          mise run tests-dagster
  build-nexus-api-image:
    needs:
      - init
      - chart-tests
      - api-tests
      - dagster-tests
    if: >-
      !failure() && !cancelled() && needs.init.outputs.is_tag == 'false' && needs.init.outputs.publish == 'true'
    uses: Aridhia-Open-Source/pipelines/.github/workflows/build-docker.yml@main
    with:
      TAG: ${{ needs.init.outputs.tag }}
      IMAGE: nexus_api
      BUILD_PATH: nexus/api
      HASH_SUFFIX: false
      DOCKER_ACR: ${{ vars.DOCKER_CR }}
    secrets:
      DOCKER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build-keycloak-image:
    needs:
      - init
      - chart-tests
      - api-tests
      - dagster-tests
    if: >-
      !failure() && !cancelled() && needs.init.outputs.is_tag == 'false' && needs.init.outputs.publish == 'true'
    uses: Aridhia-Open-Source/pipelines/.github/workflows/build-docker.yml@main
    with:
      TAG: ${{ needs.init.outputs.tag }}
      IMAGE: federated_keycloak
      BUILD_PATH: build/keycloak/
      HASH_SUFFIX: false
      DOCKER_ACR: ${{ vars.DOCKER_CR }}
    secrets:
      DOCKER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build-alpine-image:
    needs:
      - init
      - chart-tests
      - api-tests
      - dagster-tests
    if: >-
      !failure() && !cancelled() && needs.init.outputs.is_tag == 'false' && needs.init.outputs.publish == 'true'
    uses: Aridhia-Open-Source/pipelines/.github/workflows/build-docker.yml@main
    with:
      TAG: ${{ needs.init.outputs.tag }}
      IMAGE: alpine
      BUILD_PATH: build/alpine/
      HASH_SUFFIX: false
      DOCKER_ACR: ${{ vars.DOCKER_CR }}
    secrets:
      DOCKER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build-kc-init-image:
    needs:
      - init
      - chart-tests
      - api-tests
      - dagster-tests
    if: >-
      !failure() && !cancelled() && needs.init.outputs.is_tag == 'false' && needs.init.outputs.publish == 'true'
    uses: Aridhia-Open-Source/pipelines/.github/workflows/build-docker.yml@main
    with:
      TAG: ${{ needs.init.outputs.tag }}
      IMAGE: keycloak_initializer
      BUILD_PATH: build/kc-init/
      HASH_SUFFIX: false
      DOCKER_ACR: ${{ vars.DOCKER_CR }}
    secrets:
      DOCKER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # The steps of Aridhia-Open-Source/pipelines build-docker.yml (HASH_SUFFIX false), inline because the
  # image needs the nexus-client named build context (nexus/client), which that workflow cannot pass.
  build-dagster-image:
    needs:
      - init
      - chart-tests
      - api-tests
      - dagster-tests
    if: >-
      !failure() && !cancelled() && needs.init.outputs.is_tag == 'false' && needs.init.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.DOCKER_CR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set lower case owner name
        run: |
          echo "OWNER_LC=${OWNER,,}" >> "${GITHUB_ENV}"
        env:
          OWNER: '${{ github.repository_owner }}'
      - name: Build and push dagster_fn image
        uses: docker/build-push-action@v5
        with:
          context: dagster
          file: dagster/Dockerfile
          build-contexts: nexus-client=nexus/client
          tags: ${{ vars.DOCKER_CR }}/${{ env.OWNER_LC }}/dagster_fn:${{ needs.init.outputs.tag }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
  promote:
    needs: init
    if: needs.init.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.DOCKER_CR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the release candidate images with the release version
        env:
          REGISTRY: ${{ vars.DOCKER_CR }}
          OWNER: ${{ github.repository_owner }}
          RC_TAG: ${{ needs.init.outputs.rc_tag }}
          TAG: ${{ needs.init.outputs.tag }}
        run: |
          for image in nexus_api federated_keycloak alpine keycloak_initializer dagster_fn; do
            repo="${REGISTRY}/${OWNER,,}/${image}"
            docker buildx imagetools create -t "${repo}:${TAG}" "${repo}:${RC_TAG}"
          done
  release:
    if: always() && !failure() && !cancelled() && needs.init.result == 'success' && needs.init.outputs.publish == 'true'
    needs:
      - init
      - promote
      - build-nexus-api-image
      - build-keycloak-image
      - build-alpine-image
      - build-kc-init-image
      - build-dagster-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build chart dependencies
        working-directory: k8s/federated-node
        run: |
          helm dependency build || helm dependency update
      - name: Package chart
        working-directory: k8s/federated-node
        run: |
          helm package . -d ${{ github.workspace }}/artifacts --version "${CHART_VERSION}" --app-version "${APP_VERSION}"
        env:
          CHART_VERSION: ${{ needs.init.outputs.chart_version }}
          APP_VERSION: ${{ needs.init.outputs.tag }}
      - name: Push chart to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ vars.DOCKER_CR }} -u ${{ github.actor }} --password-stdin
          helm push artifacts/federated-node-${CHART_VERSION}.tgz oci://${{ vars.DOCKER_CR }}/${OWNER,,}/charts
        env:
          OWNER: ${{ github.repository_owner }}
          CHART_VERSION: ${{ needs.init.outputs.chart_version }}
  release-gh-pages:
    needs:
      - init
      - release
    if: needs.init.outputs.is_tag == 'true'
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    uses: Aridhia-Open-Source/pipelines/.github/workflows/helm-build.yml@main
    with:
      VERSION: ${{ needs.init.outputs.chart_version }}
      APP_VERSION: ${{ needs.init.outputs.tag }}
      PATH_BUILD: k8s/federated-node
      CHART_NAME: federated-node
      IS_TAG: ${{ needs.init.outputs.is_tag }}
      HAS_SUBCHART: true
    secrets:
      CHART_APP_SECRET: ${{ secrets.CHART_APP_SECRET }}
  summary:
    if: always() && !failure() && !cancelled() && needs.init.result == 'success' && needs.init.outputs.publish == 'true'
    needs:
      - init
      - release
    runs-on: ubuntu-latest
    steps:
      - name: Set summary
        run: |
          echo "# Docker Images Tags:" >> $GITHUB_STEP_SUMMARY
          echo "- ${{ needs.init.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "# Helm Chart:" >> $GITHUB_STEP_SUMMARY
          echo "- oci://ghcr.io/aridhia-open-source/charts/federated-node --version ${{ needs.init.outputs.chart_version }}" >> $GITHUB_STEP_SUMMARY
  ci-ok:
    # The one required check. Skipped jobs are fine (a docs-only PR skips nearly everything); a failed or cancelled job is not.
    if: always()
    needs:
      - stack-gate
      - changes
      - init
      - linters
      - chart-tests
      - api-tests
      - dagster-tests
      - build-nexus-api-image
      - build-keycloak-image
      - build-alpine-image
      - build-kc-init-image
      - build-dagster-image
      - promote
      - release
      - release-gh-pages
      - summary
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "A job failed or was cancelled"
          exit 1
      - name: All jobs passed or were skipped
        run: echo "ok"
