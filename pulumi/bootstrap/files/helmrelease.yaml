apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{RELEASE_NAME}}
  namespace: {{NAMESPACE}}
spec:
  interval: 10m
  chart:
    spec:
      chart: federated-node
      version: "{{CHART_VERSION}}"
      sourceRef:
        kind: HelmRepository
        name: fn-charts
  install:
    remediation:
      retries: 2
  upgrade:
    remediation:
      retries: 2
      strategy: rollback
  valuesFrom:
    - kind: ConfigMap
      name: federated-node-values
      valuesKey: values.yaml
