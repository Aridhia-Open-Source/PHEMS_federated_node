# The attacker experiment's repositories, their credentials and its project. Its dataset attacker-db is the experiments
# chart's (experiments/attacker/values.yaml), the provider is config/gitea.yaml. `fncli experiment setup attacker` runs
# `fncli gitea setup` and `kubectl apply` of this file and waits for it to sync; `teardown attacker` deletes it.
apiVersion: fn.aridhia.com/v1alpha1
kind: NodeSecret
metadata:
  name: attacker-trigger-repo-creds
  namespace: fn
spec:
  fromSecret: {name: attacker-trigger-repo-creds}
---
apiVersion: fn.aridhia.com/v1alpha1
kind: NodeSecret
metadata:
  name: attacker-results-repo-creds
  namespace: fn
spec:
  fromSecret: {name: attacker-results-repo-creds}
---
apiVersion: fn.aridhia.com/v1alpha1
kind: Repository
metadata:
  name: attacker-trigger-repo
  namespace: fn
spec:
  type: trigger
  uri: http://gitea.fn.svc:4000/gitea_admin/attacker-trigger-repo
  secret: attacker-trigger-repo-creds
---
apiVersion: fn.aridhia.com/v1alpha1
kind: Repository
metadata:
  name: attacker-results-repo
  namespace: fn
spec:
  type: results
  uri: http://gitea.fn.svc:4000/gitea_admin/attacker-results-repo
  secret: attacker-results-repo-creds
---
apiVersion: fn.aridhia.com/v1alpha1
kind: Project
metadata:
  name: attacker
  namespace: fn
spec:
  datasets: [attacker-db]
  repositories:
    triggers:
      - repository: http://gitea.fn.svc:4000/gitea_admin/attacker-trigger-repo
        watchDir: specs/
        baseBranch: main
    results:
      repository: http://gitea.fn.svc:4000/gitea_admin/attacker-results-repo
      targetDir: results/
      baseBranch: main
