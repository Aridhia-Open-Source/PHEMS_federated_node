# The GitHub demo: the phems-sandbox repository as both trigger and results repository, through a GitHub App, and
# the project demo-github. The dataset demo-db is the experiments chart's (`fncli experiment setup demo`).
# The App's values go in a Kubernetes Secret first; no value is in this file:
#   kubectl create secret generic phems-sandbox-github-app -n fn \
#     --from-literal=APP_ID="$GH_APP_ID" --from-literal=INSTALLATION_ID="$GH_INSTALLATION_ID" \
#     --from-file=PRIVATE_KEY=$HOME/.config/phems/phems-sandbox.private-key.pem
#   kubectl apply -f config/github/demo-github.yaml
#   fncli demo --project demo-github
apiVersion: fn.aridhia.com/v1alpha1
kind: GitProvider
metadata:
  name: github
  namespace: fn
spec:
  type: github
  uri: https://github.com
---
apiVersion: fn.aridhia.com/v1alpha1
kind: NodeSecret
metadata:
  name: phems-sandbox-creds                        # shared by the trigger and the results repository
  namespace: fn
spec:
  fromSecret: {name: phems-sandbox-github-app}     # keys APP_ID, INSTALLATION_ID, PRIVATE_KEY
---
apiVersion: fn.aridhia.com/v1alpha1
kind: Repository
metadata:
  name: phems-sandbox-trigger
  namespace: fn
spec:
  type: trigger
  uri: https://github.com/Aridhia-Open-Source/phems-sandbox
  secret: phems-sandbox-creds
---
apiVersion: fn.aridhia.com/v1alpha1
kind: Repository
metadata:
  name: phems-sandbox-results
  namespace: fn
spec:
  type: results
  uri: https://github.com/Aridhia-Open-Source/phems-sandbox
  secret: phems-sandbox-creds
---
apiVersion: fn.aridhia.com/v1alpha1
kind: Project
metadata:
  name: demo-github
  namespace: fn
spec:
  datasets: [demo-db]
  repositories:
    triggers:
      - repository: https://github.com/Aridhia-Open-Source/phems-sandbox
        watchDir: mgmt/requests/
        baseBranch: main
    results:
      repository: https://github.com/Aridhia-Open-Source/phems-sandbox
      targetDir: mgmt/results/
      baseBranch: main
