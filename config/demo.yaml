# The Gitea demo (DEMO.md): its two repositories, their credentials and the project demo-gitea. The dataset demo-db is
# the experiments chart's (`fncli experiment deploy`), the provider is gitea.yaml.
#   fncli experiment deploy; fncli experiment seed demo; fncli experiment setup demo
#   fncli gitea setup -f config/gitea.yaml -f config/demo.yaml           # the Gitea repositories, and the OAuth apps' Secrets
#   kubectl apply -f config/                         # gitea.yaml and this file
#   kubectl get fn -n fn-operator                             # synced, or the operator's message
#   fncli demo --project demo-gitea
#   kubectl delete -f config/demo.yaml               # clean up; Gitea is left alone
# `fncli gitea setup` makes each NodeSecret's Kubernetes Secret (fromSecret) from a Gitea OAuth app of the
# NodeSecret's name. Gitea tells OAuth apps apart by name, so each NodeSecret has its own.
apiVersion: fn.aridhia.com/v1alpha1
kind: NodeSecret
metadata:
  name: demo-trigger-repo-creds
  namespace: fn-operator
spec:
  fromSecret: {name: demo-trigger-repo-creds}
---
apiVersion: fn.aridhia.com/v1alpha1
kind: NodeSecret
metadata:
  name: demo-results-repo-creds
  namespace: fn-operator
spec:
  fromSecret: {name: demo-results-repo-creds}
---
apiVersion: fn.aridhia.com/v1alpha1
kind: Repository
metadata:
  name: demo-trigger-repo
  namespace: fn-operator
spec:
  type: trigger
  uri: http://gitea.fn.svc:4000/gitea_admin/demo-trigger-repo
  secret: demo-trigger-repo-creds
---
apiVersion: fn.aridhia.com/v1alpha1
kind: Repository
metadata:
  name: demo-results-repo
  namespace: fn-operator
spec:
  type: results
  uri: http://gitea.fn.svc:4000/gitea_admin/demo-results-repo
  secret: demo-results-repo-creds
---
apiVersion: fn.aridhia.com/v1alpha1
kind: Project
metadata:
  name: demo-gitea
  namespace: fn-operator
spec:
  datasets: [demo-db]                              # the experiments chart's, in namespace experiments
  repositories:
    triggers:
      - repository: http://gitea.fn.svc:4000/gitea_admin/demo-trigger-repo
        watchDir: specs/
        baseBranch: main
    results:
      repository: http://gitea.fn.svc:4000/gitea_admin/demo-results-repo
      targetDir: results/
      baseBranch: main
