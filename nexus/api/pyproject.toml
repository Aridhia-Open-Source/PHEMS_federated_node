[project]
name = "nexus-api"
description = "Federated Node API"
version = "1.2.1"
requires-python = ">=3.13"
readme = "README.md"
license = {text = "GPL-3"}

authors = [
    {name = "George Eddie", email = "george.eddie@aridhia.com"},
    {name = "Liam Smith", email = "liam.smith@aridhia.com"},
    {name = "Riccardo Casula", email = "riccardo.casula@aridhia.com"},
]
maintainers = [
    {name = "George Eddie", email = "george.eddie@aridhia.com"},
    {name = "Liam Smith", email = "liam.smith@aridhia.com"},
]

dependencies = [
    "sqlalchemy~=2.0.49",
    "psycopg2~=2.9.10",
    "alembic~=1.16.5",
    "kubernetes~=33.1.0",
    "joserfc~=1.6.5",
    "pyjwt~=2.10.1",
    "pymssql~=2.3.7",
    "requests~=2.32.5",
    "cryptography~=46.0.5",
    "urllib3~=2.6.3",
    "pydantic~=2.0",
    "pydantic-settings~=2.0",
    "fastapi~=0.162.0",
    "fastapi-pagination~=0.16.1",
    "uvicorn~=0.54.0",
    "python-multipart~=0.0.32",
]

[project.optional-dependencies]
dev = [
    "pylint~=4.0.5",
    "pytest~=8.4.2",
    "pytest-mock~=3.15.1",
    "python-dotenv~=1.2.2",
    "pytest-cov~=7.1.0",
    "responses~=0.26.0",
    "pytest-responses~=0.5.1",
    "hypothesis~=6.0",
    "httpx~=0.28.1"
]