name: federated_node_tests
services:
  db:
    image: 'postgres:17-alpine'
    environment:
      POSTGRES_DB: test_app
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: test_app
    volumes:
      - federated_node_tests_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 1s
      timeout: 5s
      retries: 10
  app:
    image: federated_node_app_test
    build:
      context: .
      dockerfile: build/test.Dockerfile
      # The shared fednode package, as docker-bake.hcl passes it
      additional_contexts:
        fednode: ../fednode
    depends_on:
      db:
        condition: service_healthy
    links:
      - db
    volumes:
      # Sample responses shared with the nexus client, read by the contract tests
      - ../fednode/tests/contract:/contract:ro
    environment:
      PGHOST:
      PGDATABASE:
      PGPORT:
      PGUSER:
      PGPASSWORD:
      PYTHONPATH: /app
      DATABASE_HOST:
      DATABASE_PORT:
      DATABASE_NAME:
      DATABASE_USER:
      DATABASE_PASSWORD:
      SERVICES_KEYCLOAK_URL:
      SERVICES_KEYCLOAK_REALM:
      SERVICES_KEYCLOAK_CLIENT:
      SERVICES_KEYCLOAK_ADMIN:
      SERVICES_KEYCLOAK_SERVICE_USER:
      SERVICES_KEYCLOAK_SERVICE_PASSWORD:
      SERVICES_KEYCLOAK_SECRET:
      SERVICES_DAGSTER_URI:
      NAMESPACES_SECRETS:
      NAMESPACES_TASKS:
      NODE_HOSTNAME:
      TASKS_LIMITS_MAX_CPU:
      TASKS_LIMITS_MAX_MEMORY:
      TASKS_LIMITS_DEFAULT_LIMIT_CPU:
      TASKS_LIMITS_DEFAULT_LIMIT_MEMORY:
      NEXUS_ROLE: api
volumes:
  federated_node_tests_data:
