[project]
name = "nexus-client"
description = "The nexus-api client shared by Dagster, fncli and the operator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "requests~=2.32",
    "pydantic~=2.0",
    "pydantic-settings~=2.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nexus_client*"]
