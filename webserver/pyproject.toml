[project]
name = "federatednode"
description = "Federated Node Webserver"
version = "1.2.1"
requires-python = ">=3.13"
readme = "README.md"
license = {text = "GPL-3"}

authors = [
    {name = "George Eddie", email = "george.eddie@aridhia.com"},
    {name = "Liam Smith", email = "liam.smith@aridhia.com"},
    {name = "Riccardo Casula", email = "riccardo.casula@aridhia.com"},
]
maintainers = [
    {name = "George Eddie", email = "george.eddie@aridhia.com"},
    {name = "Liam Smith", email = "liam.smith@aridhia.com"},
]

dependencies = [
    "flask~=3.1.3",
    "sqlalchemy~=2.0.49",
    "psycopg2~=2.9.10",
    "alembic~=1.16.5",
    "kubernetes~=33.1.0",
    "flask-sqlalchemy~=3.1.1",
    "joserfc~=1.6.5",
    "pyjwt~=2.10.1",
    "waitress~=3.0.2",
    "flask-swagger-ui~=5.21.0",
    "pymssql~=2.3.7",
    "werkzeug~=3.1.5",
    "jinja2~=3.1.6",
    "requests~=2.32.5",
    "cryptography~=46.0.5",
    "urllib3~=2.6.3",
]

[project.optional-dependencies]
dev = [
    "pylint~=4.0.5",
    "pytest~=8.4.2",
    "pytest-mock~=3.15.1",
    "python-dotenv~=1.2.2",
    "pytest-cov~=7.1.0",
    "responses~=0.26.0",
    "pytest-responses~=0.5.1"
]