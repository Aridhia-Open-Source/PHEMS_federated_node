suite: Upgrade testing
release:
  namespace: federatednode
  revision: 2
  name: federatednode
templates:
  - "*"
values:
  - values/values-upgrade.yaml
kubernetesProvider:
  scheme:
    v1/Secret:
      gvr:
        version: v1
        resource: secrets
      namespaced: true
    v1/ConfigMap:
      gvr:
        version: v1
        resource: configmaps
      namespaced: true
    "apiextensions.k8s.io/v1/CustomResourceDefinition":
      gvr:
        group: "apiextensions.k8s.io"
        version: "v1"
        resource: "customresourcedefinitions"
      namespaced: false
  objects:
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: httproutes.gateway.networking.k8s.io
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: middlewares.traefik.io
    - apiVersion: v1
      kind: Secret
      metadata:
        name: awscert-config
        namespace: federatednode
      type: Opaque
      data:
        EMAIL_CERT: dGVzdA==
        REGION: dGVzdA==
        ACCOUNT_ID: dGVzdA==
        ROLE_NAME: dGVzdA==
    - apiVersion: v1
      kind: Secret
      metadata:
        name: local-db
        namespace: federatednode
      type: Opaque
      data:
        password: dGVzdA==
    - apiVersion: v1
      kind: Secret
      metadata:
        name: first-user
        namespace: federatednode
      type: Opaque
      data:
        pass: dGVzdA==
    - apiVersion: v1
      kind: Secret
      metadata:
        name: superuser
        namespace: federatednode
      type: Opaque
      data:
        USERNAME: dGVzdA==
        PASSWORD: dGVzdA==
tests:
  # Mostly to make sure is created
  - it: simulate reuse-values args
    template: keycloak-realm-controller.yaml
    asserts:
      - hasDocuments:
          count: 1
