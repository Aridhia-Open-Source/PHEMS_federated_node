# Global resources for the attacker experiment (experiments/attacker/): a provider, two OAuth-app secrets, the repos and the
# Gitea admin bootstrap. `fncli experiment setup attacker` applies this after the experiment's dataset.yaml, then
# projects/attacker.yaml, and `teardown attacker` deletes them in reverse. No secret values.
version: 1

providers:
  - name: gitea-local                              # the same name in every file for this Gitea, or applying one renames it for the others
    type: gitea
    uri: http://gitea.fn.svc:4000                  # as the node sees it, not the port-forward
    api_uri: http://gitea.fn.svc:4000/api/v1

secrets:
  # Gitea tells OAuth apps apart by name: these differ from the dev project's and the other experiments'
  attacker-trigger-repo-creds:
    gitea_oauth: {app: attacker-sensor}
  attacker-results-repo-creds:
    gitea_oauth: {app: attacker-results}

repositories:
  triggers:
    - uri: "http://gitea.fn.svc:4000/gitea_admin/attacker-trigger-repo"
      secret: attacker-trigger-repo-creds
  results:
    - uri: "http://gitea.fn.svc:4000/gitea_admin/attacker-results-repo"
      secret: attacker-results-repo-creds

gitea:
  provider: gitea-local
  create_repositories: true
