# Global resources of scripts/proxy-sim-sensors.sh: a Gitea provider that has an outside-looking name, the two OAuth-app
# secrets, the repos and the Gitea admin bootstrap. mitmproxy answers TLS for gitea.proxysim.test and forwards to the
# in-cluster Gitea, so every call the node makes to these repositories crosses the proxy. The script's HOST must be the
# host below. Same shape as globals-gitea.yaml. The project is in projects/proxysim.yaml. No secret values: the OAuth
# apps are made in Gitea at apply time.
#   fncli apply -f examples/globals-proxysim.yaml; fncli apply -f examples/projects/proxysim.yaml     (the script's setup)
#   fncli delete -f examples/projects/proxysim.yaml; fncli delete -f examples/globals-proxysim.yaml --all   (its down)
version: 1

providers:
  - name: proxysim-gitea
    type: gitea
    uri: https://gitea.proxysim.test
    api_uri: https://gitea.proxysim.test/api/v1

secrets:
  proxysim-trigger-creds:
    gitea_oauth: {app: proxysim-sensor}
  proxysim-results-creds:
    gitea_oauth: {app: proxysim-results}

repositories:
  triggers:
    - uri: https://gitea.proxysim.test/gitea_admin/proxysim-trigger
      secret: proxysim-trigger-creds
  results:
    - uri: https://gitea.proxysim.test/gitea_admin/proxysim-results
      secret: proxysim-results-creds

gitea:
  provider: proxysim-gitea
  create_repositories: true
