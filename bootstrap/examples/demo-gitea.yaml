# Node file for the Gitea demo, replacing .demo.env.example. The same values: the demo's own project, repos and
# dataset, apart from the ones the e2e suites use (fn-dev). No secret values: each says where it is read from.
#   fncli diff -f bootstrap/examples/demo-gitea.yaml       (or FNCLI_NODE_FILE=bootstrap/examples/demo-gitea.yaml)
#   fncli apply -f bootstrap/examples/demo-gitea.yaml
#   fncli demo -f bootstrap/examples/demo-gitea.yaml       (the guided version)
# The dataset is the demo database, a tiny Postgres in the experiments release. Create and seed it first:
#   make experiments up
#   make experiments seed demo
# Names: lowercase letters, digits, '-' and '.' only, because they become Secret labels.
version: 1

# The node this file is for, as this host reaches it. fncli refuses to run when kubectl points elsewhere.
node:
  url: http://localhost:5000                       # nexus-api (the Tilt port-forward)
  kube_context: kind-fn
  keycloak_namespace: keycloak

providers:
  - name: gitea-local
    type: gitea
    uri: http://gitea.fn.svc:4000                  # as the node sees it, not the port-forward
    api_uri: http://gitea.fn.svc:4000/api/v1

secrets:
  # Gitea tells OAuth apps apart by name: these two must differ from each other and from the e2e
  # project's (fn-sensor, fn-results), or replacing one token invalidates the other.
  demo-trigger-repo-creds:
    gitea_oauth: {app: demo-sensor}
  demo-results-repo-creds:
    gitea_oauth: {app: demo-results}
  demo-db-dataset-creds:                           # the demo database's login, read from its chart secret
    values:
      USERNAME: {k8s_secret: {name: db-datasets-demo, namespace: experiments, key: username}}
      PASSWORD: {k8s_secret: {name: db-datasets-demo, namespace: experiments, key: password}}

repositories:
  triggers:
    - uri: "http://gitea.fn.svc:4000/gitea_admin/demo-trigger-repo"
      secret: demo-trigger-repo-creds
  results:
    - uri: "http://gitea.fn.svc:4000/gitea_admin/demo-results-repo"
      secret: demo-results-repo-creds

datasets:                                          # dataset names are unique across the whole node
  - name: demo-db                                  # shared with demo-github.yaml
    type: postgres
    host: db-datasets.experiments.svc
    port: 5432
    read_schema: cdm
    write_schema: results
    secret: demo-db-dataset-creds

projects:
  - name: demo-gitea
    datasets: [demo-db]
    repositories:
      triggers:
        - repository: http://gitea.fn.svc:4000/gitea_admin/demo-trigger-repo
          watch_dir: specs/
          base_branch: main
      results:
        repository: http://gitea.fn.svc:4000/gitea_admin/demo-results-repo
        target_dir: results/
        base_branch: main

# Opt-in Gitea admin bootstrap: the OAuth apps above, and the repos on this provider under the admin user.
gitea:
  provider: gitea-local
  create_repositories: true
