# The project of the Gitea demo, and what it is assigned: the repositories are in globals-gitea.yaml, the dataset
# demo-db is in experiments/demo/dataset.yaml. Apply those first:
#   fncli experiment up; fncli experiment seed demo; fncli experiment setup demo      (the dataset)
#   fncli apply -f examples/globals-gitea.yaml                                         (the repositories)
#   fncli apply -f examples/projects/demo-gitea.yaml
#   fncli demo -f examples/projects/demo-gitea.yaml
version: 1

projects:
  - name: demo-gitea
    datasets: [demo-db]                            # on the node already, see above
    repositories:
      triggers:
        - repository: http://gitea.fn.svc:4000/gitea_admin/demo-trigger-repo
          watch_dir: specs/
          base_branch: main
      results:
        repository: http://gitea.fn.svc:4000/gitea_admin/demo-results-repo
        target_dir: results/
        base_branch: main
