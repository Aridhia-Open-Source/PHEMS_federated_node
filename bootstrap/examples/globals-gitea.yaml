# Global resources for the Gitea demo, replacing .demo.env.example: a provider, two OAuth-app secrets, the repos and
# the Gitea admin bootstrap. The demo's project is in projects/demo-gitea.yaml. No secret values: each says where it is
# read from. Which node: bootstrap/context.yaml (cp bootstrap/examples/context.yaml bootstrap/context.yaml).
#   fncli apply -f examples/globals-gitea.yaml
#   fncli apply -f examples/projects/demo-gitea.yaml
#   fncli demo -f examples/projects/demo-gitea.yaml
#   fncli delete -f examples/projects/demo-gitea.yaml; fncli delete -f examples/globals-gitea.yaml --all   (clean up)
# Copy a file to your own name (bootstrap/globals.yaml) to change it: your own files are gitignored.
# The repos are the demo's own, apart from the ones the e2e suites use (fn-dev).
# Names: lowercase letters, digits, '-' and '.' only, because they become Secret labels.
version: 1

providers:
  - name: gitea-local
    type: gitea
    uri: http://gitea.fn.svc:4000                  # as the node sees it, not the port-forward
    api_uri: http://gitea.fn.svc:4000/api/v1

secrets:
  # Gitea tells OAuth apps apart by name: these two must differ from each other and from the e2e
  # project's (fn-sensor, fn-results), or replacing one token invalidates the other.
  demo-trigger-repo-creds:
    gitea_oauth: {app: demo-sensor}
  demo-results-repo-creds:
    gitea_oauth: {app: demo-results}

repositories:
  triggers:
    - uri: "http://gitea.fn.svc:4000/gitea_admin/demo-trigger-repo"
      secret: demo-trigger-repo-creds
  results:
    - uri: "http://gitea.fn.svc:4000/gitea_admin/demo-results-repo"
      secret: demo-results-repo-creds

# Opt-in Gitea admin bootstrap: the OAuth apps above, and the repos on this provider under the admin user.
gitea:
  provider: gitea-local
  create_repositories: true
