# Node file for the attacker experiment (experiments/projects/attacker/project.env, see experiments/README.md): its node
# project, global resources and Gitea repos, which `fncli experiment setup attacker` applies and `teardown attacker` deletes.
# The database is the one the experiments release makes for it; its password is read from the chart's secret and the user
# name from DATASET_USERNAME, which project.env sets. No secret values. The names match project.env, which
# `fncli experiment run` still reads for the pull request.
version: 1

node:
  url: http://localhost:5000                       # nexus-api (the Tilt port-forward)
  kube_context: kind-fn
  keycloak_namespace: keycloak

providers:
  - name: gitea-local                              # the same name in every file for this Gitea, or applying one renames it for the others
    type: gitea
    uri: http://gitea.fn.svc:4000                  # as the node sees it, not the port-forward
    api_uri: http://gitea.fn.svc:4000/api/v1

secrets:
  # Gitea tells OAuth apps apart by name: these differ from the dev project's and the other experiments'
  attacker-trigger-repo-creds:
    gitea_oauth: {app: attacker-sensor}
  attacker-results-repo-creds:
    gitea_oauth: {app: attacker-results}
  attacker-db-dataset-creds:
    values:
      USERNAME: {env: DATASET_USERNAME}
      PASSWORD: {k8s_secret: {name: db-datasets-attacker, namespace: experiments, key: password}}

repositories:
  triggers:
    - uri: "http://gitea.fn.svc:4000/gitea_admin/attacker-trigger-repo"
      secret: attacker-trigger-repo-creds
  results:
    - uri: "http://gitea.fn.svc:4000/gitea_admin/attacker-results-repo"
      secret: attacker-results-repo-creds

datasets:
  - name: attacker-db
    type: postgres
    host: db-datasets.experiments.svc
    port: 5432
    read_schema: cdm
    write_schema: results
    secret: attacker-db-dataset-creds

projects:
  - name: attacker
    datasets: [attacker-db]
    repositories:
      triggers:
        - repository: http://gitea.fn.svc:4000/gitea_admin/attacker-trigger-repo
          watch_dir: specs/
          base_branch: main
      results:
        repository: http://gitea.fn.svc:4000/gitea_admin/attacker-results-repo
        target_dir: results/
        base_branch: main

gitea:
  provider: gitea-local
  create_repositories: true
