# Node file for the uc1 experiment (experiments/projects/uc1/): its node project, global repositories and Gitea
# repos, which `fncli experiment setup uc1` applies and `teardown uc1` deletes. The project is assigned the dataset
# uc1-omop by name: the dataset and its secret are in experiments/projects/uc1/bootstrap.yaml, which setup applies
# first. No secret values.
version: 1

node:
  url: http://localhost:5000                       # nexus-api (the Tilt port-forward)
  kube_context: kind-fn
  keycloak_namespace: keycloak

providers:
  - name: gitea-local                              # the same name in every file for this Gitea, or applying one renames it for the others
    type: gitea
    uri: http://gitea.fn.svc:4000                  # as the node sees it, not the port-forward
    api_uri: http://gitea.fn.svc:4000/api/v1

secrets:
  # Gitea tells OAuth apps apart by name: these differ from the dev project's and the other experiments'
  uc1-trigger-repo-creds:
    gitea_oauth: {app: uc1-sensor}
  uc1-results-repo-creds:
    gitea_oauth: {app: uc1-results}

repositories:
  triggers:
    - uri: "http://gitea.fn.svc:4000/gitea_admin/uc1-trigger-repo"
      secret: uc1-trigger-repo-creds
  results:
    - uri: "http://gitea.fn.svc:4000/gitea_admin/uc1-results-repo"
      secret: uc1-results-repo-creds

projects:
  - name: uc1
    datasets: [uc1-omop]
    repositories:
      triggers:
        - repository: http://gitea.fn.svc:4000/gitea_admin/uc1-trigger-repo
          watch_dir: specs/
          base_branch: main
      results:
        repository: http://gitea.fn.svc:4000/gitea_admin/uc1-results-repo
        target_dir: results/
        base_branch: main

gitea:
  provider: gitea-local
  create_repositories: true
