# Global resources for the uc1 experiment (experiments/uc1/): a provider, two OAuth-app secrets, the repos and the
# Gitea admin bootstrap. `fncli experiment setup uc1` applies this after the experiment's dataset.yaml, then
# projects/uc1.yaml, and `teardown uc1` deletes them in reverse. No secret values.
version: 1

providers:
  - name: gitea-local                              # the same name in every file for this Gitea, or applying one renames it for the others
    type: gitea
    uri: http://gitea.fn.svc:4000                  # as the node sees it, not the port-forward
    api_uri: http://gitea.fn.svc:4000/api/v1

secrets:
  # Gitea tells OAuth apps apart by name: these differ from the dev project's and the other experiments'
  uc1-trigger-repo-creds:
    gitea_oauth: {app: uc1-sensor}
  uc1-results-repo-creds:
    gitea_oauth: {app: uc1-results}

repositories:
  triggers:
    - uri: "http://gitea.fn.svc:4000/gitea_admin/uc1-trigger-repo"
      secret: uc1-trigger-repo-creds
  results:
    - uri: "http://gitea.fn.svc:4000/gitea_admin/uc1-results-repo"
      secret: uc1-results-repo-creds

gitea:
  provider: gitea-local
  create_repositories: true
