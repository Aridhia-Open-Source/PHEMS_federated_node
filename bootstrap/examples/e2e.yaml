# Node file for the dev project the end-to-end suites and scripts/e2e_shared_resources.sh use, replacing the TEST_* values
# of .dev.env.example. The same values: the fn-dev project, its two Gitea repos, a stand-in dataset. No secret values.
#   fncli diff  -f bootstrap/examples/e2e.yaml
#   fncli apply -f bootstrap/examples/e2e.yaml
#   fncli delete -f bootstrap/examples/e2e.yaml --all
# The commands that open pull requests and check the project (open-pr, verify-project, project-set, ...) still read the
# same names from .dev.env (TEST_PROJECT_NAME, TEST_TRIGGER_REPO, ...): keep them equal to this file.
# Names: lowercase letters, digits, '-' and '.' only, because they become Secret labels.
version: 1

node:
  url: http://localhost:5000                       # nexus-api (the Tilt port-forward)
  kube_context: kind-fn
  keycloak_namespace: keycloak

providers:
  - name: gitea-local                              # the same name in every file for this Gitea, or applying one renames it for the others
    type: gitea
    uri: http://gitea.fn.svc:4000                  # as the node sees it, not the port-forward
    api_uri: http://gitea.fn.svc:4000/api/v1

secrets:
  # Gitea tells OAuth apps apart by name: these differ from the demo's and the experiments', or replacing
  # one token invalidates the other.
  fn-trigger-repo-creds:
    gitea_oauth: {app: fn-sensor}
  fn-results-repo-creds:
    gitea_oauth: {app: fn-results}
  dev-dataset-dataset-creds:                       # stand-in credentials: its database is a dummy
    values:
      USERNAME: {generate: {length: 16}}
      PASSWORD: {generate: {length: 24}}

repositories:
  triggers:
    - uri: "http://gitea.fn.svc:4000/gitea_admin/fn-trigger-repo"
      secret: fn-trigger-repo-creds
  results:
    - uri: "http://gitea.fn.svc:4000/gitea_admin/fn-results-repo"
      secret: fn-results-repo-creds

datasets:                                          # dataset names are unique across the whole node
  - name: dev-dataset
    type: postgres
    host: db-datasets.experiments.svc
    port: 5432
    read_schema: cdm
    write_schema: results
    secret: dev-dataset-dataset-creds

projects:
  - name: fn-dev
    datasets: [dev-dataset]
    repositories:
      triggers:
        - repository: http://gitea.fn.svc:4000/gitea_admin/fn-trigger-repo
          watch_dir: specs/
          base_branch: main
      results:
        repository: http://gitea.fn.svc:4000/gitea_admin/fn-results-repo
        target_dir: results/
        base_branch: main

gitea:
  provider: gitea-local
  create_repositories: true
