# The context: which node fncli works on, and what its commands use when not told. Every command that talks to the node
# reads it. Copy it to bootstrap/context.yaml (gitignored) and edit; fncli finds that one from the current directory up,
# or give --context FILE (or FNCLI_CONTEXT). The examples here are for the dev cluster (make cluster, make deploy).
node:
  url: http://localhost:5000                       # nexus-api (the Tilt port-forward)
  kube_context: kind-fn                            # fncli refuses to run when kubectl points elsewhere
  keycloak_namespace: keycloak                     # where fncli's login is read from
  gitea_admin_user: gitea_admin                    # optional, this is the default
  env_file: .dev.env                               # optional: GH_APP_ID, GH_INSTALLATION_ID, ...; found from here up

# Optional. FNCLI_DEFAULT_PROJECT and FNCLI_DEFAULT_TRIGGER_TYPE in the env win over these, and a flag wins over both.
# A command that uses a default says so on its first line.
defaults:
  project: demo-gitea                              # for `fncli trigger FILE` and `fncli demo` without --project
  trigger_type: pr                                 # pr, or api (not built yet)
