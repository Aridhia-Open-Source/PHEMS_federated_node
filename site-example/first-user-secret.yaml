# The first Keycloak user's login, committed SOPS-encrypted (`sops encrypt -i first-user-secret.yaml`); Flux
# decrypts it on apply. The chart reads it by name (values.yaml firstUserSecret: the realm controller's
# PASSWORD, and the HelmRelease's valuesFrom EMAIL). A site fills in its own values and encrypts the file
# before its first commit; `mise run flux up` fills these from .dev.env and encrypts them for the dev key.
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-first-user
  namespace: fn
type: Opaque
stringData:
  EMAIL: FIRST_USER_EMAIL
  PASSWORD: FIRST_USER_PASSWORD
