# A test site repository (ADR 0031): what a site owns, for the dev cluster. `mise run flux up` pushes this
# folder to the dev Gitea as gitea_admin/fn-site, and Flux applies it. Edit that repository, not this
# folder, to run the loop in docs/versions/2.x/docs/GitOps-Delivery.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helmrepository.yaml
  - helmrelease.yaml
  # The site's Secrets: secrets/sops (SOPS-encrypted in this repository) or secrets/vault (External Secrets)
  - secrets/sops
# values.yaml as a ConfigMap. Its name carries a hash of the content, and kustomizeconfig.yaml rewrites the
# HelmRelease's valuesFrom to match, so a values commit changes the HelmRelease and Flux upgrades at once.
configMapGenerator:
  - name: federated-node-values
    namespace: fn
    files:
      - values.yaml
configurations:
  - kustomizeconfig.yaml
