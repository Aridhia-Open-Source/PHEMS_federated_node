# Azure Key Vault, read with the ServiceAccount's workload identity. Fill in the vault's URL.
# Cluster-wide, so the ExternalSecrets in the fn and keycloak namespaces share one identity.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: fn-vault
spec:
  # Only the node's own namespaces may use the store: an ExternalSecret in any other namespace cannot read the
  # vault through the node's identity.
  conditions:
    - namespaces: [fn, keycloak]
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: https://AZURE_KEY_VAULT.vault.azure.net
      serviceAccountRef:
        name: fn-external-secrets
        namespace: fn
