# The site's Secrets from a vault through External Secrets (ADR 0031), instead of SOPS: the same Secrets as
# ../sops. Switch with one line in ../../kustomization.yaml: secrets/vault in place of secrets/sops. Needs the
# External Secrets Operator in the cluster. Azure Key Vault here; the dev cluster uses OpenBao instead
# (store-openbao.yaml, applied by `mise run openbao up`).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - serviceaccount.yaml
  - store-azure.yaml
  - first-user-from-vault.yaml
