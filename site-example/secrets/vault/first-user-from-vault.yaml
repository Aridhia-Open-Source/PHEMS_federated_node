# The first Keycloak user's login from the vault: the same Secret as ../sops/first-user-secret.yaml, which
# the realm controller and the HelmRelease's valuesFrom read by name. It has to come from the site repository,
# not the chart: Flux reads it before it renders the chart.
# One vault entry per Secret, holding its keys, so the same file works on both stores:
#   Azure Key Vault: a JSON object, `az keyvault secret set --vault-name <vault> --name keycloak-first-user
#     --value '{"EMAIL": "...", "PASSWORD": "..."}'`
#   OpenBao (dev): a KV v2 entry with those keys, `bao kv put secret/keycloak-first-user EMAIL=... PASSWORD=...`
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-first-user
  namespace: fn
spec:
  # How often the Secret is read again from the vault
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fn-vault
  target:
    name: keycloak-first-user
  dataFrom:
    - extract:
        key: keycloak-first-user
