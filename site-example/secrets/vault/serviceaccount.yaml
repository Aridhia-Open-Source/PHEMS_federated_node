# The identity the ClusterSecretStore logs in to the vault as.
# Azure: workload identity. Fill in the tenant ID and the client ID of the managed identity that may read the
# Key Vault (role "Key Vault Secrets User"), and give that identity a federated credential for the cluster's OIDC issuer with
# subject system:serviceaccount:fn:fn-external-secrets.
# OpenBao (dev): its Kubernetes auth role is bound to this name and namespace; the annotation is unused.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fn-external-secrets
  namespace: fn
  annotations:
    azure.workload.identity/client-id: AZURE_CLIENT_ID
    azure.workload.identity/tenant-id: AZURE_TENANT_ID
