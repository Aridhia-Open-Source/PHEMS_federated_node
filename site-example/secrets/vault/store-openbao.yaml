# The dev cluster's vault: OpenBao from `mise run openbao up`, which applies this file in place of
# store-azure.yaml. Cluster-wide, like the Azure store. OpenBao speaks the Vault API; it logs in with the
# ServiceAccount's token (Kubernetes auth).
# Entries live in the KV v2 mount "secret", one per Secret (see first-user-from-vault.yaml).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: fn-vault
spec:
  # Only the node's own namespaces may use the store: an ExternalSecret in any other namespace cannot read the
  # vault through the node's identity.
  conditions:
    - namespaces: [fn, keycloak]
  provider:
    vault:
      server: http://openbao.openbao.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: fn-external-secrets
          serviceAccountRef:
            name: fn-external-secrets
            namespace: fn
