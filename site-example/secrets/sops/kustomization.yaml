# The site's Secrets, committed SOPS-encrypted (ADR 0031, .sops.yaml); Flux decrypts them on apply.
# The default. The switch to a vault instead is one line in ../../kustomization.yaml: secrets/vault.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - first-user-secret.yaml
  - superuser-secret.yaml
