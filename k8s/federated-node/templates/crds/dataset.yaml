{{- /* A dataset. metadata.name is its nexus-api name; secret is the NodeSecret with its credentials. */}}
{{- $spec := `
type: object
required: [type, host, port, secret]
properties:
  type:
    type: string
    minLength: 1
  host:
    type: string
    minLength: 1
  port:
    type: integer
    minimum: 1
    maximum: 65535
  readSchema:
    type: string
  writeSchema:
    type: string
  secret:
    type: string
    minLength: 1
    description: The NodeSecret with the dataset's credentials
` }}
{{ include "fn.crd" (dict "kind" "Dataset" "plural" "datasets" "spec" (trim $spec)) }}
