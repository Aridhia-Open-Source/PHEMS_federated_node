{{- /* A project and what it is assigned. metadata.name is its nexus-api name. Datasets by name (the first is the
default), repositories by uri. One results repository. The operator refuses a '..' in a directory and a watchDir
that overlaps the targetDir. */}}
{{- $spec := `
type: object
required: [repositories]
properties:
  enabled:
    type: boolean
    default: true
  datasets:
    type: array
    items:
      type: string
      minLength: 1
  repositories:
    type: object
    required: [results]
    properties:
      triggers:
        type: array
        items:
          type: object
          required: [repository, watchDir, baseBranch]
          properties:
            repository:
              type: string
              pattern: '^(https?://)?[^/@\s]+(/[^/\s]+){2,}/?$'
            watchDir:
              type: string
              description: Must name a directory, not the whole repository
              pattern: '[^/.]'
            baseBranch:
              type: string
              minLength: 1
            enabled:
              type: boolean
              default: true
      results:
        type: object
        required: [repository, targetDir, baseBranch]
        properties:
          repository:
            type: string
            pattern: '^(https?://)?[^/@\s]+(/[^/\s]+){2,}/?$'
          targetDir:
            type: string
            minLength: 1
          baseBranch:
            type: string
            minLength: 1
          enabled:
            type: boolean
            default: true
` }}
{{ include "fn.crd" (dict "kind" "Project" "plural" "projects" "spec" (trim $spec)) }}
