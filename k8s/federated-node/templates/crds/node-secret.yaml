{{- /* A nexus-api secret, by reference only. metadata.name is its label. The values are read from a Kubernetes
Secret in the resource's own namespace: every key of fromSecret under the same names, or each key of values from
its secretKeyRef. Exactly one of the two. */}}
{{- $spec := `
type: object
oneOf:
  - required: [fromSecret]
  - required: [values]
properties:
  fromSecret:
    type: object
    required: [name]
    properties:
      name:
        type: string
        minLength: 1
  values:
    type: object
    minProperties: 1
    additionalProperties:
      type: object
      required: [secretKeyRef]
      properties:
        secretKeyRef:
          type: object
          required: [name, key]
          properties:
            name:
              type: string
              minLength: 1
            key:
              type: string
              minLength: 1
` }}
{{ include "fn.crd" (dict "kind" "NodeSecret" "plural" "nodesecrets" "spec" (trim $spec)) }}
