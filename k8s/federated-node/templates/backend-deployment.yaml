apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: {{ .Release.Namespace }}
  labels:
    app: flask
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app: flask
  template:
    metadata:
      annotations:
        rollme: {{ template "rollMe" . }}
      labels:
        app: flask
    spec:
      serviceAccountName: secret-backend-handler
      initContainers:
        - name: wait-for-db
          image: {{ include "fn-alpine" . }}
          imagePullPolicy: {{ .Values.pullPolicy }}
          {{- include "nonRootSC" . | nindent 10 }}
          command:
            - sh
            - -c
            - |
              until pg_isready -h $PGHOST -p {{ .Values.db.port }}; do
                echo "waiting for postgres..."
                sleep 2
              done
          env:
            - name: PGHOST
              valueFrom:
                configMapKeyRef:
                  name: backend-configmap
                  key: PGHOST
        - name: wait-for-backend-database
          image: {{ include "fn-alpine" . }}
          imagePullPolicy: {{ .Values.pullPolicy }}
          {{- include "nonRootSC" . | nindent 10 }}
          command:
            - sh
            - -c
            - |
              until psql -h $PGHOST -p {{ .Values.db.port }} -U {{ .Values.db.superuser }} -d postgres -c "SELECT 1 FROM pg_database WHERE datname='$BACKEND_DB_NAME'" | grep -q 1; do
                echo "waiting for backend database..."
                sleep 2
              done
          env:
            - name: PGHOST
              valueFrom:
                configMapKeyRef:
                  name: backend-configmap
                  key: PGHOST
            - name: BACKEND_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: backend-configmap
                  key: BACKEND_DB_NAME
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-superuser
                  key: password
        - name: db-migrations
          image: {{ template "backend-image" . }}
          command: ["/bin/sh"]
          workingDir: /webserver
          {{- include "nonRootSC" . | nindent 10 }}
          args:
            [
              '-c',
              'python -m alembic upgrade head'
            ]
          envFrom:
            - configMapRef:
                name: backend-configmap
          imagePullPolicy: {{ .Values.pullPolicy }}
          env:
          - name: BACKEND_DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .Values.backend.db.secret.name }}
                key: {{ .Values.backend.db.secret.key }}
        - name: storage-init
          image: {{ include "fn-alpine" . }}
          command: ["/bin/sh"]
          imagePullPolicy: {{ .Values.pullPolicy }}
          args:
            - -c
            - mkdir -p /mnt/storage/results
          volumeMounts:
            - name: respv
              mountPath: /mnt/storage
      containers:
        - image: {{ template "backend-image" . }}
          name: backend
          imagePullPolicy: {{ .Values.pullPolicy }}
          {{- include "nonRootSC" . | nindent 10 }}
          resources:
            limits:
              memory: 200Mi
              cpu: 100m
          ports:
            - name: http
              containerPort: {{ .Values.federatedNode.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready_check
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 30
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health_check
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 30
            failureThreshold: 5
          envFrom:
            - configMapRef:
                name: backend-configmap
            - configMapRef:
                name: keycloak-config
            - secretRef:
                name: kc-secrets
          env:
          - name: BACKEND_DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .Values.backend.db.secret.name }}
                key: {{ .Values.backend.db.secret.key }}
          volumeMounts:
            - name: respv
              mountPath: {{ .Values.federatedNode.volumes.results_path }}
              subPath: results
      volumes:
        - name: respv
          persistentVolumeClaim:
            claimName: {{ include "backendResultsPVCName" . }}