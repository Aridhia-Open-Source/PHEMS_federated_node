apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: {{ .Release.Namespace }}
  labels:
    app: flask
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app: flask
  template:
    metadata:
      annotations:
        rollme: {{ template "rollMe" . }}
        {{- if include "fn.customCA.enabled" . }}
        {{- include "fn.customCA.annotations" (dict "ctx" . "namespace" .Release.Namespace) | nindent 8 }}
        {{- end }}
      labels:
        app: flask
    spec:
      serviceAccountName: secret-backend-handler
      initContainers:
        {{- /* backend-db-init is a pre-install hook, so the database already exists
               by now - except with an in-cluster Postgres, where the server is part
               of this release and its hook runs post-install. */}}
        {{- if .Values.create_db_deployment }}
        {{- include "pgWaitContainer" (dict "ctx" . "host" (include "dbHost" .) "port" (include "dbPort" .)) | nindent 8 }}
        {{- end }}
        {{- if include "fn.customCA.enabled" . }}
        {{- include "fn.customCA.initContainer" (dict "ctx" . "image" (include "backend-image" .) "nonRoot" true) | nindent 8 }}
        {{- end }}
        - name: db-migrations
          image: {{ template "backend-image" . }}
          command: ["/bin/sh"]
          workingDir: /webserver
          {{- include "nonRootSC" . | nindent 10 }}
          args:
            [
              '-c',
              'python -m alembic upgrade head'
            ]
          envFrom:
            - configMapRef:
                name: backend-configmap
          imagePullPolicy: {{ .Values.pullPolicy }}
          env:
          - name: BACKEND_DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .Values.backend.db.secret.name }}
                key: {{ .Values.backend.db.secret.key }}
      containers:
        - image: {{ template "backend-image" . }}
          name: backend
          imagePullPolicy: {{ .Values.pullPolicy }}
          {{- include "nonRootSC" . | nindent 10 }}
          resources:
            {{- toYaml .Values.federatedNode.resources | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.federatedNode.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready_check
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 30
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health_check
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 30
            failureThreshold: 5
          envFrom:
            - configMapRef:
                name: backend-configmap
            - configMapRef:
                name: keycloak-config
          env:
          - name: BACKEND_DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .Values.backend.db.secret.name }}
                key: {{ .Values.backend.db.secret.key }}
          {{- if include "fn.customCA.enabled" . }}
          {{- include "fn.customCA.env" . | nindent 10 }}
          {{- end }}
          volumeMounts:
            - name: kc-secrets
              mountPath: {{ include "kcSecretsMountPath" . }}
              readOnly: true
            {{- if include "fn.customCA.enabled" . }}
            {{- include "fn.customCA.volumeMounts" . | nindent 12 }}
            {{- end }}
      volumes:
        - name: kc-secrets
          secret:
            secretName: kc-secrets
        {{- if include "fn.customCA.enabled" . }}
        {{- include "fn.customCA.volumes" . | nindent 8 }}
        {{- end }}