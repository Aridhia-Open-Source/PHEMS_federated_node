{{- if and .Values.nexus.ui.enabled .Values.traefik.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nexus-ui-route
  namespace: {{ .Release.Namespace }}
  labels:
    rollme: {{ template "rollMe" . }}
spec:
  parentRefs:
  - name: {{ .Values.traefik.gateway.name }}
    sectionName: websecure
    namespace: {{ .Release.Namespace }}
  hostnames:
  - {{ .Values.host }}
  rules:
  # Longer than the backend route's "/" prefix, so it wins for /nexus-ui
  - matches:
    - path:
        type: PathPrefix
        value: /nexus-ui
    backendRefs:
    - name: nexus-ui
      port: 80
{{- end }}
