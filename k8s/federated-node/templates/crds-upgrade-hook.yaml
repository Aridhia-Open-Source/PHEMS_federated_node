{{- /*
  Helm installs crds/ on a first install and never upgrades them, so a field added to a CRD would be pruned
  silently on a plain `helm upgrade`. This pre-upgrade Job applies crds/ with kubectl first (ADR 0032).
  Flux (crds: CreateReplace) and scripts/deploy.sh apply them too; applying twice is harmless.
*/}}
{{- /* The ConfigMap and RBAC go before the Job; all of it goes before every other pre-upgrade hook. */}}
{{- $hook := dict "helm.sh/hook" "pre-upgrade" "helm.sh/hook-weight" "-30" "helm.sh/hook-delete-policy" "before-hook-creation,hook-succeeded" }}
{{- $jobHook := merge (dict "helm.sh/hook-weight" "-25") $hook }}
{{- $crds := .Files.Glob "crds/*.yaml" }}
{{- $names := list }}
{{- range $path, $_ := $crds }}
{{- $names = append $names ($.Files.Get $path | fromYaml).metadata.name }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: fn-crds
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- toYaml $hook | nindent 4 }}
data:
  {{- $crds.AsConfig | nindent 2 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fn-crds-upgrade
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- toYaml $hook | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-crds-upgrade
  annotations:
    {{- toYaml $hook | nindent 4 }}
rules:
# create and list cannot be limited by name: the request carries none when it is authorised.
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["create", "list"]
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  resourceNames: {{ $names | sortAlpha | toJson }}
  verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-crds-upgrade
  annotations:
    {{- toYaml $hook | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: fn-crds-upgrade
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ .Release.Name }}-crds-upgrade
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: fn-crds-upgrade
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- toYaml $jobHook | nindent 4 }}
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: fn-crds-upgrade
      containers:
        - name: apply-crds
          image: {{ include "fn-alpine" . }}
          imagePullPolicy: {{ .Values.pullPolicy }}
          {{- include "nonRootSC" . | nindent 10 }}
          command: ["/bin/sh", "-ec"]
          args:
            - kubectl apply --server-side --force-conflicts --field-manager=federated-node -f /crds
          volumeMounts:
            - name: crds
              mountPath: /crds
              readOnly: true
      volumes:
        - name: crds
          configMap:
            name: fn-crds
