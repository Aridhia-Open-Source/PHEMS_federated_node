{{/*
Secrets that have to exist in a namespace other than the release one. External
inputs only - the database passwords are written directly into every namespace that
needs them by db-secrets.yaml.
*/}}
{{- if (.Values.firstUserSecret).name }}
{{- include "fn.copySecret" (dict "ctx" . "name" .Values.firstUserSecret.name "target" (include "kc_namespace" .)) }}
{{- end }}
{{- if .Values.storage.azure }}
{{- include "fn.copySecret" (dict "ctx" . "name" .Values.storage.azure.secretName "target" (include "tasks_namespace" .)) }}
{{- end }}
{{- if and (index .Values "cert-manager" "enabled") .Values.on_aks }}
{{- include "fn.copySecret" (dict "ctx" . "name" .Values.certs.azure.secretName "target" (index .Values "cert-manager" "namespace")) }}
{{- end }}
{{- if and (index .Values "cert-manager" "enabled") .Values.on_eks }}
{{- include "fn.copySecret" (dict "ctx" . "name" .Values.certs.aws "target" (index .Values "cert-manager" "namespace")) }}
{{- end }}
