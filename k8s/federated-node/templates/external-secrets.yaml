{{- if (.Values.externalSecrets).enabled }}
{{- /* External Secrets (ADR 0031): the Secrets nodeConfig's NodeSecrets read (fromSecret), filled from a secret
       store into the operator's namespace. One SecretStore, OpenBao in dev or Azure Key Vault at sites, and one
       ExternalSecret per Secret. Each remote secret holds one value, so a name means the same in both stores.
       Needs the External Secrets Operator in the cluster and operator.enabled (the namespace). */}}
{{- $es := .Values.externalSecrets }}
{{- $ns := include "operator_namespace" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $es.serviceAccount.name }}
  namespace: {{ $ns }}
  {{- with $es.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: fn-secret-store
  namespace: {{ $ns }}
spec:
  provider:
    {{- if eq $es.provider "openbao" }}
    # OpenBao speaks the Vault API; it logs in with this ServiceAccount's token (Kubernetes auth)
    vault:
      server: {{ $es.openbao.server }}
      path: {{ $es.openbao.path }}
      version: v2
      auth:
        kubernetes:
          mountPath: {{ $es.openbao.authMountPath }}
          role: {{ $es.openbao.role }}
          serviceAccountRef:
            name: {{ $es.serviceAccount.name }}
    {{- else }}
    # Workload identity: the ServiceAccount's annotations name the managed identity that may read the vault
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: {{ $es.azureKeyVault.vaultUrl }}
      serviceAccountRef:
        name: {{ $es.serviceAccount.name }}
    {{- end }}
{{- range $name, $keys := $es.secrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: fn-secret-store
  target:
    name: {{ $name }}
  data:
    {{- range $key, $remote := $keys }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $remote }}
        {{- if eq $es.provider "openbao" }}
        # A KV entry is a map: the one value is stored under "value"
        property: value
        {{- end }}
    {{- end }}
{{- end }}
{{- end }}
