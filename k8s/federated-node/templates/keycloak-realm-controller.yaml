{{- define "kcControlleName" -}}
  {{ print "keycloak-realm-init" }}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kcControlleName" . }}
  namespace: {{ include "kc_namespace" . }}
  labels:
    app: {{ include "kcControlleName" . }}
    {{ include "defaultLabels" .}}
  annotations:
    {{ include "defaultAnnotations" . }}
spec:
  selector:
    matchLabels:
      app: {{ include "kcControlleName" . }}
  template:
    metadata:
      annotations:
        fn.aridhia.com/credential-generation: {{ .Values.keycloak.credentialGeneration | default 1 | quote }}
        {{- /*
          Restart realm-init whenever the realm definition changes, so an edit to realms.json is
          actually applied.
        */}}
        checksum/realm-config: {{ .Files.Get "scripts/realms.json" | sha256sum }}
      labels:
        app: {{ include "kcControlleName" . }}
    spec:
      serviceAccountName: k8s-keycloak-handler
      containers:
        - name: {{ include "kcControlleName" . }}
          imagePullPolicy: {{ .Values.pullPolicy }}
          image: "{{ (.Values.keycloak.initializer).image | default "ghcr.io/aridhia-open-source/keycloak_initializer" }}:{{ (.Values.keycloak.initializer).tag | default (.Values.keycloak.tag | default .Chart.AppVersion) }}"
          {{- include "nonRootSC" . | nindent 10 }}
          env:
            - name: KC_NAMESPACE
              value: {{ include "kc_namespace" . }}
            - name: KC_REPLICAS
              value: {{ .Values.keycloak.replicas | default 2 | quote }}
            - name: KEYCLOAK_URL
              value: http://keycloak.{{ include "kc_namespace" . }}.svc.cluster.local
            - name: MANAGE_REALM
              value: {{ .Values.keycloak.manageRealm | default true | quote }}
            {{- if (.Values.firstUserSecret).name }}
            - name: FIRST_USER_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.firstUserSecret.name }}
                  key: {{ .Values.firstUserSecret.passKey }}
            - name: FIRST_USER_EMAIL
              value: {{ .Values.firstUserSecret.email }}
            - name: FIRST_USER_FIRST_NAME
              value: {{ .Values.firstUserSecret.firstName }}
            - name: FIRST_USER_LAST_NAME
              value: {{ .Values.firstUserSecret.lastName }}
            {{- end }}
          envFrom:
          - configMapRef:
              name: keycloak-config
          {{- /*
            kc-secrets is NOT in envFrom: it is mounted at kcSecretsMountPath instead, so a
            rotation is picked up by re-reading the file rather than restarting the pod.
          */}}
          {{- if .Values.dagster.enabled }}
          - secretRef:
              name: dagster-keycloak-creds
          {{- end }}
          volumeMounts:
            - name: realm-config
              mountPath: /realm-config
              readOnly: true
            - name: kc-secrets
              mountPath: {{ include "kcSecretsMountPath" . }}
              readOnly: true
      volumes:
        - name: realm-config
          configMap:
            name: keycloak-realm-config
            items:
              - key: realms.json
                path: realms.json
        - name: kc-secrets
          secret:
            secretName: kc-secrets
