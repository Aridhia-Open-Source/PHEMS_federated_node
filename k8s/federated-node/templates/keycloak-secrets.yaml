{{- /*
  Keycloak credentials.

  These values MUST be stable across upgrades.

  So: look the secret up and reuse what is already there. Generate only on first install,
  or when an operator deliberately bumps keycloak.credentialGeneration.

  A counter is used rather than a boolean flag on purpose. A "forceRotation: true" boolean
  left switched on -- easy under GitOps, where values are committed -- would rotate on every
  single sync. A counter is idempotent and safe to leave in git.
*/ -}}
{{- $releaseNs := .Release.Namespace -}}
{{- $kcNs := include "kc_namespace" . -}}
{{- $existing := lookup "v1" "Secret" $releaseNs "kc-secrets" -}}
{{- $wantGen := .Values.keycloak.credentialGeneration | default 1 | toString -}}

{{- /*
  lookup returns nil under `helm template`, `--dry-run` and helm unittest, which is fine --
  those fall through to the generate branch. But on a real upgrade a missing kc-secrets means
  something is wrong (most likely lookup is unavailable, e.g. ArgoCD without the
  --dry-run=server shim), and silently minting new credentials there would break the cluster
  on every sync. Fail loudly instead.
*/ -}}
{{- if and .Release.IsUpgrade (not $existing) (not .Values.keycloak.recreateMissingSecrets) -}}
  {{- fail "kc-secrets not found on upgrade. Either `lookup` is unavailable (ArgoCD needs the --dry-run=server shim -- see install_argocd/README.md) or the secret was deleted. If you deleted it deliberately, set keycloak.recreateMissingSecrets=true for one upgrade." -}}
{{- end -}}

{{- /*
  Only rotate when a generation is recorded AND differs. A secret from before this change has
  no CREDENTIAL_GENERATION key: adopt its values as-is rather than treating it as a rotation,
  otherwise the very first upgrade onto this version would rotate everything -- exactly the
  bug being fixed.
*/ -}}
{{- $rotate := false -}}
{{- if $existing -}}
  {{- $haveGen := index $existing.data "CREDENTIAL_GENERATION" -}}
  {{- if $haveGen -}}
    {{- $rotate = ne $wantGen ($haveGen | b64dec) -}}
  {{- end -}}
{{- end -}}
{{- $reuse := and $existing (not $rotate) -}}

{{- /*
  All values here are held base64-encoded and unquoted, and quoted at the use site. Note that
  `index $existing.data` yields unquoted base64 whereas the randomPass/randomSecret helpers
  return it *quoted*, so those helpers are deliberately not used -- mixing them would make the
  reuse and generate branches render differently.
*/ -}}
{{- $client_secret := "" -}}
{{- $password_kc := "" -}}
{{- $service_password := "" -}}
{{- if $reuse -}}
  {{- $client_secret = index $existing.data "KEYCLOAK_SECRET" -}}
  {{- $password_kc = index $existing.data "KEYCLOAK_ADMIN_PASSWORD" -}}
  {{- $service_password = index $existing.data "KEYCLOAK_SERVICE_PASSWORD" -}}
{{- end -}}
{{- /*
  Per-key fallback, so a secret predating a newly added key (KEYCLOAK_SERVICE_PASSWORD, added
  with the fn-service split) gets just that one value generated rather than rotating the lot.
*/ -}}
{{- if not $client_secret -}}{{- $client_secret = (randAlphaNum 24 | b64enc) -}}{{- end -}}
{{- if not $password_kc -}}{{- $password_kc = (randAlphaNum 24 | b64enc) -}}{{- end -}}
{{- if not $service_password -}}{{- $service_password = (randAlphaNum 24 | b64enc) -}}{{- end -}}

{{- $dagsterExisting := lookup "v1" "Secret" $kcNs "dagster-keycloak-creds" -}}
{{- $dagster_password := "" -}}
{{- if and $dagsterExisting (not $rotate) -}}
  {{- $dagster_password = index $dagsterExisting.data "DAGSTER_KC_PASSWORD" -}}
{{- end -}}
{{- if not $dagster_password -}}{{- $dagster_password = (randAlphaNum 24 | b64enc) -}}{{- end -}}
{{- /*
  An explicitly configured password wins over both the looked-up and the generated value, and is
  therefore not subject to credential rotation
*/ -}}
{{- if ((.Values.dagster).systemUser).password -}}
  {{- $dagster_password = (.Values.dagster.systemUser.password | b64enc) -}}
{{- end -}}

{{- $list_ns := list $releaseNs $kcNs -}}
{{- if .Values.outboundMode -}}
    {{ $list_ns = append $list_ns (include "controller_namespace" .) }}
{{- end -}}
{{- /* uniq: these namespaces can legitimately coincide in some configurations, and emitting
       the same Secret twice is a hard render/apply failure. */ -}}
{{- range ($list_ns | uniq) }}
kind: Secret
apiVersion: v1
metadata:
    name: kc-secrets
    namespace: {{ . }}
data:
    KEYCLOAK_SECRET: {{ $client_secret | quote }}
    KEYCLOAK_ADMIN_PASSWORD: {{ $password_kc | quote }}
    KC_BOOTSTRAP_ADMIN_PASSWORD: {{ $password_kc | quote }}
    KEYCLOAK_SERVICE_PASSWORD: {{ $service_password | quote }}
    ## Written into every copy: this is what the next upgrade compares against to decide
    ## whether a rotation was requested. Without it, rotation cannot be detected.
    CREDENTIAL_GENERATION: {{ $wantGen | b64enc | quote }}
type: Obscure
---
{{- end }}
{{- if .Values.dagster.enabled }}
{{- range (list $kcNs (.Values.dagster.namespace | default $releaseNs) | uniq) }}
kind: Secret
apiVersion: v1
metadata:
    name: dagster-keycloak-creds
    namespace: {{ . }}
data:
    DAGSTER_KC_USER: {{ b64enc "dagster" }}
    DAGSTER_KC_PASSWORD: {{ $dagster_password | quote }}
    DAGSTER_KC_EMAIL: {{ b64enc "dagster@phems.local" }}
type: Obscure
---
{{- end }}
{{- end }}
