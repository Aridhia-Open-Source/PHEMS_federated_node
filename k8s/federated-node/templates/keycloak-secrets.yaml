{{- $client_secret := (include "randomPass" .) -}}
{{- $password_kc := (include "randomSecret" .) -}}
{{- /*
Reuse the existing Dagster service-user password on upgrade. Regenerating it would
leave the Keycloak user (created once by the realm controller) out of sync with what
the Dagster pods present when logging in to the backend API.
*/ -}}
{{- $existing_dagster := (lookup "v1" "Secret" (include "kc_namespace" .) "dagster-keycloak-creds") -}}
{{- $dagster_password := "" -}}
{{- if (($existing_dagster).data).DAGSTER_KC_PASSWORD -}}
  {{- $dagster_password = $existing_dagster.data.DAGSTER_KC_PASSWORD -}}
{{- else -}}
  {{- $dagster_password = randAlphaNum 24 | b64enc -}}
{{- end -}}
{{- $list_ns := list .Release.Namespace (include "kc_namespace" .) -}}
{{- if .Values.outboundMode -}}
    {{ $list_ns = append $list_ns (include "controller_namespace" .) }}
{{- end -}}

{{- range $list_ns }}
kind: Secret
apiVersion: v1
metadata:
    name: kc-secrets
    namespace: {{ . }}
data:
    KEYCLOAK_SECRET: {{ $client_secret }}
    KEYCLOAK_ADMIN_PASSWORD: {{ $password_kc }}
    KC_BOOTSTRAP_ADMIN_PASSWORD: {{ $password_kc }}
type: Obscure
---
{{- end }}
{{- if .Values.dagster.enabled }}
{{- range (list (include "kc_namespace" .) .Release.Namespace | uniq) }}
kind: Secret
apiVersion: v1
metadata:
    name: dagster-keycloak-creds
    namespace: {{ . }}
data:
    DAGSTER_KC_USER: {{ b64enc "dagster" }}
    DAGSTER_KC_PASSWORD: {{ $dagster_password | quote }}
    DAGSTER_KC_EMAIL: {{ b64enc "dagster@phems.local" }}
type: Opaque
---
{{- end }}
{{- end }}
