{{/*
Read access to the project secrets: the dataset credentials the pipes op copies into the
task's own Secret (_get_dataset_secret in dagster/app/definitions/pipes.py), and the git
tokens the sensors and delivery read.

Both service accounts need it, and the run launcher's is the one that actually does the
read: the op executes in the per-run pod, which the subchart's k8sRunLauncher runs under
its own service account ({{ .Release.Name }}-dagster), not under the code server's. With
only the code server bound, every dataset-backed task fails with
  secrets "<key>" is forbidden: User
  "system:serviceaccount:<ns>:<release>-dagster" cannot get resource "secrets"

Namespaced to the secrets namespace, which holds nothing else: the release namespace's
database and Keycloak secrets are out of reach, and so is quarantine, where a disabled
secret's value sits. The task pod itself holds no token.
*/}}
{{- $subjects := list (include "dagsterCodeServerServiceAccount" .) (((.Values.dagster.serviceAccount).name) | default (printf "%s-dagster" .Release.Name)) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-dagster-user-role
  namespace: {{ include "secrets_namespace" . }}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-dagster-user-role-binding
  namespace: {{ include "secrets_namespace" . }}
subjects:
{{- range $subjects }}
  - kind: ServiceAccount
    namespace: {{ $.Release.Namespace }}
    name: {{ . }}
{{- end }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-dagster-user-role
  apiGroup: rbac.authorization.k8s.io
---
{{/*
Pipes task pods run in the tasks namespace, so the run pod has to create, watch, log and
delete pods there (PipesK8sClient.run - it creates a bare pod, not a Job), and create and
delete the Secret that hands the pod its dataset credentials (K8sPipe in pipes.py). That is
all it may do with Secrets here: it cannot read one back.

delete pods there (PipesK8sClient.run - it creates a bare pod, not a Job).

It also creates and deletes the ConfigMap that holds a task's config file for as long as
the run lasts (K8sPipe._task_config_map in dagster/app/definitions/pipes.py).
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-dagster-task-pod-role
  namespace: {{ include "tasks_namespace" . }}
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["create", "get", "list", "watch", "delete"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create", "delete"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["create", "get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-dagster-task-pod-role-binding
  namespace: {{ include "tasks_namespace" . }}
subjects:
{{- range $subjects }}
  - kind: ServiceAccount
    namespace: {{ $.Release.Namespace }}
    name: {{ . }}
{{- end }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-dagster-task-pod-role
  apiGroup: rbac.authorization.k8s.io
