{{/*
Read access to the project secrets. Dagster no longer reads any: nexus-api copies a dataset's
credentials into the run's own Secret and mints the git tokens (K8sSecretProvider in
dagster/app/secrets.py is unused).

Both service accounts are bound, as the op executes in the per-run pod, which the subchart's
k8sRunLauncher runs under its own service account ({{ .Release.Name }}-dagster), not under
the code server's.

Namespaced to the secrets namespace, which holds nothing else: the release namespace's
database and Keycloak secrets are out of reach, and so is quarantine, where a disabled
secret's value sits. The task pod itself holds no token.
*/}}
{{- $subjects := list (include "dagsterCodeServerServiceAccount" .) (((.Values.dagster.serviceAccount).name) | default (printf "%s-dagster" .Release.Name)) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-dagster-user-role
  namespace: {{ include "secrets_namespace" . }}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-dagster-user-role-binding
  namespace: {{ include "secrets_namespace" . }}
subjects:
{{- range $subjects }}
  - kind: ServiceAccount
    namespace: {{ $.Release.Namespace }}
    name: {{ . }}
{{- end }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-dagster-user-role
  apiGroup: rbac.authorization.k8s.io
---
{{/*
Pipes task pods run in the tasks namespace, so the run pod has to create, watch, log and
delete pods there (PipesK8sClient.run - it creates a bare pod, not a Job). That is all it may
do here: the run's Secret and ConfigMap are nexus-api's to create and delete
(nexus-api-roles.yaml), and the pod only names them.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-dagster-task-pod-role
  namespace: {{ include "tasks_namespace" . }}
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["create", "get", "list", "watch", "delete"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-dagster-task-pod-role-binding
  namespace: {{ include "tasks_namespace" . }}
subjects:
{{- range $subjects }}
  - kind: ServiceAccount
    namespace: {{ $.Release.Namespace }}
    name: {{ . }}
{{- end }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-dagster-task-pod-role
  apiGroup: rbac.authorization.k8s.io
