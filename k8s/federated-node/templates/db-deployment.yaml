{{ if .Values.create_db_deployment }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-internal
  namespace: {{ .Release.Namespace }}
  labels:
    app: postgres
spec:
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - image: postgres:17-alpine
          name: db-internal
          env:
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_USER
              value: {{ .Values.db.superuser }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  # initdb only reads this when the data directory is first created,
                  # so this secret and storage.local.dbpath are a single unit.
                  name: {{ .Values.db.secret.name }}
                  key: {{ .Values.db.secret.key }}
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -d
                - postgres
                - -U
                - {{ .Values.db.superuser }}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -d
                - postgres
                - -U
                - {{ .Values.db.superuser }}
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 1
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: db-volclaim
{{ end }}