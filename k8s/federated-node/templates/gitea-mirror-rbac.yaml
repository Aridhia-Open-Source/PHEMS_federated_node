{{- if .Values.giteaMirror.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitea-mirror
  namespace: {{ .Release.Namespace }}
  labels:
    app: gitea-mirror
{{- range $i, $grant := .Values.giteaMirror.secretAccess }}
{{- if $grant.names }}
{{- $ns := $grant.namespace | default $.Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "gitea-mirror-secrets-%d" $i }}
  namespace: {{ $ns }}
  labels:
    app: gitea-mirror
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      {{- range $grant.names }}
      - {{ . | quote }}
      {{- end }}
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "gitea-mirror-secrets-%d" $i }}
  namespace: {{ $ns }}
  labels:
    app: gitea-mirror
subjects:
  - kind: ServiceAccount
    name: gitea-mirror
    namespace: {{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "gitea-mirror-secrets-%d" $i }}
{{- end }}
{{- end }}

# Lets the gitea-admin-init job store the generated Gitea access token as a Secret
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitea-admin-init
  namespace: {{ .Release.Namespace }}
  labels:
    app: gitea-mirror
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitea-admin-init
  namespace: {{ .Release.Namespace }}
  labels:
    app: gitea-mirror
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.giteaMirror.giteaToken.secret.name | quote }}]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitea-admin-init
  namespace: {{ .Release.Namespace }}
  labels:
    app: gitea-mirror
subjects:
  - kind: ServiceAccount
    name: gitea-admin-init
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitea-admin-init
{{- end }}
