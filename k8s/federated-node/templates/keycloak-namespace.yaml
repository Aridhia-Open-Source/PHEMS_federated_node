{{- /* Off with global.createNamespaces: then it comes from outside, with the Secrets read
       here (the first user, customCA.secretName) already in it. */}}
{{- if (.Values.global).createNamespaces }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "kc_namespace" . }}
  annotations:
    # Turning global.createNamespaces off later must not delete it with all it holds
    helm.sh/resource-policy: keep
  {{- if .Release.IsInstall }}
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "-6"
    {{ template "defaultAnnotations" . }}
  labels:
    {{ template "defaultLabels" . }}
  {{- end }}
{{- end }}
