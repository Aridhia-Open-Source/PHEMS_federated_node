{{- if and .Values.nexus.api.enabled .Values.traefik.enabled }}
{{- /* Same host as the backend, under its own prefix, which is stripped: nexus serves the backend's paths. */}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nexus-api-route
  namespace: {{ .Release.Namespace }}
  labels:
    rollme: {{ template "rollMe" . }}
spec:
  parentRefs:
  - name: {{ .Values.traefik.gateway.name }}
    sectionName: websecure
    namespace: {{ .Release.Namespace }}
  hostnames:
  - {{ .Values.host }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: {{ .Values.nexus.api.pathPrefix }}
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    {{- if .Values.integrations }}
    - type: ResponseHeaderModifier
      responseHeaderModifier:
        set:
        - name: Access-Control-Allow-Origin
          value: {{ include "cspDomains" . | quote }}
    {{- end }}
    - type: ExtensionRef
      extensionRef:
        group: traefik.io
        kind: Middleware
        name: cors-headers
    backendRefs:
    - name: nexus-api
      port: {{ .Values.nexus.port }}
{{- end }}
