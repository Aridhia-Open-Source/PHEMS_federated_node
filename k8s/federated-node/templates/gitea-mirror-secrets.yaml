{{- if and .Values.giteaMirror.enabled .Values.giteaMirror.apiToken.create }}
{{- /* Generated once, then reused on upgrade (fn.dbPassword looks up the existing one) */}}
{{- $token := include "fn.dbPassword" (dict
      "namespaces" (list .Release.Namespace)
      "name" .Values.giteaMirror.apiToken.secret.name
      "key" .Values.giteaMirror.apiToken.secret.key
      "generate" true) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.giteaMirror.apiToken.secret.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: gitea-mirror
type: Opaque
data:
  {{ .Values.giteaMirror.apiToken.secret.key }}: {{ $token | quote }}
{{- end }}
