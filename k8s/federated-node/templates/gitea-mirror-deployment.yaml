{{- if .Values.giteaMirror.enabled }}
{{- if ne (int .Values.giteaMirror.replicaCount) 1 }}
{{- fail (printf "giteaMirror.replicaCount must be 1 (got %v): every replica runs the Alembic migrations at start and the sync timer, so more than one races on first install" .Values.giteaMirror.replicaCount) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea-mirror
  namespace: {{ .Release.Namespace }}
  labels:
    app: gitea-mirror
    release: {{ .Release.Name }}
spec:
  replicas: {{ .Values.giteaMirror.replicaCount }}
  selector:
    matchLabels:
      app: gitea-mirror
  template:
    metadata:
      labels:
        app: gitea-mirror
    spec:
      serviceAccountName: gitea-mirror
      initContainers:
        {{- /* gitea-mirror-db-init is a pre-install hook except with an in-cluster
               Postgres, whose server is part of this release. */}}
        {{- if .Values.create_db_deployment }}
        {{- include "pgWaitContainer" (dict "ctx" . "host" (include "dbHost" .) "port" (include "dbPort" .)) | nindent 8 }}
        {{- end }}
        - name: db-migrations
          image: {{ include "gitea-mirror-image" . }}
          imagePullPolicy: {{ .Values.giteaMirror.image.pullPolicy }}
          command: ["/bin/sh"]
          workingDir: /gitea-mirror
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: [ "ALL" ]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          args:
            [
              '-c',
              'python -m alembic upgrade head'
            ]
          env:
            {{- include "gitea-mirror-db-env" . | nindent 12 }}
      containers:
        - name: gitea-mirror
          image: {{ include "gitea-mirror-image" . }}
          imagePullPolicy: {{ .Values.giteaMirror.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: [ "ALL" ]
          ports:
            - name: http
              containerPort: {{ .Values.giteaMirror.port }}
              protocol: TCP
          env:
            {{- include "gitea-mirror-db-env" . | nindent 12 }}
            - name: GITEA_MIRROR_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.giteaMirror.apiToken.secret.name }}
                  key: {{ .Values.giteaMirror.apiToken.secret.key }}
            - name: GITEA_MIRROR_GITEA_URL
              value: "http://gitea.{{ .Release.Namespace }}.svc:{{ .Values.gitea.service.http.port | default 4000 }}"
            - name: GITEA_MIRROR_GITEA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.giteaMirror.giteaToken.secret.name }}
                  key: {{ .Values.giteaMirror.giteaToken.secret.key }}
            - name: HOME
              value: /tmp
            - name: GITEA_MIRROR_GIT_CACHE_DIR
              value: /tmp/git-cache
            {{- range $name, $value := .Values.giteaMirror.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          # TCP only, so a database blip that fails /health does not restart the pod
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: git-cache
              mountPath: /tmp/git-cache
          resources:
            {{- toYaml .Values.giteaMirror.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
        - name: git-cache
          emptyDir:
            sizeLimit: {{ .Values.giteaMirror.cacheSizeLimit }}
{{- end }}
