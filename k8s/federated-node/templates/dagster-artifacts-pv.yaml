{{- if .Values.dagster.enabled }}
{{- /*
The Dagster artifacts volume is mounted concurrently by the run pod and by every
pipes task pod it launches, so it MUST support ReadWriteMany. On Azure that means
Azure Files (file.csi.azure.com) - Azure Disk cannot serve RWX.
*/}}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ include "dagsterArtifactsStorageClassName" . }}
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
volumeBindingMode: WaitForFirstConsumer
{{- if .Values.storage.mountOptions }}
mountOptions:
{{ toYaml .Values.storage.mountOptions | indent 2 }}
{{- end }}
{{- if .Values.storage.local }}
provisioner: Local
{{- else if .Values.storage.azure }}
provisioner: {{ .Values.storage.azure.provisioner | default "file.csi.azure.com" }}
parameters:
  skuName: {{ .Values.storage.azure.skuName | default "Premium_LRS" }}
{{- else if .Values.storage.aws }}
provisioner: efs.csi.aws.com
parameters:
  provisioningMode: efs-ap
  fileSystemId: {{ include "awsStorageAccount" . }}
  directoryPerms: "777"
{{- else if .Values.storage.nfs }}
provisioner: {{ .Values.storage.nfs.provisioner }}
mountOptions:
  - hard
{{- end }}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "dagsterArtifactsPVName" . }}
spec:
  storageClassName: {{ include "dagsterArtifactsStorageClassName" . }}
  capacity:
    storage: {{ .Values.storage.capacity }}
  accessModes:
    - ReadWriteMany
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  {{- if .Values.storage.mountOptions }}
  mountOptions:
{{ toYaml .Values.storage.mountOptions | indent 4 }}
  {{- end }}
  {{ if .Values.storage.local }}
  local:
    path: {{ .Values.storage.local.artifacts }}
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/os
          operator: In
          values:
          - linux
  {{ else if .Values.storage.azure }}
  csi:
    driver: file.csi.azure.com
    # volumeHandle has to be unique within the cluster
    volumeHandle: {{ printf "%s-dagster-artifacts" .Release.Name | lower }}
    readOnly: false
    volumeAttributes:
      shareName: {{ .Values.storage.azure.shareName }}
      {{- if .Values.storage.azure.resourceGroup }}
      resourceGroup: {{ .Values.storage.azure.resourceGroup }}
      {{- end }}
    nodeStageSecretRef:
      name: {{ .Values.storage.azure.secretName | default "azure-storage-secret" }}
      namespace: {{ .Release.Namespace }}
  {{ else if .Values.storage.aws }}
  csi:
    driver: efs.csi.aws.com
    volumeHandle: {{ include "awsStorageAccount" . }}
  {{ else if .Values.storage.nfs }}
  nfs:
    server: {{ .Values.storage.nfs.url }}
    path: {{ .Values.storage.nfs.path }}
    readOnly: false
  {{ end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "dagsterArtifactsPVCName" . }}
  namespace: {{ .Release.Namespace }}
spec:
  storageClassName: {{ include "dagsterArtifactsStorageClassName" . }}
  volumeName: {{ include "dagsterArtifactsPVName" . }}
  resources:
    requests:
      storage: {{ .Values.storage.capacity }}
  accessModes:
    - ReadWriteMany
    - ReadOnlyMany
{{- end }}
