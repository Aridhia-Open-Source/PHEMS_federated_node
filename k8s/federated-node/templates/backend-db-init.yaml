{{- define "backendDbInit.podTemplate" -}}
spec:
  restartPolicy: Never
  initContainers:
    {{- include "pgWaitContainer" (dict "ctx" . "host" .Values.db.host "port" .Values.db.port) | nindent 4 }}
  containers:
    - name: db-init
      image: {{ include "fn-alpine" . }}
      imagePullPolicy: {{ .Values.pullPolicy }}
      {{- include "nonRootSC" . | nindent 6 }}
      command:
        - sh
        - -c
        - |
          psql -v ON_ERROR_STOP=1 -h {{ .Values.db.host }} -p {{ .Values.db.port }} \
            -U {{ .Values.db.superuser }} -d postgres << SQL
          SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', '{{ .Values.backend.db.user }}', '${BACKEND_DB_PASSWORD}')
            WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '{{ .Values.backend.db.user }}')\gexec
          ALTER ROLE {{ .Values.backend.db.user }} WITH LOGIN PASSWORD '${BACKEND_DB_PASSWORD}';
          SELECT format('CREATE DATABASE %I OWNER %I', '{{ .Values.backend.db.name }}', '{{ .Values.backend.db.user }}')
            WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = '{{ .Values.backend.db.name }}')\gexec
          ALTER DATABASE {{ include "backendDbName" . }} OWNER TO {{ .Values.backend.db.user }};
          GRANT ALL PRIVILEGES ON DATABASE {{ include "backendDbName" . }} TO {{ .Values.backend.db.user }};
          SQL
      env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.db.secret.name }}
              key: password
        - name: BACKEND_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.backend.db.secret.name }}
              key: {{ .Values.backend.db.secret.key }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  # A Job's pod template is immutable, so `helm upgrade` cannot patch an existing
  # Job whose template changed. Hashing the template into the name makes every
  # distinct spec a new Job; helm prunes the superseded one.
  name: backend-db-init-{{ include "backendDbInit.podTemplate" . | sha256sum | trunc 8 }}
  namespace: {{ .Release.Namespace }}
spec:
  backoffLimit: 2
  template:
    {{- include "backendDbInit.podTemplate" . | nindent 4 }}
