{{- if .Values.dagster.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: dagster-env-config
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/hook-weight": "-1"
data:
  DAGSTER_HOME: {{ .Values.dagsterHome | quote }}
  NAMESPACES_DEPLOYMENT: {{ .Release.Namespace }}
  NAMESPACES_TASKS: {{ include "tasks_namespace" . }}
  ARTIFACTS_MOUNT_PATH: {{ .Values.fnDagster.artifactMountPath | quote }}
  ARTIFACTS_PVC_NAME: {{ .Values.fnDagster.artifactsPvcName | quote }}
  TASKS_ACTIVE_DEADLINE_SECONDS: {{ .Values.fnDagster.taskPod.activeDeadlineSeconds | int64 | quote }}
  DAGSTER_PG_HOST: {{ include "dagsterDbHost" . | quote }}
  DAGSTER_PG_USER: {{ include "dagsterDbUser" . | quote }}
  DAGSTER_PG_NAME: {{ include "dagsterDbName" . | quote }}
  RESULTS_MAX_ZIP_BYTES: {{ .Values.fnDagster.results.maxZipBytes | int64 | quote }}
  SENSORS_INITIAL_STATUS: {{ .Values.fnDagster.sensors.initialStatus | quote }}
  SENSORS_MIN_INTERVAL_SECONDS: {{ .Values.fnDagster.sensors.minIntervalSeconds | quote }}
  SENSORS_RETRY_INTERVAL_SECONDS: {{ .Values.fnDagster.sensors.retryIntervalSeconds | quote }}
  RESULTS_MAX_ATTEMPTS: {{ .Values.fnDagster.sensors.deliveryMaxAttempts | quote }}
  SERVICES_NEXUS_URI: {{ include "nexusApiUrl" . | quote }}
  # dagster-keycloak-creds, mounted at /etc/secrets/dagster on the code server and run pods.
  SERVICES_NEXUS_PASSWORD_FILE: /etc/secrets/dagster/DAGSTER_KC_PASSWORD
  NODE_ID: {{ .Values.nodeId | quote }}
  {{- /*
  Pod securityContext for pipes task pods. Only emitted when set - an unset
  runAsUser must stay absent rather than be sent as null, which the API rejects.
  */}}
  {{- with (((.Values.fnDagster).artifacts).securityContext) }}
  {{- with .fsGroup }}
  TASKS_SECURITY_FS_GROUP: {{ . | quote }}
  {{- end }}
  {{- with .runAsUser }}
  TASKS_SECURITY_RUN_AS_USER: {{ . | quote }}
  {{- end }}
  {{- with .runAsGroup }}
  TASKS_SECURITY_RUN_AS_GROUP: {{ . | quote }}
  {{- end }}
  {{- with .supplementalGroups }}
  TASKS_SECURITY_SUPPLEMENTAL_GROUPS: {{ join "," . | quote }}
  {{- end }}
  {{- end }}
{{- end }}
