{{- if .Values.dagster.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: dagster-env-config
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/hook-weight": "-1"
data:
  DAGSTER_HOME: {{ .Values.dagsterHome | quote }}
  DAGSTER_DEPLOYMENT_NAMESPACE: {{ .Release.Namespace }}
  DAGSTER_USER_SERVICE_ACCOUNT_NAME: {{ .Release.Name }}-dagster-user-deployments-user-deployments
  DAGSTER_ARTIFACT_MOUNT_PATH: {{ .Values.fnDagster.artifactMountPath | quote }}
  DAGSTER_ARTIFACTS_PVC_NAME: {{ .Values.fnDagster.artifactsPvcName | quote }}
  DAGSTER_PG_HOST: {{ .Values.fnDagster.db.host | default .Values.db.host | quote }}
  DAGSTER_PG_USER: {{ .Values.fnDagster.db.user | quote }}
  DAGSTER_PG_NAME: {{ .Values.fnDagster.db.name | quote }}
  GH_RESULTS_DIR: {{ .Values.fnDagster.gh.resultsDir | quote }}
  GH_DELIVERY_REPO: {{ .Values.fnDagster.gh.delivery_repo | quote }}
  BACKEND_API_URI: {{ include "backendUri" . | quote }}
  {{- /*
  Pod securityContext for pipes task pods. Only emitted when set - an unset
  runAsUser must stay absent rather than be sent as null, which the API rejects.
  */}}
  {{- with (((.Values.fnDagster).artifacts).securityContext) }}
  {{- with .fsGroup }}
  DAGSTER_PIPES_FS_GROUP: {{ . | quote }}
  {{- end }}
  {{- with .runAsUser }}
  DAGSTER_PIPES_RUN_AS_USER: {{ . | quote }}
  {{- end }}
  {{- with .runAsGroup }}
  DAGSTER_PIPES_RUN_AS_GROUP: {{ . | quote }}
  {{- end }}
  {{- with .supplementalGroups }}
  DAGSTER_PIPES_SUPPLEMENTAL_GROUPS: {{ join "," . | quote }}
  {{- end }}
  {{- end }}
{{- end }}
