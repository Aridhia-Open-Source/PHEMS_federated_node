apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak
  namespace: {{ include "kc_namespace" . }}
  labels:
    app: keycloak
spec:
  serviceName: keycloak-headless
  replicas: {{ .Values.keycloak.replicas | default 2 }}
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      annotations:
        rollme: {{ template "rollMe" . }}
      labels:
        app: keycloak
    spec:
      initContainers:
        {{- /* keycloak-db-init is a pre-install hook, so the database already exists
               by now - except with an in-cluster Postgres, where the server is part
               of this release and its hook runs post-install. */}}
        {{- if .Values.create_db_deployment }}
        {{- include "pgWaitContainer" (dict "ctx" . "host" (include "dbKeycloakHost" . | trim) "port" (include "dbPort" .)) | nindent 8 }}
        {{- end }}
        - name: credentials-reset
          imagePullPolicy: {{ .Values.pullPolicy }}
          image: {{ include "fn-alpine" . }}
          command: ["keycloak-reset"]
          {{- include "nonRootSC" . | nindent 10 }}
          env:
          - name: PGPASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .Values.keycloak.db.secret.name }}
                key: {{ .Values.keycloak.db.secret.key }}
          - name: KC_NAMESPACE
            value: {{ include "kc_namespace" . }}
          - name: PGDATABASE
            value: {{ .Values.keycloak.db.name | quote }}
          envFrom:
          - secretRef:
              name: kc-secrets
          - configMapRef:
              name: keycloak-config
      containers:
        - image: ghcr.io/aridhia-open-source/federated_keycloak:{{ include "keycloak-image-tag" . }}
          args: [
            "start",
            "--import-realm",
            "--http-enabled=true",
            "--optimized"
          ]
          name: keycloak
          imagePullPolicy: {{ .Values.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 20
            periodSeconds: 10
          env:
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.db.secret.name }}
                  key: {{ .Values.keycloak.db.secret.key }}
          envFrom:
          - secretRef:
              name: kc-secrets
          - configMapRef:
              name: keycloak-config
          volumeMounts:
            - name: config
              mountPath: /opt/keycloak/data/import/
            - name: quarkus
              mountPath: /opt/keycloak/conf/quarkus.properties
              subPath: quarkus.properties
          {{- include "nonRootSC" . | nindent 10 }}
      volumes:
        - name: config
          configMap:
            name: keycloak-start-config
            items:
            - key: config.json
              path: config.json
        - name: quarkus
          configMap:
            name: keycloak-start-config
            items:
            - key: quarkus.properties
              path: quarkus.properties
        - name: db-init
          configMap:
            name: keycloak-start-config
            defaultMode: 0777
            items:
            - key: dbinit.sh
              path: dbinit.sh