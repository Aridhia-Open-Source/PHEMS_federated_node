apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak
  namespace: {{ include "kc_namespace" . }}
  labels:
    app: keycloak
spec:
  serviceName: keycloak-headless
  replicas: {{ .Values.keycloak.replicas | default 2 }}
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      annotations:
        rollme: {{ template "rollMe" . }}
      labels:
        app: keycloak
    spec:
      initContainers:
        - name: wait-for-db
          image: {{ include "fn-alpine" . }}
          imagePullPolicy: {{ .Values.pullPolicy }}
          {{- include "nonRootSC" . | nindent 10 }}
          command:
            - sh
            - -c
            - |
              until pg_isready -h $PGHOST -p {{ .Values.db.port }}; do
                echo "waiting for postgres..."
                sleep 2
              done
          env:
            - name: PGHOST
              valueFrom:
                configMapKeyRef:
                  name: keycloak-config
                  key: KC_DB_URL_HOST
        - name: wait-for-keycloak-database
          image: {{ include "fn-alpine" . }}
          imagePullPolicy: {{ .Values.pullPolicy }}
          {{- include "nonRootSC" . | nindent 10 }}
          command:
            - sh
            - -c
            - |
              until psql -h $PGHOST -p {{ .Values.db.port }} -U {{ .Values.db.superuser }} -d postgres -c "SELECT 1 FROM pg_database WHERE datname='$KC_DB_URL_DATABASE'" | grep -q 1; do
                echo "waiting for keycloak database..."
                sleep 2
              done
          env:
            - name: PGHOST
              valueFrom:
                configMapKeyRef:
                  name: keycloak-config
                  key: KC_DB_URL_HOST
            - name: KC_DB_URL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: keycloak-config
                  key: KC_DB_URL_DATABASE
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-superuser
                  key: password
        - name: credentials-reset
          imagePullPolicy: {{ .Values.pullPolicy }}
          image: {{ include "fn-alpine" . }}
          command: ["keycloak-reset"]
          {{- include "nonRootSC" . | nindent 10 }}
          env:
          - name: PGPASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .Values.keycloak.db.secret.name }}
                key: {{ .Values.keycloak.db.secret.key }}
          - name: KC_NAMESPACE
            value: {{ include "kc_namespace" . }}
          - name: PGDATABASE
            value: {{ .Values.keycloak.db.name | quote }}
          envFrom:
          - secretRef:
              name: kc-secrets
          - configMapRef:
              name: keycloak-config
      containers:
        - image: ghcr.io/aridhia-open-source/federated_keycloak:{{ include "keycloak-image-tag" . }}
          args: [
            "start",
            "--import-realm",
            "--http-enabled=true",
            "--optimized"
          ]
          name: keycloak
          imagePullPolicy: {{ .Values.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 20
            periodSeconds: 10
          env:
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.db.secret.name }}
                  key: {{ .Values.keycloak.db.secret.key }}
          envFrom:
          - secretRef:
              name: kc-secrets
          - configMapRef:
              name: keycloak-config
          volumeMounts:
            - name: config
              mountPath: /opt/keycloak/data/import/
            - name: quarkus
              mountPath: /opt/keycloak/conf/quarkus.properties
              subPath: quarkus.properties
          {{- include "nonRootSC" . | nindent 10 }}
      volumes:
        - name: config
          configMap:
            name: keycloak-start-config
            items:
            - key: config.json
              path: config.json
        - name: quarkus
          configMap:
            name: keycloak-start-config
            items:
            - key: quarkus.properties
              path: quarkus.properties
        - name: db-init
          configMap:
            name: keycloak-start-config
            defaultMode: 0777
            items:
            - key: dbinit.sh
              path: dbinit.sh