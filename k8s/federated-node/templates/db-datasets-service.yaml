{{ if .Values.datasetDb.create }}
apiVersion: v1
kind: Service
metadata:
  name: db-datasets
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - port: {{ .Values.datasetDb.port | default 5432 }}
      name: pgport
      targetPort: {{ .Values.datasetDb.port | default 5432 }}
      protocol: TCP
  selector:
    app: dataset-postgres
{{ end }}
