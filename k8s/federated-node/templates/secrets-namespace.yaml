{{- /* Where project secrets (dataset credentials, git tokens) are stored, apart from the release
       namespace and its database, Keycloak and Gitea secrets. The backend creates, reads, patches and
       deletes them. Dagster only reads them (dagster-user-roles.yaml). */}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "secrets_namespace" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-secrets-role
  namespace: {{ include "secrets_namespace" . }}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-secrets-role-binding
  namespace: {{ include "secrets_namespace" . }}
subjects:
{{- include "backendSubjects" . | nindent 2 }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-secrets-role
  apiGroup: rbac.authorization.k8s.io
