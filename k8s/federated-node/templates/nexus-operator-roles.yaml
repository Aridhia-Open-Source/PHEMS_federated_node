{{- if (.Values.operator).enabled }}
{{- /*
  What the operator may do in each namespace it watches: the five fn.aridhia.com kinds (patch for
  its finalizer and Kopf's annotations) and their status, get a NodeSecret's source Secret, and
  create Events. Nothing cluster-wide: Kopf runs namespaced with --namespace per namespace. Nothing in
  the release namespace (operator-namespace.yaml).

  Source Secrets: with operator.sourceSecrets empty, any Secret in a watched namespace (dev, where
  config/ names many). Set, only those names plus the ones nodeConfig.secrets names (fromSecret and
  every secretKeyRef), so a NodeSecret cannot copy another Secret, such as the operator's own
  login, into nexus-api. NodeSecrets applied by Flux or kubectl are not in nodeConfig: list their
  Secrets in sourceSecrets.
*/}}
{{- $sourceSecrets := list }}
{{- if (.Values.operator).sourceSecrets }}
{{- $sourceSecrets = .Values.operator.sourceSecrets }}
{{- range $_, $secret := (.Values.nodeConfig).secrets }}
{{- with $secret.fromSecret }}
{{- $sourceSecrets = append $sourceSecrets .name }}
{{- end }}
{{- range $_, $ref := $secret.values }}
{{- $sourceSecrets = append $sourceSecrets $ref.secretKeyRef.name }}
{{- end }}
{{- end }}
{{- $sourceSecrets = $sourceSecrets | uniq | sortAlpha }}
{{- end }}
{{- range (include "operatorNamespaces" . | fromJsonArray) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $.Release.Name }}-nexus-operator
  namespace: {{ . }}
rules:
- apiGroups: ["fn.aridhia.com"]
  resources: ["gitproviders", "nodesecrets", "repositories", "datasets", "projects"]
  verbs: ["get", "list", "watch", "patch"]
- apiGroups: ["fn.aridhia.com"]
  resources: ["gitproviders/status", "nodesecrets/status", "repositories/status", "datasets/status", "projects/status"]
  verbs: ["get", "patch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
  {{- with $sourceSecrets }}
  resourceNames: {{ toJson . }}
  {{- end }}
- apiGroups: ["", "events.k8s.io"]
  resources: ["events"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $.Release.Name }}-nexus-operator
  namespace: {{ . }}
subjects:
  - kind: ServiceAccount
    name: nexus-operator
    namespace: {{ include "operator_namespace" $ }}
roleRef:
  kind: Role
  name: {{ $.Release.Name }}-nexus-operator
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
