{{- if and .Values.gitea.enabled .Values.gitea.actions.runner.enabled }}
{{- /*
The runner registration token. Gitea takes it as GITEA_RUNNER_REGISTRATION_TOKEN (at least 32 characters) and the
runner registers with it, so neither waits on a hook. Generated once and kept across upgrades.
*/}}
{{- $s := .Values.gitea.actions.runner.secret }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $s.name }}
{{- $token := "" }}
{{- if $existing }}
{{- $token = index $existing.data $s.key }}
{{- end }}
{{- if not $token }}{{- $token = randAlphaNum 48 | b64enc }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $s.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{ include "defaultLabels" . }}
data:
  {{ $s.key }}: {{ $token | quote }}
{{- end }}
