apiVersion: v1
kind: ConfigMap
metadata:
  name: nexus-api-configmap
  namespace: {{ .Release.Namespace }}
data:
  NEXUS_ROLE: api
  DATABASE_HOST: {{ .Values.db.host | quote }}
  DATABASE_PORT: {{ .Values.db.port | quote }}
  DATABASE_NAME: {{ .Values.nexus.api.db.name | quote }}
  DATABASE_USER: {{ .Values.nexus.api.db.user | quote }}
  OWNER_GROUPS: {{ .Values.nexus.api.ownerGroups | join "," | quote }}
  SERVICES_KEYCLOAK_URL: "http://keycloak.{{ include "kc_namespace" . }}.svc.cluster.local"
  SERVICES_KEYCLOAK_ADMIN: admin
  SERVICES_KEYCLOAK_SERVICE_USER: fn-service
  DEFAULT_NAMESPACE: {{ .Release.Namespace }}
  KEYCLOAK_NAMESPACE: {{ include "kc_namespace" . }}
  {{- /*
    Where kc-secrets is mounted. nexus-api reads credentials from these files rather than from its
    environment, so a rotation reaches it without a restart.
  */}}
  SERVICES_KEYCLOAK_SECRETS_PATH: {{ include "kcSecretsMountPath" . }}
  {{- /*
    Cache service-account tokens briefly. Keycloak() otherwise performs a fresh password grant on
    every instantiation, and a single request builds several of them -- which would turn the short
    cutover during a credential rotation into a total outage rather than a few retried calls.
  */}}
  SERVICES_KEYCLOAK_TOKEN_CACHE_TTL: {{ .Values.keycloak.tokenCacheSeconds | default 30 | quote }}
  NAMESPACES_TASKS: {{ include "tasks_namespace" . }}
  NAMESPACES_QUARANTINE: {{ include "quarantine_namespace" . }}
  NAMESPACES_SECRETS: {{ include "secrets_namespace" . }}
  SERVICES_DAGSTER_URI: {{ include "dagsterWebserverUri" . | quote }}
  NODE_HOSTNAME: {{ .Values.host | default "" | quote }}
  TASKS_LIMITS_MAX_CPU: {{ .Values.taskCompute.max.cpu | quote }}
  TASKS_LIMITS_MAX_MEMORY: {{ .Values.taskCompute.max.memory | quote }}
  TASKS_LIMITS_DEFAULT_LIMIT_CPU: {{ .Values.taskCompute.default.limits.cpu | quote }}
  TASKS_LIMITS_DEFAULT_LIMIT_MEMORY: {{ .Values.taskCompute.default.limits.memory | quote }}
{{- if .Values.db.enforceSSL }}
  DATABASE_SSL: "?sslmode=require"
{{- end }}
