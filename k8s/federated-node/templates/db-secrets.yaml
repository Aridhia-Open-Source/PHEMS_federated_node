{{/*
Database passwords: generated on first install, reused on every upgrade (fn.dbPassword
in _db.tpl).

Release-namespace documents are hooks at weight -3, because the *-db-init Jobs are
hooks and run before the main manifest. Never hook-succeeded/hook-failed here - that
would delete a password the running pods need. Copies in other namespaces are plain
resources: as hooks they get pruned with the previous revision's copy-secrets resource
of the same name, leaving Keycloak passwordless for a revision.

Nothing is emitted at all when db.createPasswordSecrets is false: something else owns
these Secrets (External Secrets, SealedSecrets, Vault) and the chart only ever reads
them through secretKeyRef at runtime. Same when db.manageRolesAndDatabases is false
unless db.passwords pins a value - see the dbCheckJob comment in db-init-jobs.yaml.
*/}}
{{- $relNs := .Release.Namespace -}}
{{- $kcNs := include "kc_namespace" . -}}
{{- $pw := (.Values.db.passwords | default dict) -}}
{{- $manage := .Values.db.manageRolesAndDatabases -}}
{{- $items := list -}}
{{- if .Values.db.createPasswordSecrets -}}

{{- if .Values.create_db_deployment -}}
{{- $items = append $items (dict
      "name" .Values.db.secret.name
      "key" .Values.db.secret.key
      "plain" $pw.superuser
      "generate" true
      "hookNs" (list $relNs)
      "plainNs" list) -}}
{{- end -}}

{{- $items = append $items (dict
      "name" .Values.backend.db.secret.name
      "key" .Values.backend.db.secret.key
      "plain" $pw.backend
      "generate" $manage
      "hookNs" (list $relNs)
      "plainNs" list) -}}

{{- $items = append $items (dict
      "name" .Values.keycloak.db.secret.name
      "key" .Values.keycloak.db.secret.key
      "plain" $pw.keycloak
      "generate" $manage
      "hookNs" (list $relNs)
      "plainNs" (ternary list (list $kcNs) (eq $relNs $kcNs))) -}}

{{- if .Values.dagster.enabled -}}
{{- $items = append $items (dict
      "name" (include "dagsterDbSecretName" .)
      "key" (include "dagsterDbSecretKey" .)
      "plain" $pw.dagster
      "generate" $manage
      "hookNs" (list $relNs)
      "plainNs" list) -}}
{{- end -}}

{{- /* Only when the chart deploys the dataset server: these roles are created and
       read by db-datasets-init alone. */}}
{{- if .Values.datasetDb.create -}}
{{- $items = append $items (dict
      "name" .Values.datasetDb.secret.name
      "key" .Values.datasetDb.secret.key
      "plain" (($pw.datasets | default dict).superuser)
      "generate" true
      "hookNs" (list $relNs)
      "plainNs" list) -}}
{{- range $key, $cfg := .Values.datasetDb.dbs -}}
{{- $items = append $items (dict
      "name" $cfg.secret.name
      "key" $cfg.secret.key
      "plain" (index ($pw.datasets | default dict) $key)
      "generate" true
      "hookNs" (list $relNs)
      "plainNs" list) -}}
{{- end -}}
{{- end -}}

{{- range $item := $items }}
{{- $lookupNs := concat $item.hookNs $item.plainNs | uniq }}
{{- $value := include "fn.dbPassword" (dict "namespaces" $lookupNs "name" $item.name "key" $item.key "plain" $item.plain "generate" $item.generate) }}
{{- /* Ours to write only if we generate it, or the operator pinned it. */}}
{{- $own := or $item.generate (not (empty $item.plain)) }}
{{- if $value }}
{{- range $ns := (ternary $item.hookNs list $own) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $item.name }}
  namespace: {{ $ns }}
  labels:
    federatednode.com/generated-password: "true"
    {{ include "defaultLabels" $ }}
  annotations:
    {{ include "defaultAnnotations" $ }}
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-3"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
data:
  {{ $item.key }}: {{ $value | quote }}
---
{{- end }}
{{- range $ns := $item.plainNs }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $item.name }}
  namespace: {{ $ns }}
  labels:
    federatednode.com/generated-password: "true"
    {{ include "defaultLabels" $ }}
type: Opaque
data:
  {{ $item.key }}: {{ $value | quote }}
---
{{- end }}
{{- end }}
{{- end }}
{{- end }}
