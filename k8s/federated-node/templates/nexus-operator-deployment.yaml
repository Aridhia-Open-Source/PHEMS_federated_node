{{- if (.Values.operator).enabled }}
{{- /*
  The Kopf operator (nexus/operator, ADR 0032). One replica with Recreate, so two never run at once
  and Kopf's peering stays off (--standalone in the image). Nothing calls it, so no Service.
  It logs in to nexus-api as fn-operator (Administrator), from operator-keycloak-creds
  (keycloak-secrets.yaml). The password is a mounted file read at every login, not env, so the
  credential rotation reaches it without a restart (a directory mount: a subPath one never refreshes).
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nexus-operator
  namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-operator
  namespace: {{ .Release.Namespace }}
  labels:
    app: nexus-operator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nexus-operator
  template:
    metadata:
      labels:
        app: nexus-operator
    spec:
      serviceAccountName: nexus-operator
      containers:
        - name: nexus-operator
          image: {{ template "nexus-operator-image" . }}
          imagePullPolicy: {{ .Values.pullPolicy }}
          {{- include "nonRootSC" . | nindent 10 }}
          {{- /* Appended to the image's `kopf run` entrypoint */}}
          args:
            {{- range (include "operatorNamespaces" . | fromJsonArray) }}
            - --namespace={{ . }}
            {{- end }}
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
          ports:
            - name: health
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 30
          env:
            - name: NEXUS_API_URL
              value: {{ include "nexusApiUrl" . | quote }}
            - name: OPERATOR_SYNC_INTERVAL_SECONDS
              value: {{ .Values.operator.syncIntervalSeconds | quote }}
            - name: OPERATOR_KC_USER
              valueFrom:
                secretKeyRef:
                  name: operator-keycloak-creds
                  key: OPERATOR_KC_USER
            - name: OPERATOR_KC_PASSWORD_FILE
              value: /etc/secrets/operator/OPERATOR_KC_PASSWORD
          volumeMounts:
            - name: operator-keycloak-creds
              mountPath: /etc/secrets/operator
              readOnly: true
      volumes:
        - name: operator-keycloak-creds
          secret:
            secretName: operator-keycloak-creds
{{- end }}
