{{- /*
  The CA bundle for outbound TLS (see customCA in values.yaml and the helpers in
  _helpers.tpl). Inline PEM becomes a Secret in every namespace that mounts it. A Secret
  the operator names is used as it is, and copied into the Keycloak namespace, which
  a Secret cannot be mounted across.
*/ -}}
{{- if include "fn.customCA.enabled" . }}
{{- if .Values.customCA.pem }}
{{- range (list .Release.Namespace (include "kc_namespace" .)) | uniq }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fn.customCA.secretName" $ }}
  namespace: {{ . }}
  labels:
    {{- include "federated-node.labels" $ | nindent 4 }}
type: Opaque
stringData:
  {{ $.Values.customCA.key }}: |
    {{- $.Values.customCA.pem | trim | nindent 4 }}
---
{{- end }}
{{- else if ne (include "kc_namespace" .) .Release.Namespace }}
{{- include "fn.copySecret" (dict "ctx" . "name" .Values.customCA.secretName "target" (include "kc_namespace" .)) }}
{{- end }}
{{- end }}
