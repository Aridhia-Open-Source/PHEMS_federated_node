suite: Dagster run pod's access to the tasks namespace
release:
  namespace: federatednode
  name: federatednode
values:
  - values/values-local.yaml
set:
  dagster:
    enabled: true
    postgresql:
      postgresqlHost: db.default.svc
  fnDagster:
    createDB: true
templates:
  - dagster-user-roles.yaml
tests:
  - it: gives the run pod no access to ConfigMaps in the tasks namespace, a run's are nexus-api's
    documentIndex: 2
    asserts:
      - equal:
          path: metadata.name
          value: federatednode-dagster-task-pod-role
      - equal:
          path: metadata.namespace
          value: tasks
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["configmaps"]
            verbs: ["create", "get", "delete"]
      - lengthEqual:
          path: rules
          count: 3
