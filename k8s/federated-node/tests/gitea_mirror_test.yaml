suite: gitea mirror service
release:
  namespace: federatednode
  name: federatednode
templates:
  - templates/gitea-mirror-deployment.yaml
  - templates/gitea-mirror-service.yaml
  - templates/gitea-mirror-secrets.yaml
  - templates/gitea-mirror-rbac.yaml
  - templates/gitea-mirror-networkpolicy.yaml
  - templates/gitea-init-job.yaml
  - templates/db-init-jobs.yaml
  - templates/db-secrets.yaml
values:
  - values/values-local.yaml
set:
  gitea:
    enabled: true
    admin:
      secret:
        name: gitea-admin
        key: password
tests:
  - it: renders no mirror objects by default
    asserts:
      - hasDocuments:
          count: 0
        template: templates/gitea-mirror-deployment.yaml
      - hasDocuments:
          count: 0
        template: templates/gitea-mirror-service.yaml
      - hasDocuments:
          count: 0
        template: templates/gitea-mirror-secrets.yaml
      - hasDocuments:
          count: 0
        template: templates/gitea-mirror-rbac.yaml
      - hasDocuments:
          count: 0
        template: templates/gitea-mirror-networkpolicy.yaml
      - notMatchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "gitea_mirror"
        template: templates/db-init-jobs.yaml
        documentSelector:
          path: metadata.name
          value: gitea-db-init

  - it: creates the gitea_mirror database, user and password secret
    set:
      giteaMirror:
        enabled: true
    asserts:
      - exists:
          path: spec
        template: templates/db-init-jobs.yaml
        documentSelector:
          path: metadata.name
          value: gitea-mirror-db-init
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "gitea_mirror"
        template: templates/db-init-jobs.yaml
        documentSelector:
          path: metadata.name
          value: gitea-mirror-db-init
      - equal:
          path: spec.template.spec.containers[0].env[1].valueFrom.secretKeyRef.name
          value: gitea-mirror-db
        template: templates/db-init-jobs.yaml
        documentSelector:
          path: metadata.name
          value: gitea-mirror-db-init
      - exists:
          path: data.password
        template: templates/db-secrets.yaml
        documentSelector:
          path: metadata.name
          value: gitea-mirror-db

  - it: deployment migrates, sets the env the app reads, and caches in an emptyDir
    set:
      giteaMirror:
        enabled: true
    template: templates/gitea-mirror-deployment.yaml
    asserts:
      - equal:
          path: metadata.name
          value: gitea-mirror
      - equal:
          path: spec.template.spec.serviceAccountName
          value: gitea-mirror
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: db-migrations
      - equal:
          path: spec.template.spec.initContainers[1].args[1]
          value: python -m alembic upgrade head
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "^ghcr.io/aridhia-open-source/gitea_mirror:"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GITEA_MIRROR_DB_USER
            value: gitea_mirror
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GITEA_MIRROR_DB_NAME
            value: gitea_mirror
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GITEA_MIRROR_DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: gitea-mirror-db
                key: password
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GITEA_MIRROR_API_TOKEN
            valueFrom:
              secretKeyRef:
                name: gitea-mirror-api-token
                key: token
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GITEA_MIRROR_GITEA_URL
            value: http://gitea.federatednode.svc:4000
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GITEA_MIRROR_GITEA_TOKEN
            valueFrom:
              secretKeyRef:
                name: gitea-mirror-gitea-token
                key: token
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GITEA_MIRROR_GITEA_TOKEN
            valueFrom:
              secretKeyRef:
                name: gitea-admin
                key: password
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GITEA_MIRROR_GIT_CACHE_DIR
            value: /tmp/git-cache
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GITEA_MIRROR_SYNC_INTERVAL_SECONDS
            value: "300"
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[1].mountPath
          value: /tmp/git-cache
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
      - exists:
          path: spec.template.spec.containers[0].startupProbe
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.tcpSocket.port
          value: http
      - notExists:
          path: spec.template.spec.containers[0].command
      - equal:
          path: spec.template.spec.volumes[1].emptyDir.sizeLimit
          value: 5Gi

  - it: refuses more than one replica
    set:
      giteaMirror:
        enabled: true
        replicaCount: 2
    template: templates/gitea-mirror-deployment.yaml
    asserts:
      - failedTemplate:
          errorPattern: "replicaCount must be 1"

  - it: the init job makes the gitea token secret only when the mirror is enabled
    template: templates/gitea-init-job.yaml
    set:
      gitea:
        admin:
          user: gitea_admin
      giteaMirror:
        enabled: true
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: gitea-admin-init
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "generate-access-token"
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "write:organization,write:repository,write:user,read:user"
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: '"\$code" = 200'
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TOKEN_SECRET
            value: gitea-mirror-gitea-token

  - it: the init job has no token step without the mirror
    template: templates/gitea-init-job.yaml
    set:
      gitea:
        admin:
          user: gitea_admin
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "generate-access-token"
      - notExists:
          path: spec.template.spec.serviceAccountName

  - it: service and generated api token secret
    set:
      giteaMirror:
        enabled: true
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 5000
        template: templates/gitea-mirror-service.yaml
      - equal:
          path: metadata.name
          value: gitea-mirror-api-token
        template: templates/gitea-mirror-secrets.yaml
      - exists:
          path: data.token
        template: templates/gitea-mirror-secrets.yaml

  - it: grants get on named secrets only, and nothing when no names are listed
    set:
      giteaMirror:
        enabled: true
        secretAccess:
          - names: [github-token, webhook-hmac]
          - namespace: other
            names: []
    template: templates/gitea-mirror-rbac.yaml
    asserts:
      - hasDocuments:
          count: 6
      - equal:
          path: metadata.name
          value: gitea-mirror
        documentIndex: 0
      - equal:
          path: kind
          value: ServiceAccount
        documentIndex: 0
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: ["secrets"]
              resourceNames: [github-token, webhook-hmac]
              verbs: ["get"]
        documentIndex: 1
      - equal:
          path: metadata.namespace
          value: federatednode
        documentIndex: 1
      - equal:
          path: subjects[0].name
          value: gitea-mirror
        documentIndex: 2

  - it: gives each secretAccess entry its own Role and RoleBinding, even in one namespace
    set:
      giteaMirror:
        enabled: true
        secretAccess:
          - names: [github-token]
          - names: [webhook-hmac]
    template: templates/gitea-mirror-rbac.yaml
    asserts:
      - hasDocuments:
          count: 8
      - equal:
          path: metadata.name
          value: gitea-mirror-secrets-0
        documentIndex: 1
      - equal:
          path: metadata.name
          value: gitea-mirror-secrets-0
        documentIndex: 2
      - equal:
          path: metadata.name
          value: gitea-mirror-secrets-1
        documentIndex: 3
      - equal:
          path: roleRef.name
          value: gitea-mirror-secrets-1
        documentIndex: 4

  - it: lets the init job create the token secret and read only that one
    set:
      giteaMirror:
        enabled: true
    template: templates/gitea-mirror-rbac.yaml
    asserts:
      - equal:
          path: rules[0].resourceNames
          value: [gitea-mirror-gitea-token]
        documentIndex: 6

  - it: network policy limits ingress to the namespace and egress to what the service needs
    set:
      giteaMirror:
        enabled: true
    template: templates/gitea-mirror-networkpolicy.yaml
    asserts:
      - equal:
          path: spec.ingress
          value:
            - from:
                - podSelector: {}
              ports:
                - protocol: TCP
                  port: 5000
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 0.0.0.0/0
            ports:
              - protocol: TCP
                port: 443
      - contains:
          path: spec.egress
          content:
            to:
              - podSelector:
                  matchLabels:
                    app: gitea
            ports:
              - protocol: TCP
                port: 3000
      - contains:
          path: spec.egress
          content:
            ports:
              - protocol: TCP
                port: 5432
      - contains:
          path: spec.egress
          content:
            ports:
              - protocol: UDP
                port: 53
              - protocol: TCP
                port: 53
