## Volume-mounted credentials and the rotation CronJob.
##
## The two guard tests here matter more than the rest. A consumer left on `envFrom`, or mounted with
## `subPath`, does not fail at deploy time -- it fails 30 days later at the first rotation, holding a
## credential Keycloak no longer accepts. These assertions turn that into a build failure instead,
## and stop a future change silently reintroducing it.
suite: Keycloak credential rotation
release:
  namespace: federatednode
  name: federatednode
  revision: 2
  upgrade: true
templates:
  - templates/nexus-api-deployment.yaml
  - templates/keycloak-realm-controller.yaml
  - templates/keycloak-statefulset.yaml
  - templates/keycloak-rotation-cronjob.yaml
  - templates/keycloak-rotation-rbac.yaml
  ## Needed for the StatefulSet's cross-template checksum include.
  - templates/keycloak-configmap.yaml
values:
  - values/values-upgrade.yaml
kubernetesProvider:
  scheme:
    v1/Secret:
      gvr:
        version: v1
        resource: secrets
      namespaced: true
  objects:
    - apiVersion: v1
      kind: Secret
      metadata:
        name: kc-secrets
        namespace: federatednode
      data:
        KEYCLOAK_SECRET: dGVzdA==
        KEYCLOAK_ADMIN_PASSWORD: dGVzdA==
        KC_BOOTSTRAP_ADMIN_PASSWORD: dGVzdA==
        KEYCLOAK_SERVICE_PASSWORD: dGVzdA==
        CREDENTIAL_GENERATION: MQ==

tests:
  ## === The time-bomb guards ===
  - it: does not inject credentials into nexus-api as environment variables
    template: templates/nexus-api-deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: kc-secrets

  - it: does not inject credentials into realm-init as environment variables
    template: templates/keycloak-realm-controller.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: kc-secrets

  - it: mounts credentials into nexus-api as a directory, never with subPath
    template: templates/nexus-api-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: kc-secrets
            mountPath: /etc/secrets/kc
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: kc-secrets
            secret:
              secretName: kc-secrets

  - it: mounts credentials into realm-init as a directory, never with subPath
    template: templates/keycloak-realm-controller.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: kc-secrets
            mountPath: /etc/secrets/kc
            readOnly: true

  ## Keycloak is the authority for these credentials, not a consumer of rotated ones: its bootstrap
  ## password and the realms.json import substitution are startup configuration, and it restarts when
  ## they change. Converting it would buy nothing, so it deliberately keeps envFrom.
  - it: leaves the Keycloak StatefulSet on envFrom deliberately
    template: templates/keycloak-statefulset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: kc-secrets

  ## A credential checksum on nexus-api would restart it on every rotation, defeating the point of
  ## mounting the secret in the first place.
  - it: does not restart nexus-api when credentials rotate
    template: templates/nexus-api-deployment.yaml
    asserts:
      - notExists:
          path: spec.template.metadata.annotations["fn.aridhia.com/credential-generation"]

  ## === RBAC ===
  - it: creates the rotation ServiceAccount only when rotation is enabled
    template: templates/keycloak-rotation-rbac.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: limits the rotation job to patching the credential Secrets in the namespaces it touches
    template: templates/keycloak-rotation-rbac.yaml
    set:
      keycloak:
        credentialRotation:
          enabled: true
      dagster:
        enabled: true
    asserts:
      - hasDocuments:
          count: 5
      - isKind:
          of: ServiceAccount
        documentIndex: 0
      - equal:
          path: metadata.name
          value: keycloak-credential-rotator
        documentIndex: 0
      ## Namespaced Roles, never a ClusterRole: one in the release namespace, one in keycloak
      - isKind:
          of: Role
        documentIndex: 1
      - equal:
          path: metadata.namespace
          value: federatednode
        documentIndex: 1
      - equal:
          path: metadata.namespace
          value: keycloak
        documentIndex: 3
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: ["secrets"]
              resourceNames: ["kc-secrets", "dagster-keycloak-creds"]
              verbs: ["patch"]
        documentIndex: 1
      - isKind:
          of: RoleBinding
        documentIndex: 2

  - it: leaves the Dagster credential Secret out of the rotation Role when Dagster is off
    template: templates/keycloak-rotation-rbac.yaml
    set:
      keycloak:
        credentialRotation:
          enabled: true
      dagster:
        enabled: false
    asserts:
      - equal:
          path: rules[0].resourceNames
          value: ["kc-secrets"]
        documentIndex: 1

  ## === CronJob ===
  - it: is not created unless rotation is explicitly enabled
    template: templates/keycloak-rotation-cronjob.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: rotates monthly and cannot overlap itself
    template: templates/keycloak-rotation-cronjob.yaml
    set:
      keycloak:
        credentialRotation:
          enabled: true
    asserts:
      - equal:
          path: spec.schedule
          value: "0 3 1 * *"
      - equal:
          path: spec.concurrencyPolicy
          value: Forbid
      ## Bounded, so a wedged run cannot block every subsequent schedule under Forbid.
      - equal:
          path: spec.jobTemplate.spec.activeDeadlineSeconds
          value: 900
      - equal:
          path: spec.jobTemplate.spec.template.spec.serviceAccountName
          value: keycloak-credential-rotator

  ## Every copy of kc-secrets must be patched, or components in different namespaces end up
  ## disagreeing about the current credential.
  - it: targets every namespace holding a copy of the credentials
    template: templates/keycloak-rotation-cronjob.yaml
    set:
      keycloak:
        credentialRotation:
          enabled: true
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: KC_SECRET_NAMESPACES
            value: "federatednode,keycloak"

  - it: allows rotating only the client secret, which is the one with a grace period
    template: templates/keycloak-rotation-cronjob.yaml
    set:
      keycloak:
        credentialRotation:
          enabled: true
          rotate:
            clientSecret: true
            servicePassword: false
            dagsterPassword: false
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: ROTATE_SERVICE_PASSWORD
            value: "false"
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: ROTATE_CLIENT_SECRET
            value: "true"
