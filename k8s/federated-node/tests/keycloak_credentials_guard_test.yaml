## The missing-secret guard.
##
## Deliberately a separate suite from keycloak_credentials_test.yaml: kubernetesProvider is
## suite-level, so exercising "no kc-secrets in the cluster" requires a suite that seeds nothing.
##
## Why the guard exists: `lookup` returns nil when it cannot reach the cluster (notably ArgoCD
## without the --dry-run=server shim). Without this guard, that situation silently mints new
## credentials on every sync -- worse than the original bug, and hard to diagnose.
suite: Keycloak credential guard
release:
  namespace: federatednode
  name: federatednode
  revision: 2
  upgrade: true
templates:
  - templates/keycloak-secrets.yaml
values:
  - values/values-upgrade.yaml

tests:
  - it: fails loudly when kc-secrets is absent on an upgrade
    asserts:
      - failedTemplate:
          errorPattern: "kc-secrets not found on upgrade"

  - it: allows a deliberate recreate via the escape hatch
    set:
      keycloak:
        recreateMissingSecrets: true
    documentIndex: 0
    asserts:
      - isKind:
          of: Secret
      - isNotEmpty:
          path: data.KEYCLOAK_SECRET
      - isNotEmpty:
          path: data.KEYCLOAK_SERVICE_PASSWORD
      - equal:
          path: data.CREDENTIAL_GENERATION
          value: MQ==

## First-install coverage lives in keycloak_credentials_install_test.yaml -- a test-level
## `release` block does not clear the suite-level `upgrade: true`, so it needs its own suite.
