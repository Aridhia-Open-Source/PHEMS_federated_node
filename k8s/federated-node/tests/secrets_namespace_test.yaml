## Project secrets live in their own namespace, and each account reaches only the namespaces it needs.
## No ClusterRole or ClusterRoleBinding may give anything Secrets cluster-wide.
suite: Secrets namespace and RBAC
release:
  namespace: federatednode
  name: federatednode
values:
  - values/values-local.yaml
set:
  dagster:
    enabled: true
    postgresql:
      postgresqlHost: db.default.svc
  fnDagster:
    createDB: true
    gh:
      delivery_repo: https://github.com/org/repo
      resultsDir: mgmt/results
templates:
  - templates/secrets-namespace.yaml
  - templates/backend-roles.yaml
  - templates/quarantine-namespace.yaml
  - templates/dagster-user-roles.yaml
  - templates/backend-configmap.yaml
tests:
  - it: creates the secrets namespace, named fn-secrets by default
    template: templates/secrets-namespace.yaml
    asserts:
      - isKind:
          of: Namespace
        documentIndex: 0
      - equal:
          path: metadata.name
          value: fn-secrets
        documentIndex: 0

  - it: names the secrets namespace from global.namespaces.secrets
    set:
      global:
        namespaces:
          secrets: node-secrets
    asserts:
      - equal:
          path: metadata.name
          value: node-secrets
        template: templates/secrets-namespace.yaml
        documentIndex: 0
      - equal:
          path: data.SECRETS_NAMESPACE
          value: node-secrets
        template: templates/backend-configmap.yaml

  - it: tells the backend where project secrets are
    template: templates/backend-configmap.yaml
    asserts:
      - equal:
          path: data.SECRETS_NAMESPACE
          value: fn-secrets

  - it: lets the backend store secrets in the secrets namespace
    template: templates/secrets-namespace.yaml
    asserts:
      - equal:
          path: metadata.namespace
          value: fn-secrets
        documentIndex: 1
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: ["secrets"]
              verbs: ["get", "create", "patch", "delete"]
        documentIndex: 1
      - contains:
          path: subjects
          content:
            kind: ServiceAccount
            namespace: federatednode
            name: secret-backend-handler
        documentIndex: 2
      - lengthEqual:
          path: subjects
          count: 1
        documentIndex: 2

  - it: lets the backend reach quarantine
    template: templates/quarantine-namespace.yaml
    asserts:
      - contains:
          path: subjects
          content:
            kind: ServiceAccount
            namespace: federatednode
            name: secret-backend-handler
        documentIndex: 2
      - lengthEqual:
          path: subjects
          count: 1
        documentIndex: 2

  - it: gives the backend Secrets in the tasks namespace for registry pull secrets, and no list
    template: templates/backend-roles.yaml
    asserts:
      - isKind:
          of: Role
        documentIndex: 0
      - equal:
          path: metadata.namespace
          value: tasks
        documentIndex: 0
      - equal:
          path: rules[0].verbs
          value: ["get", "create", "patch", "delete"]
        documentIndex: 0
      - contains:
          path: subjects
          content:
            kind: ServiceAccount
            namespace: federatednode
            name: secret-backend-handler
        documentIndex: 1
      - lengthEqual:
          path: subjects
          count: 1
        documentIndex: 1

  - it: has no ClusterRole or ClusterRoleBinding in the templates that grant Secrets
    templates:
      - templates/backend-roles.yaml
      - templates/secrets-namespace.yaml
      - templates/quarantine-namespace.yaml
      - templates/dagster-user-roles.yaml
    asserts:
      - notEqual:
          path: kind
          value: ClusterRole
      - notEqual:
          path: kind
          value: ClusterRoleBinding

  - it: lets Dagster read the secrets namespace and nothing else
    template: templates/dagster-user-roles.yaml
    asserts:
      - equal:
          path: metadata.namespace
          value: fn-secrets
        documentIndex: 0
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: ["secrets"]
              verbs: ["get"]
        documentIndex: 0
      - equal:
          path: metadata.namespace
          value: fn-secrets
        documentIndex: 1
      - contains:
          path: subjects
          content:
            kind: ServiceAccount
            namespace: federatednode
            name: federatednode-dagster-code-server
        documentIndex: 1
      - contains:
          path: subjects
          content:
            kind: ServiceAccount
            namespace: federatednode
            name: federatednode-dagster
        documentIndex: 1

  - it: lets Dagster create and delete Secrets in the tasks namespace, not read them
    template: templates/dagster-user-roles.yaml
    asserts:
      - equal:
          path: metadata.namespace
          value: tasks
        documentIndex: 2
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets"]
            verbs: ["create", "delete"]
        documentIndex: 2
