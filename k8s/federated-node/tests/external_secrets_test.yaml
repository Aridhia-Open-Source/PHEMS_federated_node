suite: external secrets
templates:
  - external-secrets.yaml
release:
  namespace: federatednode
  name: federatednode
values:
  - values/values-local.yaml
set:
  operator:
    enabled: true
  externalSecrets:
    enabled: true
    secrets:
      fn-trigger-repo-creds:
        TOKEN: fn-trigger-repo-token
        USERNAME: fn-trigger-repo-user
tests:
  - it: renders nothing by default
    set:
      externalSecrets.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: puts the ServiceAccount, the store and each ExternalSecret in the operator namespace
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: metadata.namespace
          value: fn-operator

  - it: logs in to OpenBao with the ServiceAccount through Kubernetes auth
    documentSelector:
      path: kind
      value: SecretStore
    asserts:
      - equal:
          path: spec.provider.vault
          value:
            server: http://openbao.openbao.svc:8200
            path: secret
            version: v2
            auth:
              kubernetes:
                mountPath: kubernetes
                role: fn-external-secrets
                serviceAccountRef:
                  name: fn-external-secrets
      - notExists:
          path: spec.provider.azurekv

  - it: reads each key from its own remote secret, the OpenBao value under "value"
    documentSelector:
      path: kind
      value: ExternalSecret
    asserts:
      - equal:
          path: metadata.name
          value: fn-trigger-repo-creds
      - equal:
          path: spec.target.name
          value: fn-trigger-repo-creds
      - equal:
          path: spec.secretStoreRef
          value:
            kind: SecretStore
            name: fn-secret-store
      - equal:
          path: spec.data
          value:
            - secretKey: TOKEN
              remoteRef:
                key: fn-trigger-repo-token
                property: value
            - secretKey: USERNAME
              remoteRef:
                key: fn-trigger-repo-user
                property: value

  - it: uses Azure Key Vault through workload identity on the annotated ServiceAccount
    set:
      externalSecrets.provider: azureKeyVault
      externalSecrets.azureKeyVault.vaultUrl: https://fn-site.vault.azure.net
      externalSecrets.serviceAccount.annotations:
        azure.workload.identity/client-id: 00000000-0000-0000-0000-000000000000
    asserts:
      - equal:
          path: spec.provider.azurekv
          value:
            authType: WorkloadIdentity
            vaultUrl: https://fn-site.vault.azure.net
            serviceAccountRef:
              name: fn-external-secrets
        documentSelector:
          path: kind
          value: SecretStore
      - equal:
          path: metadata.annotations
          value:
            azure.workload.identity/client-id: 00000000-0000-0000-0000-000000000000
        documentSelector:
          path: kind
          value: ServiceAccount
      - notExists:
          path: spec.data[0].remoteRef.property
        documentSelector:
          path: kind
          value: ExternalSecret

  - it: refuses Azure Key Vault without a vault URL
    set:
      externalSecrets.provider: azureKeyVault
    asserts:
      - failedTemplate: {}

  - it: refuses a remote name Azure Key Vault cannot hold
    set:
      externalSecrets.secrets:
        fn-trigger-repo-creds:
          TOKEN: fn_trigger_repo_token
    asserts:
      - failedTemplate: {}
