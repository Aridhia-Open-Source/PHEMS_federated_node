suite: Bring-your-own databases - with the role secrets in place
# A reachable cluster and every secret a BYO install needs, with no
# postgres-superuser - helm-unittest has no negative errorPattern, so a clean render
# is how the relaxed requirement is proven.
release:
  namespace: federatednode
  name: federatednode
values:
  - values/values-aks.yaml
set:
  db:
    manageRolesAndDatabases: false
  dagster:
    enabled: true
    postgresql:
      postgresqlHost: postgres.postgres.database.azure.com
  datasetDb:
    create: false
kubernetesProvider:
  scheme:
    v1/Secret:
      gvr:
        version: v1
        resource: secrets
      namespaced: true
    v1/ConfigMap:
      gvr:
        version: v1
        resource: configmaps
      namespaced: true
    v1/Namespace:
      gvr:
        version: v1
        resource: namespaces
      namespaced: false
    "apiextensions.k8s.io/v1/CustomResourceDefinition":
      gvr:
        group: "apiextensions.k8s.io"
        version: "v1"
        resource: "customresourcedefinitions"
      namespaced: false
  objects:
    # Makes fn.clusterReachable true.
    - apiVersion: v1
      kind: Namespace
      metadata:
        name: kube-system
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: httproutes.gateway.networking.k8s.io
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: middlewares.traefik.io
    - apiVersion: v1
      kind: Secret
      metadata:
        name: test-azure
        namespace: federatednode
      type: Opaque
      data:
        SP_SECRET: dGVzdA==
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: azurecert-config
        namespace: federatednode
      data:
        EMAIL_CERT: test@test.com
        SP_ID: as1d1as351as
        RG_NAME: rg-test
        SUBSCRIPTION_ID: 123-123-123
        HOSTED_ZONE: uksouth
        TENANT_ID: as13151cv18a1ca651ac
    # The role passwords, as a DBA-run install would have them. No superuser.
    - apiVersion: v1
      kind: Secret
      metadata:
        name: backend-db
        namespace: federatednode
      type: Opaque
      data:
        password: ZGJhLW1hZGU=
    - apiVersion: v1
      kind: Secret
      metadata:
        name: keycloak-db-secret
        namespace: federatednode
      type: Opaque
      data:
        password: ZGJhLW1hZGU=
    - apiVersion: v1
      kind: Secret
      metadata:
        name: dagster-postgresql-secret
        namespace: federatednode
      type: Opaque
      data:
        postgresql-password: ZGJhLW1hZGU=
    - apiVersion: v1
      kind: Secret
      metadata:
        name: github-token
        namespace: federatednode
      type: Opaque
      data:
        GH_TOKEN: dGVzdA==
tests:
  - it: does not ask for a superuser
    template: requirements-check.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: does not take ownership of secrets it did not create
    template: db-secrets.yaml
    asserts:
      # Only the derived keycloak-namespace copy: re-emitting the operator's own
      # Secret would delete and recreate it on every upgrade.
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: keycloak-db-secret
      - equal:
          path: metadata.namespace
          value: identities
      - notExists:
          path: metadata.annotations["helm.sh/hook"]
      - equal:
          path: data.password
          value: ZGJhLW1hZGU=

  # Otherwise Keycloak sits in CreateContainerConfigError with no explanation. This
  # suite seeds every release-namespace secret but none in the keycloak namespace.
  - it: asks for the keycloak-namespace copy when it is not creating Secrets
    template: requirements-check.yaml
    set:
      db:
        createPasswordSecrets: false
    asserts:
      - failedTemplate:
          errorPattern: "secret generic keycloak-db-secret -n identities"
