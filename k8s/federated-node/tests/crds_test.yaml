## The node config kinds (ADR 0032): fn.aridhia.com/v1alpha1, namespaced, in category fn, kept on uninstall.
suite: Node config CRDs
release:
  namespace: federatednode
  name: federatednode
values:
  - values/values-local.yaml
templates:
  - templates/crds/git-provider.yaml
  - templates/crds/node-secret.yaml
  - templates/crds/repository.yaml
  - templates/crds/dataset.yaml
  - templates/crds/project.yaml
tests:
  - it: defines each kind in group fn.aridhia.com, category fn, kept on uninstall
    asserts:
      - isKind:
          of: CustomResourceDefinition
      - equal:
          path: spec.group
          value: fn.aridhia.com
      - equal:
          path: spec.scope
          value: Namespaced
      - contains:
          path: spec.names.categories
          content: fn
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      - equal:
          path: spec.versions[0].name
          value: v1alpha1
      - isNotNull:
          path: spec.versions[0].subresources.status
      - equal:
          path: spec.versions[0].additionalPrinterColumns[0].name
          value: Synced

  - it: names the NodeSecret kind so it does not clash with core Secrets
    template: templates/crds/node-secret.yaml
    asserts:
      - equal:
          path: metadata.name
          value: nodesecrets.fn.aridhia.com
      - equal:
          path: spec.names.kind
          value: NodeSecret
