pullPolicy: Always

local_development: true
create_db_deployment: true

keycloak:
  replicas: 1
db:
  host: db.default.svc
  port: 5432
  secret:
    key: password
    name: local-db

storage:
  local:
    dbpath: /data/db/

integrations:
  domains:
    - http://localhost:8088
    - https://phems-federatednode.net

smoketests: true
taskReview: true

host: phems-federatednode.net
nodeId: test-node
tls:
  secretName: &tls my-tls-secret

cert-manager:
  enabled: true

traefik:
  enabled: true
  gateway:
    listeners:
      websecure:
        certificateRefs:
        - kind: Secret
          name: *tls
