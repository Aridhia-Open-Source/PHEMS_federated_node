suite: gitea actions and runner (dev only)
templates:
  - templates/gitea-deployment.yaml
  - templates/gitea-runner-deployment.yaml
  - templates/gitea-runner-secret.yaml
values:
  - values/values-local.yaml
set:
  gitea:
    enabled: true
    admin:
      user: gitea_admin
      email: admin@example.com
      secret:
        name: gitea-admin
        key: password
tests:
  - it: recreates gitea on upgrade, so two pods never share /data
    template: templates/gitea-deployment.yaml
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate
  - it: leaves actions and the runner off by default
    template: templates/gitea-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GITEA__actions__ENABLED
            value: "false"
  - it: renders no runner by default
    template: templates/gitea-runner-deployment.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: turns actions on in gitea
    template: templates/gitea-deployment.yaml
    set:
      gitea:
        actions:
          enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GITEA__actions__ENABLED
            value: "true"
  - it: runs the runner with a pinned privileged dind sidecar and the registration token secret
    template: templates/gitea-runner-deployment.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      gitea:
        actions:
          enabled: true
          runner:
            enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: gitea/act_runner:0.6.1
      - equal:
          path: spec.template.spec.containers[1].image
          value: docker:29.9.3-dind
      - equal:
          path: spec.template.spec.containers[1].securityContext.privileged
          value: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GITEA_RUNNER_REGISTRATION_TOKEN
            valueFrom:
              secretKeyRef:
                name: gitea-runner-registration
                key: token
  - it: keeps the runner's registration on a PVC across restarts
    template: templates/gitea-runner-deployment.yaml
    set:
      gitea:
        actions:
          enabled: true
          runner:
            enabled: true
    asserts:
      - isKind:
          of: PersistentVolumeClaim
        documentIndex: 0
      - equal:
          path: spec.strategy.type
          value: Recreate
        documentIndex: 1
      - contains:
          path: spec.template.spec.volumes
          content:
            name: runner-data
            persistentVolumeClaim:
              claimName: gitea-runner-data
        documentIndex: 1
  - it: generates the registration token into that secret
    template: templates/gitea-runner-secret.yaml
    set:
      gitea:
        actions:
          enabled: true
          runner:
            enabled: true
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: gitea-runner-registration
      - matchRegex:
          path: data.token
          pattern: "^[A-Za-z0-9+/]{64}$"
  - it: keeps the existing registration token on upgrade
    template: templates/gitea-runner-secret.yaml
    set:
      gitea:
        actions:
          enabled: true
          runner:
            enabled: true
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: gitea-runner-registration
            namespace: NAMESPACE
          data:
            token: ZXhpc3Rpbmc=
    asserts:
      - equal:
          path: data.token
          value: ZXhpc3Rpbmc=
  - it: starts gitea with the same token
    template: templates/gitea-deployment.yaml
    set:
      gitea:
        actions:
          enabled: true
          runner:
            enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GITEA_RUNNER_REGISTRATION_TOKEN
            valueFrom:
              secretKeyRef:
                name: gitea-runner-registration
                key: token
  - it: refuses the runner without local_development
    template: templates/gitea-runner-deployment.yaml
    set:
      local_development: false
      gitea:
        actions:
          enabled: true
          runner:
            enabled: true
    asserts:
      - failedTemplate: {}
