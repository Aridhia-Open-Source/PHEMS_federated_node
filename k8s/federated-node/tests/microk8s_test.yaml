suite: Storage testing for microk8s
release:
  namespace: federatednode
  name: federatednode
values:
  - values/values-local.yaml
kubernetesProvider:
  scheme:
    v1/Secret:
      gvr:
        version: v1
        resource: secrets
      namespaced: true
    v1/ConfigMap:
      gvr:
        version: v1
        resource: configmaps
      namespaced: true
    "apiextensions.k8s.io/v1/CustomResourceDefinition":
      gvr:
        group: "apiextensions.k8s.io"
        version: "v1"
        resource: "customresourcedefinitions"
      namespaced: false
  objects:
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: httproutes.gateway.networking.k8s.io
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: middlewares.traefik.io
    - apiVersion: v1
      kind: Secret
      metadata:
        name: awscert-config
        namespace: federatednode
      type: Opaque
      data:
        EMAIL_CERT: dGVzdA==
        REGION: dGVzdA==
        ACCOUNT_ID: dGVzdA==
        ROLE_NAME: dGVzdA==
    - apiVersion: v1
      kind: Secret
      metadata:
        name: local-db
        namespace: federatednode
      type: Opaque
      data:
        password: dGVzdA==
    - apiVersion: v1
      kind: Secret
      metadata:
        name: github-app
        namespace: federatednode
      type: Opaque
      data:
        GH_SECRET: dGVzdA==
        GH_CLIENT_ID: dGVzdA==
tests:
  - it: creates a local db deployment
    template: db-deployment.yaml
    set:
      create_db_deployment: true
    asserts:
      - hasDocuments:
          count: 1
  - it: creates selfsigned issuer
    template: certificates/issuer.yaml
    asserts:
      - exists:
          path: spec.selfSigned
  - it: creates local persistency
    template: dagster-artifacts-pv.yaml
    set:
      dagster:
        enabled: true
        postgresql:
          postgresqlHost: db.default.svc
      storage:
        local:
          artifacts: /data/dagster/artifacts
    asserts:
      - equal:
          path: spec.local.path
          value: /data/dagster/artifacts
        documentIndex: 1
  - it: creates local storage class
    template: dagster-artifacts-pv.yaml
    set:
      dagster:
        enabled: true
        postgresql:
          postgresqlHost: db.default.svc
    asserts:
      - equal:
          path: provisioner
          value: Local
        documentIndex: 0
  - it: simulate reuse-values args
    template: keycloak-realm-controller.yaml
    asserts:
      - hasDocuments:
          count: 1
  - it: backend configmap has image whitelist enabled
    set:
      federatedNode:
        enable_image_whitelist: true
    template: backend-configmap.yaml
    asserts:
      - equal:
          path: data.ENABLE_IMAGE_WHITELIST
          value: "true"
  - it: backend configmap has image whitelist disabled by default
    template: backend-configmap.yaml
    asserts:
      - equal:
          path: data.ENABLE_IMAGE_WHITELIST
          value: "false"
  # It only deletes a row from the backend's own database, so it needs no superuser.
  - it: smoke tests use the backend role, not the superuser
    template: tests/smoke-tests.yaml
    asserts:
      - equal:
          path: spec.containers[0].env[1].valueFrom.secretKeyRef.name
          value: backend-db
