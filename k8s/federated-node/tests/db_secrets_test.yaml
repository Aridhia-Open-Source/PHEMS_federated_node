suite: Generated database password secrets
release:
  namespace: federatednode
  name: federatednode
templates:
  - db-secrets.yaml
values:
  - values/values-local.yaml
kubernetesProvider:
  scheme:
    v1/Secret:
      gvr:
        version: v1
        resource: secrets
      namespaced: true
  objects: []
tests:
  - it: creates one secret per role, in every namespace that needs it
    asserts:
      # local-db (the superuser), backend-db, and keycloak-db-secret in two namespaces.
      - hasDocuments:
          count: 4
      - equal:
          path: metadata.namespace
          value: federatednode
        documentSelector:
          path: metadata.name
          value: local-db
      # The one document outside the release namespace is keycloak's copy.
      - equal:
          path: metadata.name
          value: keycloak-db-secret
        documentSelector:
          path: metadata.namespace
          value: keycloak

  - it: marks them as chart-generated so teardown can find them
    asserts:
      - equal:
          path: metadata.labels["federatednode.com/generated-password"]
          value: "true"
        documentSelector:
          path: metadata.name
          value: backend-db

  - it: runs before the db-init hooks and cannot be deleted after they succeed
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
        documentSelector:
          path: metadata.name
          value: backend-db
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-3"
        documentSelector:
          path: metadata.name
          value: backend-db
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation
        documentSelector:
          path: metadata.name
          value: backend-db

  # Regression: as a hook this copy gets pruned along with the previous revision's
  # copy-secrets resource of the same name, leaving Keycloak passwordless for a
  # revision. Nothing in a hook reads it, so it is an ordinary resource.
  - it: keeps the keycloak-namespace copy out of the hooks
    asserts:
      - notExists:
          path: metadata.annotations["helm.sh/hook"]
        documentSelector:
          path: metadata.namespace
          value: keycloak
      - exists:
          path: metadata.annotations["helm.sh/hook"]
        documentSelector:
          path: metadata.namespace
          value: federatednode
          matchMany: true

  - it: honours db.passwords, for renders that cannot look the cluster up
    set:
      db:
        passwords:
          backend: pinned
    asserts:
      # base64("pinned")
      - equal:
          path: data.password
          value: cGlubmVk
        documentSelector:
          path: metadata.name
          value: backend-db

  - it: does not generate the superuser password for an external server
    set:
      create_db_deployment: false
    asserts:
      # 4 -> 3: the superuser document is the one that disappears.
      - hasDocuments:
          count: 3
      - matchRegex:
          path: metadata.name
          pattern: ^(backend-db|keycloak-db-secret)$
        documentIndex: 0

  # Something else owns the Secrets (External Secrets, SealedSecrets, Vault): the chart
  # emits none and reads them through secretKeyRef at runtime. This is what ArgoCD
  # should use instead of putting plaintext passwords in a values file.
  - it: creates nothing when the passwords are managed elsewhere
    set:
      db:
        createPasswordSecrets: false
    asserts:
      - hasDocuments:
          count: 0
