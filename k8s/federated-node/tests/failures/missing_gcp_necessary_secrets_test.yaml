suite: Missing GCP secrets failures
release:
  namespace: federatednode
  name: federatednode
values:
  - ../values/values-gke.yaml
kubernetesProvider:
  scheme:
    v1/Secret:
      gvr:
        version: v1
        resource: secrets
      namespaced: true
    v1/ConfigMap:
      gvr:
        version: v1
        resource: configmaps
      namespaced: true
  objects:
    - apiVersion: v1
      kind: Secret
      metadata:
        name: local-db
        namespace: federatednode
      type: Opaque
      data:
        password: dGVzdA==
tests:
  - it: fails without expected GCP certs secret
    template: copy-secrets.yaml
    asserts:
      - failedTemplate:
          errorMessage: Secret gcp-dns-secret not found in namespace federatednode
  - it: fails without expected GCP certs secret when secretName is overridden
    template: copy-secrets.yaml
    set:
      certs:
        gcp:
          secretName: new-gcp-secret
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: local-db
            namespace: federatednode
          type: Opaque
          data:
            password: dGVzdA==
    asserts:
      - failedTemplate:
          errorMessage: Secret new-gcp-secret not found in namespace federatednode
