## First-install behaviour: with no existing secret and no recorded generation, the chart must
## simply generate credentials. This is the case the missing-secret guard must NOT interfere with,
## since .Release.IsUpgrade is false on an install.
##
## Its own suite because a test-level `release` block does not clear a suite-level `upgrade: true`.
suite: Keycloak credentials on first install
release:
  namespace: federatednode
  name: federatednode
  revision: 1
templates:
  - templates/keycloak-secrets.yaml
values:
  - values/values-upgrade.yaml

tests:
  - it: generates all credentials, and records the generation
    documentIndex: 0
    asserts:
      - isKind:
          of: Secret
      - isNotEmpty:
          path: data.KEYCLOAK_SECRET
      - isNotEmpty:
          path: data.KEYCLOAK_ADMIN_PASSWORD
      - isNotEmpty:
          path: data.KEYCLOAK_SERVICE_PASSWORD
      - isNotEmpty:
          path: data.KC_BOOTSTRAP_ADMIN_PASSWORD
      ## Recorded on install so the first upgrade has something to compare against. Without it,
      ## that upgrade would look like a rotation request and cycle every credential.
      - equal:
          path: data.CREDENTIAL_GENERATION
          value: MQ==

  ## Note: that KC_BOOTSTRAP_ADMIN_PASSWORD equals KEYCLOAK_ADMIN_PASSWORD (Keycloak's entrypoint
  ## bootstraps its temporary admin with it, and realm-init logs in as that user) is asserted in
  ## keycloak_credentials_test.yaml, where both are compared against the same seeded value.

  - it: does not emit dagster credentials when dagster is disabled
    asserts:
      - hasDocuments:
          count: 3
