## Credential stability across upgrades.
##
## Every test here must FAIL against the pre-fix chart. The old template called randAlphaNum
## unconditionally, so any assertion that merely checks a key exists would have passed before
## and proves nothing. These assert on the *values*, seeded via kubernetesProvider so that
## Helm's `lookup` returns a pre-existing kc-secrets.
suite: Keycloak credential stability
release:
  namespace: federatednode
  name: federatednode
  revision: 2
  upgrade: true
templates:
  - templates/keycloak-secrets.yaml
values:
  - values/values-upgrade.yaml
kubernetesProvider:
  scheme:
    v1/Secret:
      gvr:
        version: v1
        resource: secrets
      namespaced: true
  objects:
    - apiVersion: v1
      kind: Secret
      metadata:
        name: kc-secrets
        namespace: federatednode
      data:
        KEYCLOAK_SECRET: c2VlZGVkLWNsaWVudC1zZWNyZXQ=
        KEYCLOAK_ADMIN_PASSWORD: c2VlZGVkLWFkbWluLXBhc3M=
        KC_BOOTSTRAP_ADMIN_PASSWORD: c2VlZGVkLWFkbWluLXBhc3M=
        KEYCLOAK_SERVICE_PASSWORD: c2VlZGVkLXNlcnZpY2UtcGFzcw==
        CREDENTIAL_GENERATION: MQ==
    - apiVersion: v1
      kind: Secret
      metadata:
        name: dagster-keycloak-creds
        namespace: keycloak
      data:
        DAGSTER_KC_PASSWORD: c2VlZGVkLWRhZ3N0ZXItcGFzcw==

tests:
  ## The core regression: an upgrade must reuse what is already in the cluster.
  - it: reuses every existing credential on upgrade
    documentIndex: 0
    asserts:
      - equal:
          path: data.KEYCLOAK_SECRET
          value: c2VlZGVkLWNsaWVudC1zZWNyZXQ=
      - equal:
          path: data.KEYCLOAK_ADMIN_PASSWORD
          value: c2VlZGVkLWFkbWluLXBhc3M=
      - equal:
          path: data.KC_BOOTSTRAP_ADMIN_PASSWORD
          value: c2VlZGVkLWFkbWluLXBhc3M=
      - equal:
          path: data.KEYCLOAK_SERVICE_PASSWORD
          value: c2VlZGVkLXNlcnZpY2UtcGFzcw==

  ## outboundMode is true in values-upgrade.yaml, so kc-secrets renders into the release,
  ## keycloak and fn-controller namespaces. All three must carry the same value, or components
  ## in different namespaces disagree about the credential.
  - it: renders the same credential into every namespace copy
    asserts:
      - equal:
          path: data.KEYCLOAK_SECRET
          value: c2VlZGVkLWNsaWVudC1zZWNyZXQ=
        documentIndex: 0
      - equal:
          path: data.KEYCLOAK_SECRET
          value: c2VlZGVkLWNsaWVudC1zZWNyZXQ=
        documentIndex: 1
      - equal:
          path: data.KEYCLOAK_SECRET
          value: c2VlZGVkLWNsaWVudC1zZWNyZXQ=
        documentIndex: 2
      - equal:
          path: metadata.namespace
          value: federatednode
        documentIndex: 0
      - equal:
          path: metadata.namespace
          value: keycloak
        documentIndex: 1
      - equal:
          path: metadata.namespace
          value: fn-controller
        documentIndex: 2

  ## The generation must be recorded, or the next upgrade has nothing to compare against and
  ## rotation can never be detected.
  - it: records the credential generation in every copy
    asserts:
      - equal:
          path: data.CREDENTIAL_GENERATION
          value: MQ==
        documentIndex: 0
      - equal:
          path: data.CREDENTIAL_GENERATION
          value: MQ==
        documentIndex: 1
      - equal:
          path: data.CREDENTIAL_GENERATION
          value: MQ==
        documentIndex: 2

  ## Guards the footgun that a boolean flag would have had: re-rendering with the same
  ## generation must be completely inert.
  - it: is inert when the requested generation matches the recorded one
    set:
      keycloak:
        credentialGeneration: 1
    documentIndex: 0
    asserts:
      - equal:
          path: data.KEYCLOAK_SECRET
          value: c2VlZGVkLWNsaWVudC1zZWNyZXQ=

  - it: rotates every credential when the generation is bumped
    set:
      keycloak:
        credentialGeneration: 2
    documentIndex: 0
    asserts:
      - notEqual:
          path: data.KEYCLOAK_SECRET
          value: c2VlZGVkLWNsaWVudC1zZWNyZXQ=
      - notEqual:
          path: data.KEYCLOAK_ADMIN_PASSWORD
          value: c2VlZGVkLWFkbWluLXBhc3M=
      - notEqual:
          path: data.KEYCLOAK_SERVICE_PASSWORD
          value: c2VlZGVkLXNlcnZpY2UtcGFzcw==
      ## and the new generation is recorded, so the *next* upgrade is inert again
      - equal:
          path: data.CREDENTIAL_GENERATION
          value: Mg==

  - it: keeps the dagster password stable, and rotates it with the generation
    ## dagster.enabled is false in values-upgrade.yaml, so enable it here. Documents 3 and 4
    ## are the two dagster-keycloak-creds copies.
    set:
      dagster:
        enabled: true
    asserts:
      - equal:
          path: data.DAGSTER_KC_PASSWORD
          value: c2VlZGVkLWRhZ3N0ZXItcGFzcw==
        documentIndex: 3

  - it: rotates the dagster password when the generation is bumped
    set:
      dagster:
        enabled: true
      keycloak:
        credentialGeneration: 2
    asserts:
      - notEqual:
          path: data.DAGSTER_KC_PASSWORD
          value: c2VlZGVkLWRhZ3N0ZXItcGFzcw==
        documentIndex: 3
