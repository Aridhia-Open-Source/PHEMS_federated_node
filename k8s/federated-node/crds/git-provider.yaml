# A git provider (GitHub or Gitea). metadata.name is its nexus-api name. A gitea provider also needs apiUri;
# the operator checks that, and that apiUri is on the provider's host.
# Static YAML: Helm installs crds/ before the templates (ADR 0032) but never upgrades them, so on upgrade the
# chart's pre-upgrade hook (templates/crds-upgrade-hook.yaml), Flux (crds: CreateReplace) or scripts/deploy.sh apply them.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gitproviders.fn.aridhia.com
  annotations:
    helm.sh/resource-policy: keep
spec:
  group: fn.aridhia.com
  scope: Namespaced
  names:
    kind: GitProvider
    listKind: GitProviderList
    plural: gitproviders
    singular: gitprovider
    categories:
      - fn
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Synced
          type: boolean
          jsonPath: .status.synced
        - name: Message
          type: string
          jsonPath: .status.message
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required: [type, uri]
              properties:
                type:
                  type: string
                  enum: [gitea, github]
                uri:
                  type: string
                  description: The provider's web address, scheme://host[:port]
                  pattern: '^https?://[^/@\s]+(/\S*)?$'
                apiUri:
                  type: string
                  description: The provider's API base URL. Defaults to https://api.github.com for github
                  pattern: '^https?://[^/@\s]+(/\S*)?$'
            status:
              type: object
              properties:
                synced:
                  type: boolean
                nexusId:
                  type: integer
                message:
                  type: string
                observedGeneration:
                  type: integer
                  format: int64
                sourceVersions:
                  type: object
                  description: NodeSecret only, source Secret name -> its resourceVersion last sent
                  additionalProperties:
                    type: string
