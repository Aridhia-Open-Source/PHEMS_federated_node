# A nexus-api secret, by reference only. metadata.name is its label. The values are read from a Kubernetes
# Secret in the resource's own namespace: every key of fromSecret under the same names, or each key of values from
# its secretKeyRef. Exactly one of the two.
# Static YAML: Helm installs crds/ before the templates (ADR 0032). Upgrades go through Flux
# (upgrade.crds: CreateReplace) or kubectl apply (scripts/deploy.sh); Helm itself never upgrades them.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nodesecrets.fn.aridhia.com
  annotations:
    helm.sh/resource-policy: keep
spec:
  group: fn.aridhia.com
  scope: Namespaced
  names:
    kind: NodeSecret
    listKind: NodeSecretList
    plural: nodesecrets
    singular: nodesecret
    categories:
      - fn
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Synced
          type: boolean
          jsonPath: .status.synced
        - name: Message
          type: string
          jsonPath: .status.message
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              oneOf:
                - required: [fromSecret]
                - required: [values]
              properties:
                fromSecret:
                  type: object
                  required: [name]
                  properties:
                    name:
                      type: string
                      minLength: 1
                values:
                  type: object
                  minProperties: 1
                  additionalProperties:
                    type: object
                    required: [secretKeyRef]
                    properties:
                      secretKeyRef:
                        type: object
                        required: [name, key]
                        properties:
                          name:
                            type: string
                            minLength: 1
                          key:
                            type: string
                            minLength: 1
            status:
              type: object
              properties:
                synced:
                  type: boolean
                nexusId:
                  type: integer
                message:
                  type: string
                observedGeneration:
                  type: integer
                  format: int64
                sourceVersions:
                  type: object
                  description: NodeSecret only, source Secret name -> its resourceVersion last sent
                  additionalProperties:
                    type: string
