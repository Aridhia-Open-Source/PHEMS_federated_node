# A trigger or results repository, keyed in nexus-api by its uri (not metadata.name), and the NodeSecret
# holding its git credentials.
# Static YAML: Helm installs crds/ before the templates (ADR 0032). Upgrades go through Flux
# (upgrade.crds: CreateReplace) or kubectl apply (scripts/deploy.sh); Helm itself never upgrades them.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: repositories.fn.aridhia.com
  annotations:
    helm.sh/resource-policy: keep
spec:
  group: fn.aridhia.com
  scope: Namespaced
  names:
    kind: Repository
    listKind: RepositoryList
    plural: repositories
    singular: repository
    categories:
      - fn
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Synced
          type: boolean
          jsonPath: .status.synced
        - name: Message
          type: string
          jsonPath: .status.message
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required: [type, uri, secret]
              properties:
                type:
                  type: string
                  enum: [trigger, results]
                uri:
                  type: string
                  description: host[:port]/owner/repo, or an http(s) URL of it
                  pattern: '^(https?://)?[^/@\s]+(/[^/\s]+){2,}/?$'
                secret:
                  type: string
                  minLength: 1
                  description: The NodeSecret with the repository's git credentials
            status:
              type: object
              properties:
                synced:
                  type: boolean
                nexusId:
                  type: integer
                message:
                  type: string
                observedGeneration:
                  type: integer
                  format: int64
                sourceVersions:
                  type: object
                  description: NodeSecret only, source Secret name -> its resourceVersion last sent
                  additionalProperties:
                    type: string
