# A trigger or results repository, keyed in nexus-api by its uri (not metadata.name), and the NodeSecret
# holding its git credentials.
# Static YAML: Helm installs crds/ before the templates (ADR 0032) but never upgrades them, so on upgrade the
# chart's pre-upgrade hook (templates/crds-upgrade-hook.yaml), Flux (crds: CreateReplace) or scripts/deploy.sh apply them.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: repositories.fn.aridhia.com
  annotations:
    helm.sh/resource-policy: keep
spec:
  group: fn.aridhia.com
  scope: Namespaced
  names:
    kind: Repository
    listKind: RepositoryList
    plural: repositories
    singular: repository
    categories:
      - fn
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Synced
          type: boolean
          jsonPath: .status.synced
        - name: Message
          type: string
          jsonPath: .status.message
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required: [type, uri, secret]
              properties:
                type:
                  type: string
                  enum: [trigger, results]
                  # nexus-api keys the record by uri and type: an edit would create a new record and orphan the old
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: type cannot be changed; delete the Repository and create another
                uri:
                  type: string
                  description: host[:port]/owner/repo, or an http(s) URL of it
                  pattern: '^(https?://)?[^/@\s]+(/[^/\s]+){2,}/?$'
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: uri cannot be changed; delete the Repository and create another
                secret:
                  type: string
                  minLength: 1
                  description: The NodeSecret with the repository's git credentials
                access:
                  type: array
                  description: >-
                    Keycloak groups and what each may do with the record (ADR 0037). The operator adds a group grant
                    for each entry and removes the ones it added when they leave the list; other grants stay.
                  items:
                    type: object
                    required: [group, relation]
                    properties:
                      group:
                        type: string
                        pattern: '^/'
                        description: The group's full Keycloak path, e.g. /studies/uc1
                      relation:
                        type: string
                        enum: [read, assign, execute, operate, write]
            status:
              type: object
              properties:
                synced:
                  type: boolean
                nexusId:
                  type: integer
                message:
                  type: string
                observedGeneration:
                  type: integer
                  format: int64
                access:
                  type: array
                  description: The access entries the operator last applied, so it removes only its own grants
                  items:
                    type: object
                    properties:
                      group:
                        type: string
                      relation:
                        type: string
                sourceVersions:
                  type: object
                  description: NodeSecret only, source Secret name -> its resourceVersion last sent
                  additionalProperties:
                    type: string
