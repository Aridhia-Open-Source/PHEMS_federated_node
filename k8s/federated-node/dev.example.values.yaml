# Example values for LOCAL DEVELOPMENT with scripts/deploy.sh (kind cluster).
# Copy this file to dev.values.yaml (gitignored) and personalize it, then set
# VALUES_FILE=dev.values.yaml in your .dev.env.
# Unlike example.values.yaml, this uses the locally built images from
# scripts/build_all_images.sh instead of the published ghcr.io ones.

pullPolicy: Always
create_db_deployment: true
local_development: true
smoketests: false
taskReview: true
cleanupTime: 3
host: &host phems-federatednode.net
copySecrets: false
default_image_tag: 1.9.0
dagsterHome: /opt/dagster/home

backend:
  image: localhost:5001/webserver-fn
  tag: "v1"
  volumes:
    results_path: /data/flask/results

alpine:
  image: localhost:5001/alpine-fn
  tag: "v1"

keycloak:
  tag: 1.9.0
  initializer:
    image: localhost:5001/kc-init-fn
    tag: "v1"

db:
  user: &userDB admin
  host: db.fn.svc
  port: &portDB 5432
  secret:
    name: backend-db
    key: password
    value: local-db-secret

storage:
  capacity: 1Gi
  local:
    path: /data/flask
    dbpath: /data/db
    artifacts: /data/dagster/artifacts

global:
  host: *host
  delivery_url: federated-node.example.net
  postgresqlSecretName: dagster-postgresql-secret

certs:
  frequency: 65

integrations:
  domains:
    - http://localhost:8088
    - https://phems-federatednode.net

github:
  token: ""

whitelist:
  enabled: false
blacklist:
  enabled: false
tls:
  secretName: &tls my-tls-secret

cert-manager:
  enabled: false

ingress-nginx:
  enabled: false
  controller:
    extraArgs:
      default-ssl-certificate: qcfederatednode/my-tls-secret

outboundMode: true

## Sub Charts

### Gateway API
gatewayApi:
  installCRD: false

### Traefik
traefik:
  providers:
    kubernetesIngress:
      enabled: false
  enabled: false

### FN Task Controller
fn-task-controller:
  controller:
    tag:
  storage:
    size: 100Mi
    local:
      path: /data/controller

  idp:
    github: null

  delivery:
    # github:
    #   repository: Aridhia-Open-Source/Federated-Node-Example-App
    other:
      url: federated-node.uksouth.analytixagility.aridhiadev.net
      auth_type: AzCopy

### Dagster Internal Config
fnDagster:
  artifactMountPath: /mnt/dagster/artifacts
  artifactsPvcName: artifacts-pvc
  createDB: true
  gh:
    delivery_repo: https://github.com/Aridhia-Open-Source/phems-sandbox
    resultsDir: "mgmt/results"
  db:
    host: db.fn.svc
    user: admin
    name: dagster


### Dagster
dagster:
  enabled: true

  # The dagster-postgresql-secret is pre-created by scripts/deploy.sh so the
  # dagster-db-init pre-install hook can use it. Helm must not try to own it.
  generatePostgresqlPasswordSecret: false

  # DAGSTER_HOME must match the one baked into the dagster image and published in
  # dagster-env-config, otherwise the daemon/webserver disagree with the user-code server.
  global:
    dagsterHome: /opt/dagster/home

  # Share the Federated Node database server instead of a bundled postgres.
  postgresql:
    enabled: false
    postgresqlHost: db.fn.svc
    postgresqlUsername: admin
    postgresqlDatabase: dagster

  runLauncher:
    type: K8sRunLauncher
    config:
      k8sRunLauncher:
        imagePullPolicy: "Always"
        image:
          repository: localhost:5001/dagster-fn
          tag: "v1"
          pullPolicy: Always

        envConfigMaps:
          - name: dagster-env-config

        envSecrets:
          - name: github-token
          # DAGSTER_KC_USER / DAGSTER_KC_PASSWORD - required by app.config.BackendConfig
          - name: dagster-keycloak-creds

        volumes:
          - name: artifacts-pvc
            persistentVolumeClaim:
              claimName: artifacts-pvc
        volumeMounts:
          - name: artifacts-pvc
            mountPath: /mnt/dagster/artifacts

  dagster-user-deployments:
    enabled: true
    enableSubchart: true
    imagePullSecrets: []

    deployments:
      - name: dagster-fn
        port: 3030
        image:
          repository: localhost:5001/dagster-fn
          tag: v1
          pullPolicy: Always

        envConfigMaps:
          - name: dagster-env-config

        envSecrets:
          - name: github-token
          # DAGSTER_KC_USER / DAGSTER_KC_PASSWORD - required by app.config.BackendConfig
          - name: dagster-keycloak-creds

        dagsterApiGrpcArgs:
          - "-m"
          - "app.definitions"
