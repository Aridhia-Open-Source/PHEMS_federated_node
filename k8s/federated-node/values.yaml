### Dagster Internal Config
fnDagster:
  artifactMountPath: /mnt/dagster/artifacts
  artifactsPvcName: artifacts-pvc
  createDB: false
  # Permissions on the artifacts volume, which analytical (pipes) pods write results to.
  # Kept separate from storage.mountOptions, which the backend also consumes for its
  # per-task PVs - see the dagsterArtifactsMountOptions helper.
  artifacts:
    # Azure Files only. 0777 keeps the volume writable by an analytical image running
    # as any uid, and keeps the root run pod able to read what a non-root pod wrote.
    fileMode: "0777"
    dirMode: "0777"
    # Escape hatch: if set, replaces ALL computed mount options for this volume.
    mountOptions: []
    # Pod-level securityContext for pipes task pods. All optional, and none of it is
    # needed for a non-root analytical image to write its results: the run pod already
    # creates <artifactMountPath>/<run_id> mode 0777 before the task pod starts.
    # These are for pinning pod identity, or for reading files the run pod left with
    # restrictive modes. Note fsGroup is a no-op on Azure Files (fsGroupPolicy
    # ReadWriteOnceWithFSType on a RWX volume), on EFS and on NFS - it only does
    # anything on storage.local.
    # Leave runAsUser unset unless you know the analytical image's uid: setting it
    # overrides the image's own USER.
    securityContext: {}
      # fsGroup: 1001
      # runAsUser: 1001
      # runAsGroup: 1001
      # supplementalGroups: [1001]
  gh: {}
    # delivery_repo: owner/repo
    # resultsDir: "mgmt/results"
  db:
    name: dagster
    user: dagster_admin
    # host: your-db-host
    secret:
      name: dagster-postgresql-secret
      key: postgresql-password

### Dagster Subchart Config
dagster:
  enabled: false

  generatePostgresqlPasswordSecret: false

  # DAGSTER_HOME must agree with the one baked into the dagster image and published
  # in the dagster-env-config ConfigMap, otherwise the daemon/webserver look for the
  # instance config in a different directory to the user-code server.
  global:
    dagsterHome: /opt/dagster/home

  postgresql:
    enabled: false
    # Must be set when postgresql.enabled is false, otherwise the generated instance
    # config gets an empty hostname. Use the in-cluster service (db.<namespace>.svc)
    # or an external server (e.g. Azure Database for PostgreSQL).
    # postgresqlHost: db.fn.svc
    # postgresqlDatabase: dagster
    # postgresqlUsername: admin
    # Azure Database for PostgreSQL requires TLS. The parent chart's db.enforceSSL
    # only covers the backend, so set this explicitly for Dagster:
    # postgresqlParams:
    #   sslmode: require
  #   service:
  #     port: 5432
  #   persistence:
  #     enabled: true
  #     storageClass: standard

  runLauncher:
    type: K8sRunLauncher
    config:
      k8sRunLauncher:
        # Change with caution! If you're using a fixed tag for pipeline run images, changing the
        # image pull policy to anything other than "Always" will use a cached/stale image, which is
        # almost certainly not what you want.
        imagePullPolicy: "Always"
        # The run launcher can be deployed with a fixed image (no user code included)
        image:
          repository: ghcr.io/aridhia-open-source/dagster_fn
          tag: "1.9.0"
          pullPolicy: "Always"

        envConfigMaps:
          - name: dagster-env-config

        envSecrets:
          - name: github-token
          - name: dagster-keycloak-creds

        # Add volumes and volume mounts for artifacts-pvc
        volumes:
          - name: artifacts-pvc
            persistentVolumeClaim:
              claimName: artifacts-pvc
        volumeMounts:
          - name: artifacts-pvc
            mountPath: /mnt/dagster/artifacts

  dagsterDaemon:
    extraPrependedInitContainers:
      - name: wait-for-db
        image: ghcr.io/aridhia-open-source/alpine:1.9.0
        imagePullPolicy: Always
        command:
          - sh
          - -c
          - |
            until pg_isready -h $DAGSTER_PG_HOST -p 5432; do
              echo "waiting for postgres..."
              sleep 2
            done
        env:
          - name: DAGSTER_PG_HOST
            valueFrom:
              configMapKeyRef:
                name: dagster-env-config
                key: DAGSTER_PG_HOST

  dagsterWebserver:
    extraPrependedInitContainers:
      - name: wait-for-db
        image: ghcr.io/aridhia-open-source/alpine:1.9.0
        imagePullPolicy: Always
        command:
          - sh
          - -c
          - |
            until pg_isready -h $DAGSTER_PG_HOST -p 5432; do
              echo "waiting for postgres..."
              sleep 2
            done
        env:
          - name: DAGSTER_PG_HOST
            valueFrom:
              configMapKeyRef:
                name: dagster-env-config
                key: DAGSTER_PG_HOST

  dagster-user-deployments:
    # Creates a workspace file with the gRPC servers hosting your user code.
    enabled: true
    # If you plan on deploying user code in a separate Helm release, set this to false.
    enableSubchart: true

    # Specify secrets to run user code server containers based on images in private registries. See:
    # https://kubernetes.io/docs/concepts/containers/images/#referring-to-an-imagepullsecrets-on-a-pod
    imagePullSecrets: []

    # List of unique deployments
    deployments:
      - name: "dagster-fn"
        port: 3030
        image:
          repository: ghcr.io/aridhia-open-source/dagster_fn
          tag: "1.9.0"

          # Change with caution! If you're using a fixed tag for pipeline run images, changing the
          # image pull policy to anything other than "Always" will use a cached/stale image, which is
          # almost certainly not what you want.
          pullPolicy: "Always"

        envConfigMaps:
          - name: dagster-env-config

        envSecrets:
          - name: github-token
          - name: dagster-keycloak-creds

        # Arguments to `dagster api grpc`.
        # Ex: "dagster api grpc -m dagster_test.test_project.test_jobs.repo -a define_demo_execution_repo"
        # would translate to:
        dagsterApiGrpcArgs:
          - "-m"
          - "app.definitions"

        initContainers:
          - name: wait-for-db
            image: ghcr.io/aridhia-open-source/alpine:1.9.0
            imagePullPolicy: Always
            command:
              - sh
              - -c
              - |
                until pg_isready -h $DAGSTER_PG_HOST -p 5432; do
                  echo "waiting for postgres..."
                  sleep 2
                done
            env:
              - name: DAGSTER_PG_HOST
                valueFrom:
                  configMapKeyRef:
                    name: dagster-env-config
                    key: DAGSTER_PG_HOST
