  gateway:
    enabled: false
    name: traefik-fn-gateway
  gatewayClass:
    name: traefik-fn-gateway-class
  providers:
    kubernetesCRD:
      enabled: true
    kubernetesGateway:
      enabled: true
    kubernetesIngress:
      enabled: false
  enabled: false
  api:
    dashboard: false
