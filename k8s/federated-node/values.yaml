# Default values for federated-node.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

default_image_tag: 1.9.0
dagsterHome: /opt/dagster/home

backend:
  image: ghcr.io/aridhia-open-source/federated_node_run
  replicas: 1
  # In-cluster URL Dagster uses to reach the backend API. Leave empty to derive it
  # from the release namespace (http://backend.<namespace>.svc:<federatedNode.port>).
  uri:
  tag:
  db:
    name: backend
    user: backend_admin
    secret:
      name: backend-db
      key: password

keycloak:
  replicas: 1
  tag:
  db:
    name: keycloak_db
    user: keycloak_admin
    secret:
      name: keycloak-db-secret
      key: password

alpine:
  image: ghcr.io/aridhia-open-source/alpine
  tag: 1.9.0

autoscaling:
  enabled: false

namespaces: &namespaces
  keycloak: keycloak
  tasks: tasks
  controller: fn-controller

global:
  namespaces: *namespaces

token:
  life: 2592000

# Local Development-related options
local_development: false
create_db_deployment: false
copySecrets: true

db:
  enforceSSL: false
  port: 5432
  # Superuser/admin login the *-db-init jobs connect as. Azure Database for PostgreSQL
  # Flexible Server has no role called "postgres" - use the admin user chosen at
  # server creation time instead.
  superuser: postgres
  secret:
    name: postgres-superuser
    key: password

datasetDb:
  create: false
  port: 5432
  superuser: postgres
  secret:
    name: db-datasets-superuser
    key: password
  dbs: {}
    # uc1:
    #   name: uc1_omop
    #   user: uc1_omop_user
    #   secret:
    #     name: db-datasets-uc1
    #     key: password
    # uc2:
    #   name: uc2_omop
    #   user: uc2_omop_user
    #   secret:
    #     name: db-datasets-uc2
    #     key: password

# How many days the resultks and k8s resources are kept for
cleanupTime: 3

taskReview: false

# firstUserSecret:
  # name:
  # passKey:
  # firstName:
  # lastName:
  # email:

federatedNode:
  allow_delivery_api: false
  enable_image_whitelist: false
  port: 5000
  volumes:
    results_path: /mnt/results
    task_pod_results_path: /mnt/data

storage:
  capacity: 10Gi
  mountOptions: []
  # azure:
    # secretName:
    # shareName:
    # provisioner:
  # aws:
    # fileSystemId:
    # accessPointId:
  # nfs:
    # provisioner:
    # url:
    # path:
  # local: {}
    # Local storage that will be shared with the backend
    # path: /data/results
    # Local storage that will be shared with the db
    # dbpath: /data/db


pullPolicy: Always

# If using a reverse proxy, or ssl certificates, this will set the hostname
host: &host
tls:
  secretName: &tls tls

# Running on azure?
on_aks: false
# Running on AWS?
on_eks: false

# Set the domains that are allowed to send requests
# to the federated node, in case there is a web UI that tries to
# ping the FN
integrations:
  domains:
    - self

certs:
  rotationPolicy: Never
  azure:
    # secretName:
    # configmap:
  aws: ""

# Enables full smoketests when running `helm test`.
# This will actively try to add new database and keycloak entries
# and then remove them as part of the cleanup process. Basic tests will be carried anyway.
# If not comfortable with these smoketests, do no overwrite this value.
smoketests: false

outboundMode: false

