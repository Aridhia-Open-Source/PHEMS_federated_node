# Default values for federated-node.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Tag for every image this chart publishes. Unset tracks the chart's appVersion,
# which is how the images are tagged when built. Set it only to pin an older build.
# default_image_tag:
dagsterHome: /opt/dagster/home

backend:
  image: ghcr.io/aridhia-open-source/federated_node_run
  replicas: 1
  # In-cluster URL Dagster uses to reach the backend API. Leave empty to derive it
  # from the release namespace (http://backend.<namespace>.svc:<federatedNode.port>).
  uri:
  tag:
  db:
    name: backend
    user: backend_admin
    secret:
      name: backend-db
      key: password

keycloak:
  image: ghcr.io/aridhia-open-source/federated_keycloak
  replicas: 1
  tag:
  db:
    name: keycloak_db
    user: keycloak_admin
    secret:
      name: keycloak-db-secret
      key: password
  # Bump this integer to deliberately rotate the platform-managed Keycloak credentials
  # Credentials are otherwise stable across upgrades. Safe to leave committed: rotation happens
  # only when this value differs from the one recorded in the kc-secrets Secret.
  credentialGeneration: 1
  # Escape hatch. Normally an upgrade with no existing kc-secrets is an error, because it means
  # `lookup` is unavailable and credentials would be silently regenerated on every sync. Set this
  # true for a single upgrade if you deleted the secret on purpose.
  recreateMissingSecrets: false
  # Set false to hand realm management entirely to the operator. keycloak-realm-init still manages
  # credentials, but applies neither the realms.json partial import nor any realm migration.
  manageRealm: true

  # Seconds a service-account token may be reused by the backend. Without this, every Keycloak()
  # instantiation performs a fresh password grant, so a brief authentication blip during a rotation
  # becomes a total outage instead of a few retried calls. 0 disables caching.
  tokenCacheSeconds: 30

  # Automatic rotation of the platform-managed credentials.
  credentialRotation:
    enabled: false
    # Cron cannot express "every 30 days"; monthly on the 1st is the closest sensible equivalent.
    schedule: "0 3 1 * *"
    rotate:
      # The only one with a true grace period: Keycloak keeps the previous secret valid for
      # rotatedExpirationPeriod, so this is genuinely zero-downtime.
      clientSecret: true
      # No dual-password support in Keycloak, so these have a brief cutover that consumers ride out
      # by retrying. Set false to limit rotation to the client secret alone.
      servicePassword: true
      dagsterPassword: true

alpine:
  image: ghcr.io/aridhia-open-source/alpine
  tag:

autoscaling:
  enabled: false

# Set these under `global` so the task-controller subchart sees the same values -
# it reads global.namespaces too, and a top-level copy would only reach this chart.
global:
  namespaces:
    keycloak: keycloak
    tasks: tasks
    controller: fn-controller

token:
  # 8 hours. Was 2592000 (30 days), the same order as the rotation period -- which meant sessions
  # could outlive a rotation and keep depending on refresh flows that present the client secret.
  # A shorter lifetime also bounds how long a leaked KEYCLOAK_SECRET remains useful.
  life: 28800

# Local Development-related options
local_development: false
create_db_deployment: false

db:
  enforceSSL: false
  port: 5432
  # Create and maintain each component's database, role and grants with the *-db-init
  # hooks. Set false when a DBA has already created them and you have no admin login:
  # the chart then needs no superuser, generates no passwords, and each role password
  # becomes a secret you supply. A db-check hook verifies them before install.
  manageRolesAndDatabases: true
  # Admin login the *-db-init jobs connect as. Azure Flexible Server has no role
  # called "postgres". Unused when manageRolesAndDatabases is false.
  superuser: postgres
  # Generated when create_db_deployment is true; yours when Postgres is external;
  # unused when manageRolesAndDatabases is false.
  secret:
    name: postgres-superuser
    key: password
  # Create the per-role password Secrets. Set false when something else owns them -
  # External Secrets, SealedSecrets, Vault, or a one-off kubectl - and the chart will
  # expect them to exist instead. It never needs their value at render time: db-init
  # reads them through secretKeyRef at runtime.
  #
  # This is also the answer for ArgoCD and `helm diff`, which render without cluster
  # access: the chart cannot reuse an existing password there, so left to generate one
  # it would emit a new Secret on every sync.
  createPasswordSecrets: true
  # Fixed passwords instead of generated ones. For tests and throwaway clusters via
  # --set; do not put real passwords in a values file, since they end up in git, in
  # `helm get values` and in the release Secret. Use createPasswordSecrets: false and
  # a secret manager instead.
  passwords: {}
    # superuser:
    # backend:
    # keycloak:
    # dagster:
    # datasets:
    #   superuser:
    #   uc1:

# A second, in-cluster Postgres holding dataset data - a development fixture. Real
# datasets are registered through the /datasets API. `create` covers deploying the
# server and creating the roles in `dbs`, so `dbs` without it is rejected.
datasetDb:
  create: false
  # Defaults to the in-cluster Service created alongside it.
  host: db-datasets
  port: 5432
  superuser: postgres
  secret:
    name: db-datasets-superuser
    key: password
  dbs: {}
    # uc1:
    #   name: uc1_omop
    #   user: uc1_omop_user
    #   secret:
    #     name: db-datasets-uc1
    #     key: password
    # uc2:
    #   name: uc2_omop
    #   user: uc2_omop_user
    #   secret:
    #     name: db-datasets-uc2
    #     key: password

# How many days the resultks and k8s resources are kept for
cleanupTime: 3

taskReview: false

# firstUserSecret:
  # name:
  # passKey:
  # firstName:
  # lastName:
  # email:

federatedNode:
  allow_delivery_api: false
  enable_image_whitelist: false
  port: 5000
  volumes:
    results_path: /mnt/results
    task_pod_results_path: /mnt/data

storage:
  capacity: 10Gi
  mountOptions: []
  # azure:
    # secretName:
    # shareName:
    # provisioner:
  # aws:
    # fileSystemId:
    # accessPointId:
  # nfs:
    # provisioner:
    # url:
    # path:
  # local: {}
    # Local storage that will be shared with the backend
    # path: /data/results
    # Local storage that will be shared with the db
    # dbpath: /data/db


pullPolicy: Always

# If using a reverse proxy, or ssl certificates, this will set the hostname
host: &host
tls:
  secretName: &tls tls

# Running on azure?
on_aks: false
# Running on AWS?
on_eks: false

# Set the domains that are allowed to send requests
# to the federated node, in case there is a web UI that tries to
# ping the FN
integrations:
  domains:
    - self

certs:
  rotationPolicy: Never
  azure:
    # secretName:
    # configmap:
  aws: ""

# Enables full smoketests when running `helm test`.
# This will actively try to add new database and keycloak entries
# and then remove them as part of the cleanup process. Basic tests will be carried anyway.
# If not comfortable with these smoketests, do no overwrite this value.
smoketests: false

outboundMode: false

##SUBCHARTS
### Task controller
fn-task-controller:
  controller: {}
    # tag:

  storage: {}
    # size:
    # local:
    #   path:

  # Null, not {}: the subchart ships idp.github as a map of nulls whose schema then
  # requires all four keys, so leaving it alone fails validation. Set the whole map
  # (secret_name, secret_key, clientid_key, orgAndRepo) to use a GitHub App as the
  # task IdP. Helm's "cannot overwrite table with non table" warning here is cosmetic.
  idp:
    github: null
  delivery:
    github: {}
      # repository:
    other: {}
      # url
      # auth_type

### Cert manager
cert-manager:
  enabled: false
  namespace: fn-certmanager
  installCRDs: true

### Ingress
traefik:
  gateway:
    enabled: false
    name: traefik-fn-gateway
  gatewayClass:
    name: traefik-fn-gateway-class
  providers:
    kubernetesCRD:
      enabled: true
    kubernetesGateway:
      enabled: true
    kubernetesIngress:
      enabled: false
  enabled: false
  api:
    dashboard: false
  # service:
  #   spec:
  ## in case you want to preserve the previous external ips
  #     externalIPs:
  #       -
  ## For AKS only
  #     externalTrafficPolicy: Local

### Dagster Internal Config
fnDagster:
  image: ghcr.io/aridhia-open-source/dagster_fn
  tag:
  artifactMountPath: /mnt/dagster/artifacts
  artifactsPvcName: artifacts-pvc
  createDB: false
  # The code location (gRPC) server, owned by this chart rather than the
  # dagster-user-deployments subchart. `name` is the gRPC host in the workspace file.
  codeServer:
    name: dagster-fn
    port: 3030
    replicas: 1
    module: app.definitions
    # resources: {}
  # Permissions on the artifacts volume that analytical (pipes) pods write results to.
  # Separate from storage.mountOptions, which the backend's per-task PVs also use -
  # see the dagsterArtifactsMountOptions helper.
  artifacts:
    # Azure Files only. 0777 keeps the volume writable by an image running as any uid.
    fileMode: "0777"
    dirMode: "0777"
    # If set, replaces ALL computed mount options for this volume.
    mountOptions: []
    # Optional pod securityContext for pipes task pods. Not needed for a non-root
    # image to write its results - the run pod pre-creates <mount>/<run_id> 0777 -
    # only for pinning pod identity. fsGroup does nothing except on storage.local,
    # and runAsUser overrides the image's own USER.
    securityContext: {}
      # fsGroup: 1001
      # runAsUser: 1001
      # runAsGroup: 1001
      # supplementalGroups: [1001]
  gh: {}
    # delivery_repo: owner/repo
    # resultsDir: "mgmt/results"
  # No db block here: Dagster's database name and user come from
  # dagster.postgresql.*, its host from db.host, and its password secret from
  # global.postgresqlSecretName. See templates/_db.tpl.

### Dagster Subchart Config
dagster:
  enabled: false

  # NB: there used to be a second, earlier `dagster:` block here holding `systemUser`. YAML
  # last-key-wins silently discarded it, so `dagster.systemUser.password` could never be read.
  # Merged into this block, and now actually honoured by keycloak-secrets.yaml.
  systemUser:
    # Leave blank for an auto-generated password (recommended). Set it to pin a specific one,
    # in which case it is used verbatim and credential rotation does not apply to it.
    password:

  # Namespace the dagster-keycloak-creds secret is copied into, for the Dagster deployment to
  # consume. Defaults to the release namespace.
  # namespace:

  generatePostgresqlPasswordSecret: false

  # DAGSTER_HOME must agree with the one baked into the dagster image and published
  # in the dagster-env-config ConfigMap, otherwise the daemon/webserver look for the
  # instance config in a different directory to the user-code server.
  global:
    dagsterHome: /opt/dagster/home

  # The single source of truth for Dagster's database: the subchart reads these keys
  # itself, and this chart reads them back.
  postgresql:
    enabled: false
    # Must equal db.host, and has to be written twice because Helm cannot template a
    # subchart value. The chart fails at render time if they disagree. Use an anchor:
    #   db: {host: &dbHost db.fn.svc}
    #   dagster: {postgresql: {postgresqlHost: *dbHost}}
    # postgresqlHost:
    postgresqlDatabase: dagster
    postgresqlUsername: dagster_admin
    # Azure requires TLS, and db.enforceSSL only covers the backend. The chart
    # insists on this when db.enforceSSL is set:
    # postgresqlParams:
    #   sslmode: require
    # service:
    #   port: 5432

  runLauncher:
    type: K8sRunLauncher
    config:
      k8sRunLauncher:
        # Change with caution! If you're using a fixed tag for pipeline run images, changing the
        # image pull policy to anything other than "Always" will use a cached/stale image, which is
        # almost certainly not what you want.
        imagePullPolicy: "Always"
        # No `image` on purpose: without it Dagster uses the code location's image,
        # published as DAGSTER_CURRENT_IMAGE from fnDagster.image/tag, so no tag has
        # to be hand-written into a subchart value.

        envConfigMaps:
          - name: dagster-env-config

        envSecrets:
          - name: github-token
          - name: dagster-keycloak-creds

        # Add volumes and volume mounts for artifacts-pvc
        volumes:
          - name: artifacts-pvc
            persistentVolumeClaim:
              claimName: artifacts-pvc
        volumeMounts:
          - name: artifacts-pvc
            mountPath: /mnt/dagster/artifacts

  # No wait-for-db init containers: the subchart's own checkDbReadyInitContainer
  # already runs pg_isready for the daemon and webserver, and the db-init hooks
  # create the databases before any of this starts.

  dagsterWebserver:
    # The code location list comes from a ConfigMap this chart writes
    # (templates/dagster-code-server.yaml). `servers` is required by the subchart's
    # schema even when externalConfigmap is set.
    workspace:
      enabled: true
      servers: []
      externalConfigmap: dagster-workspace

  dagster-user-deployments:
    # Keep the workspace file, but not the subchart's Deployment/Service/SA/RBAC -
    # this chart provides the code server. `deployments` is not read in this mode.
    enabled: true
    enableSubchart: false
