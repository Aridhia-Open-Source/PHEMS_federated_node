# Default values for federated-node.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.


backend:
  replicas: 1
  tag:

keycloak:
  image: ghcr.io/aridhia-open-source/federated_keycloak
  replicas: 1
  tag:
  # Bump this integer to deliberately rotate the platform-managed Keycloak credentials
  # Credentials are otherwise stable across upgrades. Safe to leave committed: rotation happens
  # only when this value differs from the one recorded in the kc-secrets Secret.
  credentialGeneration: 1
  # Escape hatch. Normally an upgrade with no existing kc-secrets is an error, because it means
  # `lookup` is unavailable and credentials would be silently regenerated on every sync. Set this
  # true for a single upgrade if you deleted the secret on purpose.
  recreateMissingSecrets: false
  # Set false to hand realm management entirely to the operator. keycloak-realm-init still manages
  # credentials, but applies neither the realms.json partial import nor any realm migration.
  manageRealm: true

  # Seconds a service-account token may be reused by the backend. Without this, every Keycloak()
  # instantiation performs a fresh password grant, so a brief authentication blip during a rotation
  # becomes a total outage instead of a few retried calls. 0 disables caching.
  tokenCacheSeconds: 30

  # Automatic rotation of the platform-managed credentials.
  credentialRotation:
    enabled: false
    # Cron cannot express "every 30 days"; monthly on the 1st is the closest sensible equivalent.
    schedule: "0 3 1 * *"
    rotate:
      # The only one with a true grace period: Keycloak keeps the previous secret valid for
      # rotatedExpirationPeriod, so this is genuinely zero-downtime.
      clientSecret: true
      # No dual-password support in Keycloak, so this has a brief cutover that consumers ride out
      # by retrying. Set false to limit rotation to the client secret alone.
      servicePassword: true

# Database liveness check. A task init container retries the database connection
# with backoff before the task starts, Defaults cover about a 5 minute resume window
taskDbLiveness:
  enabled: true
  retries: 5
  backoff: 30
  timeout: 30

autoscaling:
  enabled: false

namespaces: &namespaces
  keycloak: keycloak
  tasks: tasks
  controller: fn-controller

global:
  namespaces: *namespaces

token:
  # 8 hours. Was 2592000 (30 days), the same order as the rotation period -- which meant sessions
  # could outlive a rotation and keep depending on refresh flows that present the client secret.
  # A shorter lifetime also bounds how long a leaked KEYCLOAK_SECRET remains useful.
  life: 28800

# Local Development-related options
local_development: false
create_db_deployment: false

db:
  enforceSSL: false
  name: fndb
  port: 5432
  # If a secret with password exists, use that
  # secret:
  #   name:
  #   key:

# How many days the results and k8s resources are kept for
cleanupTime: 3

taskReview: false

# firstUserSecret:
  # name:
  # passKey:
  # firstName:
  # lastName:
  # email:

federatedNode:
  allow_delivery_api: false
  enable_image_whitelist: false
  port: 5000
  volumes:
    results_path: /mnt/results
    task_pod_results_path: /mnt/data

storage:
  capacity: 10Gi
  mountOptions: []
  # azure:
    # secretName:
    # shareName:
    # provisioner:
  # aws:
    # fileSystemId:
    # accessPointId:
  # gcp:
    # bucketName: ""  # GCS bucket name to mount via GCS FUSE
  # nfs:
    # provisioner:
    # url:
    # path:
  # local: {}
    # Local storage that will be shared with the backend
    # path: /data/results
    # Local storage that will be shared with the db
    # dbpath: /data/db

# Read only volumes holding file based datasets. Each one gets a PV and a
# ReadOnlyMany PVC named after it in the tasks namespace, to use as the
# dataset's volume_claim. Set exactly one backend per entry.
datasetVolumes: []
  # - name: clinic-files
  #   capacity: 10Gi
  #   mountOptions: []
  #   local:
  #     path: /data/datasets
  #   azure:
  #     shareName: datasets
  #     secretName: azure-storage-secret
  #     secretNamespace: tasks
  #   aws:
  #     fileSystemId: fs-xxxxxxxx
  #     accessPointId: fsap-xxxxxxxx
  #   gcp:
  #     bucketName: my-datasets-bucket
  #   nfs:
  #     url: nfs.example.com
  #     path: /exports/datasets

pullPolicy: Always

# If using a reverse proxy, or ssl certificates, this will set the hostname
host: &host
tls:
  secretName: &tls tls

# Running on azure?
on_aks: false
# Running on AWS?
on_eks: false
# Running on GCP?
on_gke: false

# Set the domains that are allowed to send requests
# to the federated node, in case there is a web UI that tries to
# ping the FN
integrations:
  domains:
    - self

certs:
  rotationPolicy: Never
  azure:
    # secretName:
    # configmap:
  aws: ""
  gcp:
    email: ""    # Email for Let's Encrypt registration
    project: ""  # GCP project ID

# Enables full smoketests when running `helm test`.
# This will actively try to add new database and keycloak entries
# and then remove them as part of the cleanup process. Basic tests will be carried anyway.
# If not comfortable with these smoketests, do no overwrite this value.
smoketests: false

outboundMode: false

