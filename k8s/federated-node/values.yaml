# Default values for federated-node.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

default_image_tag: 1.9.0
dagsterHome: /opt/dagster/home

backend:
  image: ghcr.io/aridhia-open-source/federated_node_run
  replicas: 1
  uri: http://backend.fn.svc:5000
  tag:
  db:
    name: backend
    user: backend_admin
    secret:
      name: backend-db
      key: password

keycloak:
  replicas: 1
  tag:
  db:
    name: keycloak_db
    user: keycloak_admin
    secret:
      name: keycloak-db-secret
      key: password

alpine:
  image: ghcr.io/aridhia-open-source/alpine
  tag: 1.9.0

autoscaling:
  enabled: false

namespaces: &namespaces
  keycloak: keycloak
  tasks: tasks
  controller: fn-controller

global:
  namespaces: *namespaces

token:
  life: 2592000

# Local Development-related options
local_development: false
create_db_deployment: false
copySecrets: true

db:
  enforceSSL: false
  port: 5432
  secret:
    name: postgres-superuser
    key: password

# How many days the resultks and k8s resources are kept for
cleanupTime: 3

taskReview: false

# firstUserSecret:
  # name:
  # passKey:
  # firstName:
  # lastName:
  # email:

# Dagster system user configuration
dagster:
  # enabled: Set to true in your deployment if using Dagster
  systemUser:
    # password: Leave blank for auto-generated secure password, or set custom password
    # password: "your-secure-password-here"

federatedNode:
  allow_delivery_api: false
  enable_image_whitelist: false
  port: 5000
  volumes:
    results_path: /mnt/results
    task_pod_results_path: /mnt/data

storage:
  capacity: 10Gi
  mountOptions: []
  # azure:
    # secretName:
    # shareName:
    # provisioner:
  # aws:
    # fileSystemId:
    # accessPointId:
  # nfs:
    # provisioner:
    # url:
    # path:
  # local: {}
    # Local storage that will be shared with the backend
    # path: /data/results
    # Local storage that will be shared with the db
    # dbpath: /data/db


pullPolicy: Always

# If using a reverse proxy, or ssl certificates, this will set the hostname
host: &host
tls:
  secretName: &tls tls

# Running on azure?
on_aks: false
# Running on AWS?
on_eks: false

# Set the domains that are allowed to send requests
# to the federated node, in case there is a web UI that tries to
# ping the FN
integrations:
  domains:
    - self

certs:
  rotationPolicy: Never
  azure:
    # secretName:
    # configmap:
  aws: ""

# Enables full smoketests when running `helm test`.
# This will actively try to add new database and keycloak entries
# and then remove them as part of the cleanup process. Basic tests will be carried anyway.
# If not comfortable with these smoketests, do no overwrite this value.
smoketests: false

outboundMode: false

##SUBCHARTS
### Task controller
fn-task-controller:
  controller: {}
    # tag:

  storage: {}
    # size:
    # local:
    #   path:

  idp: {}
    # github:
    #   secret_name:
    #   secret_key:
    #   clientid_key:
  delivery:
    github: {}
      # repository:
    other: {}
      # url
      # auth_type

### Cert manager
cert-manager:
  enabled: false
  namespace: fn-certmanager
  installCRDs: true

### Ingress
traefik:
  gateway:
    enabled: false
    name: traefik-fn-gateway
  gatewayClass:
    name: traefik-fn-gateway-class
  providers:
    kubernetesCRD:
      enabled: true
    kubernetesGateway:
      enabled: true
    kubernetesIngress:
      enabled: false
  enabled: false
  api:
    dashboard: false
  # service:
  #   spec:
  ## in case you want to preserve the previous external ips
  #     externalIPs:
  #       -
  ## For AKS only
  #     externalTrafficPolicy: Local

### Dagster Internal Config
fnDagster:
  artifactMountPath: /mnt/dagster/artifacts
  artifactsPvcName: artifacts-pvc
  createDB: false
  gh: {}
    # delivery_repo: owner/repo
    # resultsDir: "mgmt/results"
  db:
    name: dagster
    user: dagster_admin
    # host: your-db-host
    secret:
      name: dagster-postgresql-secret
      key: postgresql-password

### Dagster Subchart Config
dagster:
  enabled: false

  generatePostgresqlPasswordSecret: false

  postgresql:
    enabled: false
    # postgresqlHost: db.fn.svc
    # postgresqlDatabase: dagster
    # postgresqlUsername: admin
  #   service:
  #     port: 5432
  #   persistence:
  #     enabled: true
  #     storageClass: standard

  runLauncher:
    type: K8sRunLauncher
    config:
      k8sRunLauncher:
        # Change with caution! If you're using a fixed tag for pipeline run images, changing the
        # image pull policy to anything other than "Always" will use a cached/stale image, which is
        # almost certainly not what you want.
        imagePullPolicy: "Always"
        # The run launcher can be deployed with a fixed image (no user code included)
        image:
          # When a tag is not supplied for a Dagster provided image,
          # it will default as the Helm chart version.
          repository: localhost:5001/dagster-fn
          tag: "v1"
          pullPolicy: "Always"

        envConfigMaps:
          - name: dagster-env-config

        envSecrets:
          - name: github-token

        # Add volumes and volume mounts for artifacts-pvc
        volumes:
          - name: artifacts-pvc
            persistentVolumeClaim:
              claimName: artifacts-pvc
        volumeMounts:
          - name: artifacts-pvc
            mountPath: /mnt/dagster/artifacts

  dagsterDaemon:
    extraPrependedInitContainers:
      - name: wait-for-db
        image: ghcr.io/aridhia-open-source/alpine:1.9.0
        imagePullPolicy: Always
        command:
          - sh
          - -c
          - |
            until pg_isready -h $DAGSTER_PG_HOST -p 5432; do
              echo "waiting for postgres..."
              sleep 2
            done
        env:
          - name: DAGSTER_PG_HOST
            valueFrom:
              configMapKeyRef:
                name: dagster-env-config
                key: DAGSTER_PG_HOST

  dagsterWebserver:
    extraPrependedInitContainers:
      - name: wait-for-db
        image: ghcr.io/aridhia-open-source/alpine:1.9.0
        imagePullPolicy: Always
        command:
          - sh
          - -c
          - |
            until pg_isready -h $DAGSTER_PG_HOST -p 5432; do
              echo "waiting for postgres..."
              sleep 2
            done
        env:
          - name: DAGSTER_PG_HOST
            valueFrom:
              configMapKeyRef:
                name: dagster-env-config
                key: DAGSTER_PG_HOST

  dagster-user-deployments:
    # Creates a workspace file with the gRPC servers hosting your user code.
    enabled: true
    # If you plan on deploying user code in a separate Helm release, set this to false.
    enableSubchart: true

    # Specify secrets to run user code server containers based on images in private registries. See:
    # https://kubernetes.io/docs/concepts/containers/images/#referring-to-an-imagepullsecrets-on-a-pod
    imagePullSecrets: []

    # List of unique deployments
    deployments:
      - name: "dagster-fn"
        port: 3030
        image:
          # When a tag is not supplied, it will default as the Helm chart version.
          repository: localhost:5001/dagster-fn
          tag: "v1"

          # Change with caution! If you're using a fixed tag for pipeline run images, changing the
          # image pull policy to anything other than "Always" will use a cached/stale image, which is
          # almost certainly not what you want.
          pullPolicy: "Always"

        envConfigMaps:
          - name: dagster-env-config

        envSecrets:
          - name: github-token

        # Arguments to `dagster api grpc`.
        # Ex: "dagster api grpc -m dagster_test.test_project.test_jobs.repo -a define_demo_execution_repo"
        # would translate to:
        dagsterApiGrpcArgs:
          - "-m"
          - "app.definitions"

        initContainers:
          - name: wait-for-db
            image: ghcr.io/aridhia-open-source/alpine:1.9.0
            imagePullPolicy: Always
            command:
              - sh
              - -c
              - |
                until pg_isready -h $DAGSTER_PG_HOST -p 5432; do
                  echo "waiting for postgres..."
                  sleep 2
                done
            env:
              - name: DAGSTER_PG_HOST
                valueFrom:
                  configMapKeyRef:
                    name: dagster-env-config
                    key: DAGSTER_PG_HOST
